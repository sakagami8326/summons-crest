<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>カードのレアリティ設定</title><style>*{box-sizing:border-box}body{margin:0;background:#0c111a;color:#eee5d0;font-family:system-ui,sans-serif}header{position:sticky;top:0;background:#111925;padding:20px 5vw;border-bottom:1px solid #75633e;z-index:3}h1{font-size:23px;margin:0 0 10px}p{font-size:14px;color:#c8c0af}button,select,input{font:inherit;background:#202c3a;color:#f4ead2;border:1px solid #9c875b;padding:8px 12px;border-radius:4px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}#save{background:#b79b60;color:#10151c;font-weight:bold}main{max-width:1150px;margin:25px auto;padding:0 20px}table{width:100%;border-collapse:collapse}td,th{padding:12px;text-align:left;border-bottom:1px solid #ffffff16}th{color:#c8b27e}small{display:block;color:#aaa;font-size:12px;margin-top:3px}.changed{background:#b79b6014}#status{margin:10px 0;min-height:24px;color:#dfc68d}.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}#summary{margin-left:auto}select:focus,input:focus,button:focus{outline:2px solid #ead69f}label{font-size:14px}</style><header><h1>カードのレアリティ設定</h1><p>進化前後は共通。保存するとローカルの設定ファイルに反映されます。ゲームサーバーの再起動後に有効になります。本番公開は別操作です。</p><div class="tools"><input id="search" placeholder="カード名で検索" aria-label="カード名で検索"><select id="kind" aria-label="カード種別"><option value="">全種別</option><option>クリーチャー</option><option>スペル</option><option>ウェポン</option></select><select id="rarity" aria-label="レアリティで絞り込み"><option value="">全レアリティ</option><option>N</option><option>R</option><option>UR</option></select><label><input type="checkbox" id="only">変更のみ</label><span id="summary"></span></div><div class="tools" style="margin-top:12px"><button id="save" disabled>変更を保存</button><button id="undo" disabled>未保存の変更を戻す</button><button id="export">JSONを書き出す</button><button id="import">JSONを読み込む</button><input type="file" id="file" accept="application/json,.json" hidden></div><div id="status" role="status">読み込み中…</div></header><main><table><thead><tr><th>カード名</th><th>種別・属性</th><th>現在</th><th>新しいレアリティ</th></tr></thead><tbody id="rows"></tbody></table></main><script>
let cards=[],saved={},draft={};const $=id=>document.getElementById(id),els={fire:'火',water:'水',earth:'地',wind:'風'};function values(){return Object.fromEntries(cards.map(c=>[c.id,draft[c.id]]))}function render(){const dirty=cards.filter(c=>draft[c.id]!==saved[c.id]).length;$('save').disabled=$('undo').disabled=!dirty;const counts={N:0,R:0,UR:0};cards.forEach(c=>counts[draft[c.id]]++);$('summary').textContent=`N ${counts.N} ／ R ${counts.R} ／ UR ${counts.UR}　未保存 ${dirty}件`;$('rows').replaceChildren();for(const c of cards){const changed=draft[c.id]!==saved[c.id];if($('only').checked&&!changed||$('kind').value&&c.kind!==$('kind').value||$('rarity').value&&draft[c.id]!==$('rarity').value||!(c.name+' '+(c.evo||'')).includes($('search').value.trim()))continue;const tr=document.createElement('tr');tr.classList.toggle('changed',changed);for(const text of [c.name+(c.evo?' → '+c.evo:''),c.kind+' ／ '+(els[c.elem]||'無'),saved[c.id]]){const td=document.createElement('td');td.textContent=text;tr.append(td)}const td=document.createElement('td'),select=document.createElement('select');select.setAttribute('aria-label',c.name+'のレアリティ');for(const r of ['N','R','UR'])select.add(new Option(r,r));select.value=draft[c.id];select.onchange=()=>{draft[c.id]=select.value;$('status').textContent='変更はまだ保存されていません';render()};td.append(select);tr.append(td);$('rows').append(tr)}}async function init(){const d=await(await fetch('/api/cards')).json();cards=Object.entries(d.groups).flatMap(([k,g])=>Object.entries(g).map(([id,c])=>({...c,id,kind:{CREATURES:'クリーチャー',SPELLS:'スペル',SUPPORTS:'ウェポン'}[k]})));saved=Object.fromEntries(cards.map(c=>[c.id,c.rarity==='L'?'UR':c.rarity|| (c.kind==='ウェポン'?'R':'N')]));draft={...saved};$('status').textContent=`${cards.length}件を読み込みました`;render()}for(const id of ['search','kind','rarity','only'])$(id).oninput=render;$('undo').onclick=()=>{draft={...saved};render();$('status').textContent='未保存の変更を戻しました'};$('save').onclick=async()=>{try{$('save').disabled=true;const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(values())}),d=await r.json();if(!r.ok)throw Error(d.error);saved={...draft};render();$('status').textContent='保存しました。次回のゲームサーバー起動から反映されます。'}catch(e){$('status').textContent='保存失敗: '+e.message;$('save').disabled=false}};$('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(values(),null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='card-rarities.json';a.click();URL.revokeObjectURL(u)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!d||Array.isArray(d)||typeof d!=='object')throw Error('形式が不正です');for(const[id,r]of Object.entries(d))if(!Object.hasOwn(saved,id)||!['N','R','UR'].includes(r))throw Error('不明なカードまたはレアリティ: '+id);draft={...draft,...d};render();$('status').textContent='読み込みました。変更を保存すると反映されます。'}catch(e){$('status').textContent=e.message}e.target.value=''};window.onbeforeunload=e=>{if(cards.some(c=>draft[c.id]!==saved[c.id])){e.preventDefault();e.returnValue=''}};init().catch(e=>$('status').textContent=e.message);
</script></html>
