<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#141227">
<title>Summons Crest — 手元</title>
<style>
  :root { --ink:#141227; --ink2:#1E1B3C; --gold:#C9A227; --gold-soft:#EFD98F; --parchment:#F1E8D0; }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  body { background:radial-gradient(ellipse at 50% 0%, #2A2650 0%, var(--ink) 70%);
         height:100dvh; overflow:hidden; color:var(--parchment);
         font-family:"Hiragino Mincho ProN","Yu Mincho",serif; user-select:none; }
  #rotate { display:none; position:fixed; inset:0; z-index:99; background:var(--ink);
        align-items:center; justify-content:center; flex-direction:column; gap:14px;
        font-size:17px; letter-spacing:3px; }
  #rotate .ic { font-size:52px; animation:tilt 1.6s ease-in-out infinite alternate; }
  @keyframes tilt { to { transform:rotate(-90deg); } }
  @media (orientation:portrait) { body.ingame #rotate { display:flex; } }

  /* 参加フォーム(縦横どちらでも) */
  #join { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
        padding-top:6dvh; gap:12px; z-index:50; background:var(--ink); }
  #join img { height:16dvh; }
  #join input { font-family:inherit; font-size:17px; text-align:center; letter-spacing:3px;
        background:var(--ink2); color:var(--parchment); border:1px solid var(--gold);
        border-radius:10px; padding:11px; width:min(70vw, 300px); }
  #join button { font-family:inherit; font-size:16px; letter-spacing:3px; padding:12px;
        width:min(70vw, 300px); background:linear-gradient(180deg,#E8C55A,#B8901F);
        color:#241C05; border:1px solid #F2D062; border-radius:10px; cursor:pointer; }
  #err { color:#F09595; font-size:13px; min-height:1.2em; }

  header { display:flex; align-items:center; gap:10px; height:18dvh;
        padding:6px calc(12px + env(safe-area-inset-right)) 6px calc(12px + env(safe-area-inset-left)); }
  .me { display:flex; align-items:center; gap:8px; background:rgba(0,0,0,.35);
        border:1px solid var(--gold); border-radius:999px; padding:4px 14px 4px 5px; flex:none; }
  .me > img { width:12dvh; height:12dvh; border-radius:50%; border:2px solid var(--gold); object-fit:cover; flex:none; }
  .me .nm { font-size:2.4dvh; letter-spacing:1px; }
  .me .st { font-size:2.1dvh; color:var(--gold-soft); font-family:sans-serif; }
  #msg { flex:1; text-align:center; font-size:2.5dvh; letter-spacing:2px; color:var(--gold-soft);
        text-shadow:0 1px 4px rgba(0,0,0,.6); min-width:0; }
  #fsBtn { font-family:inherit; font-size:12px; background:rgba(0,0,0,.4); color:rgba(241,232,208,.8);
        border:1px solid rgba(201,162,39,.5); border-radius:7px; padding:5px 9px; }

  #action { height:27dvh; display:flex; align-items:center; justify-content:center; gap:14px;
        padding:0 16px; overflow:hidden; }
  .abtn { font-family:inherit; font-size:2.3dvh; letter-spacing:2px; padding:1.8dvh 3.4dvh;
        background:linear-gradient(180deg,#E8C55A,#B8901F); color:#241C05;
        border:2px solid #F2D062; border-radius:12px; cursor:pointer;
        box-shadow:0 4px 14px rgba(0,0,0,.5); }
  .abtn:active { transform:scale(.96); }
  .abtn:disabled { filter:grayscale(.75) brightness(.55); }
  .abtn.ghost { background:transparent; color:var(--gold-soft); border:1px solid var(--gold); box-shadow:none; }
  .abtn.danger { background:linear-gradient(180deg,#D96A50,#A3402B); border-color:#F0937B; color:#2A0B05; }
  .btnCol { display:flex; flex-direction:column; gap:8px; max-height:27dvh; overflow-y:auto; padding:4px; }
  .btnCol .abtn { font-size:1.9dvh; padding:1.2dvh 2.4dvh; text-align:left; }
  .waitDots { font-size:4dvh; color:var(--gold); letter-spacing:6px; animation:blink 1.2s infinite; }
  @keyframes blink { 50% { opacity:.3; } }

  /* 3Dダイス */
  #diceBtn { width:16dvh; height:16dvh; border-radius:50%; font-size:2.5dvh; white-space:nowrap;
        box-shadow:0 0 0 8px rgba(201,162,39,.15), 0 4px 14px rgba(0,0,0,.5); }
  .diceStage { position:relative; width:15dvh; height:18dvh; perspective:700px; }
  .diceStage.drop { animation:dbounce 1.4s cubic-bezier(.3,.6,.4,1); }
  @keyframes dbounce { 0%{transform:translateY(-15dvh)} 52%{transform:translateY(0)}
    68%{transform:translateY(-4dvh)} 80%{transform:translateY(0)} 89%{transform:translateY(-1.4dvh)} 100%{transform:translateY(0)} }
  .dice3d { position:absolute; left:50%; top:42%; width:11dvh; height:11dvh; margin:-5.5dvh 0 0 -5.5dvh;
        transform-style:preserve-3d; }
  .dface { position:absolute; inset:0; background:linear-gradient(160deg,#F5EDD8,#DCCFA8);
        border:2px solid var(--gold); border-radius:1.6dvh; backface-visibility:hidden;
        display:flex; align-items:center; justify-content:center;
        box-shadow:inset 0 0 1.4dvh rgba(90,59,20,.25); }
  .dface svg { width:74%; height:74%; }
  .f1{transform:translateZ(5.5dvh)} .f2{transform:rotateX(90deg) translateZ(5.5dvh)}
  .f3{transform:rotateY(90deg) translateZ(5.5dvh)} .f4{transform:rotateY(-90deg) translateZ(5.5dvh)}
  .f5{transform:rotateX(-90deg) translateZ(5.5dvh)} .f6{transform:rotateY(180deg) translateZ(5.5dvh)}

  /* 手札 */
  #handWrap { height:55dvh; padding:0 calc(10px + env(safe-area-inset-right))
        calc(6px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left)); }
  #hand { display:flex; gap:10px; height:100%; overflow-x:auto; padding:14px 6px 4px; }
  .card { flex:none; width:28dvh; height:100%; position:relative; perspective:700px; cursor:pointer;
        transition:transform .15s; }
  .card.sel { transform:translateY(-12px); }
  .card.sel .face { border-color:#F2D062; box-shadow:0 0 0 2px #F2D062, 0 8px 20px rgba(242,208,98,.4); }
  .card.dim { filter:brightness(.6) saturate(.6); cursor:default; }
  .flip { position:absolute; inset:0; transform-style:preserve-3d;
        transition:transform .55s cubic-bezier(.3,1.4,.5,1); }
  .flip.flipped { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; backface-visibility:hidden; border-radius:10px;
        background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22300%22%20height%3D%22470%22%3E%3Cdefs%3E%3Cfilter%20id%3D%22g%22%3E%3CfeTurbulence%20type%3D%22fractalNoise%22%20baseFrequency%3D%220.55%22%20numOctaves%3D%222%22%20seed%3D%229%22%20result%3D%22n%22%2F%3E%3CfeColorMatrix%20in%3D%22n%22%20values%3D%220%200%200%200%200.32%200%200%200%200%200.25%200%200%200%200%200.13%200%200%200%200.28%200%22%20result%3D%22c%22%2F%3E%3CfeComposite%20in%3D%22c%22%20operator%3D%22in%22%20in2%3D%22SourceAlpha%22%2F%3E%3C%2Ffilter%3E%3CradialGradient%20id%3D%22v%22%20cx%3D%2250%25%22%20cy%3D%2242%25%22%20r%3D%2280%25%22%3E%3Cstop%20offset%3D%2252%25%22%20stop-color%3D%22%235A3B14%22%20stop-opacity%3D%220%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%235A3B14%22%20stop-opacity%3D%220.34%22%2F%3E%3C%2FradialGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22300%22%20height%3D%22470%22%20fill%3D%22%23EDE1BF%22%2F%3E%3Crect%20width%3D%22300%22%20height%3D%22470%22%20fill%3D%22%23000%22%20filter%3D%22url%28%23g%29%22%2F%3E%3Crect%20width%3D%22300%22%20height%3D%22470%22%20fill%3D%22url%28%23v%29%22%2F%3E%3C%2Fsvg%3E") center / cover; color:#3A2B18; border:2px solid #2C2A4A;
        padding:8px; display:flex; flex-direction:column; align-items:center;
        box-shadow:0 3px 8px rgba(0,0,0,.45); overflow:hidden; }
  .face::before { content:""; position:absolute; inset:4px; border:1px solid rgba(201,162,39,.85);
        border-radius:7px; pointer-events:none; }
  .face.back { transform:rotateY(180deg); border-color:#8A6A1E;
        box-shadow:inset 0 0 40px rgba(201,162,39,.25), 0 3px 8px rgba(0,0,0,.45); }
  .evoRibbon { position:absolute; top:12px; left:-34px; transform:rotate(-38deg);
        background:linear-gradient(180deg,#E8C55A,#B8901F); color:#241C05; font-size:1.5dvh;
        letter-spacing:2px; padding:2px 38px; box-shadow:0 1px 4px rgba(0,0,0,.4); }
  .face .cost { position:absolute; top:6px; left:6px; width:4.4dvh; height:4.4dvh; border-radius:50%;
        background:#2C2A4A; color:var(--gold-soft); display:flex; align-items:center; justify-content:center;
        font-size:1.7dvh; font-family:sans-serif; border:1px solid var(--gold); z-index:2; }
  .face .art { height:50%; display:flex; align-items:flex-end; justify-content:center; margin-top:6.2dvh; }
  .face .art img { max-height:100%; filter:drop-shadow(0 3px 4px rgba(58,43,24,.35)); }
  .face .tok2 { width:10dvh; height:10dvh; border-radius:50%; margin-top:6.5dvh; color:#F6EFDD;
        display:flex; align-items:center; justify-content:center; font-size:2dvh; border:3px solid #2C2A4A; }
  .face .glyph { height:54%; display:flex; align-items:center; justify-content:center;
        font-size:8.5dvh; margin-top:3dvh; color:#2C2A4A; }
  .face .nm { font-size:1.9dvh; letter-spacing:1px; margin-top:.6dvh; }
  .face .stats { display:flex; gap:8px; font-family:sans-serif; font-size:1.6dvh; margin-top:.4dvh; }
  .face .stats b { color:#A3402B; } .face .stats i { color:#2E5E4E; font-style:normal; }
  .face .stats .up { color:#8A6A1E; font-weight:700; }
  .face .type { position:absolute; bottom:5px; right:9px; font-size:1.3dvh; color:rgba(58,43,24,.6); }
  .flipBtn { position:absolute; bottom:5px; left:7px; z-index:5; font-family:inherit; font-size:1.4dvh;
        background:#2C2A4A; color:var(--gold-soft); border:1px solid var(--gold);
        border-radius:999px; padding:2px 9px; cursor:pointer; }

  /* ショップシーン */
  #shopScene { position:fixed; inset:0; display:none; z-index:40;
      background:url('/assets/shop_bg.jpg') center / cover; }
  #shopScene.on { display:block; }
  #shopScene .keeper { position:absolute; left:2vw; bottom:0; height:72dvh;
      filter:drop-shadow(0 0 20px rgba(0,0,0,.6)); }
  #shopScene .bubble { position:absolute; left:24vw; top:4dvh; background:var(--parchment);
      color:#3A2B18; font-size:2.4dvh; letter-spacing:1px; padding:1.4dvh 2.6dvh;
      border-radius:1.6dvh; border:2px solid #8A6A1E; max-width:36vw; }
  #shopBtns { position:absolute; right:calc(2vw + env(safe-area-inset-right)); top:4dvh; bottom:3dvh;
      width:52vw; display:flex; flex-direction:column; gap:1.6dvh; overflow-y:auto; padding:4px; }
  .shopBtn { font-family:inherit; font-size:2.5dvh; letter-spacing:1px; padding:2.2dvh 2.6dvh;
      background:linear-gradient(180deg,#E8C55A,#B8901F); color:#241C05; text-align:left;
      border:2px solid #F2D062; border-radius:1.6dvh; cursor:pointer; flex:none;
      box-shadow:0 3px 10px rgba(0,0,0,.5); }
  .shopBtn:active { transform:scale(.97); }
  .shopBtn.ghost { background:rgba(20,18,39,.75); color:var(--gold-soft); border:1px solid var(--gold); }
  /* ドロー開帳 */
  #drawModal { position:fixed; inset:0; display:none; z-index:60; align-items:center;
      justify-content:center; background:rgba(10,8,25,.85); }
  #drawModal.on { display:flex; }
  #drawCard { width:38dvh; height:58dvh; animation:drawIn .55s cubic-bezier(.2,1.2,.4,1); }
  @keyframes drawIn { from { transform:scale(.3) rotateY(180deg); opacity:0; } }
  #drawModal .tap { position:absolute; bottom:6dvh; width:100%; text-align:center;
      font-size:2dvh; letter-spacing:3px; color:rgba(241,232,208,.8); }

  /* キャラ選択 */
  #charSel { position:fixed; left:0; right:0; top:15dvh; bottom:0; display:none; z-index:35;
      flex-direction:column; align-items:center; gap:1dvh; }
  #charSel.on { display:flex; }
  #csRow { display:flex; gap:2vw; flex:1; width:100%; justify-content:center;
      padding:0 calc(2vw + env(safe-area-inset-left)); overflow-x:auto; }
  .csCard { flex:none; width:21vw; border-radius:1.6dvh; border:2px solid var(--cc);
      background:rgba(0,0,0,.35); display:flex; flex-direction:column; align-items:center;
      padding:1.4dvh 1dvh; cursor:pointer; transition:transform .15s; }
  .csCard:active { transform:scale(.97); }
  .csCard img { height:42dvh; object-fit:contain; filter:drop-shadow(0 4px 8px rgba(0,0,0,.5)); }
  .csCard .csName { font-size:2.4dvh; letter-spacing:2px; margin-top:.8dvh; }
  .csCard .csState { font-size:1.6dvh; color:rgba(241,232,208,.75); min-height:1.4em; }
  .csCard.mine { box-shadow:0 0 0 3px #F2D062, 0 0 20px rgba(242,208,98,.5); }
  .csCard.dim { filter:brightness(.5) saturate(.5); cursor:default; }
  /* ダイス画像ボタン */
  .diceImgBtn { background:none; border:none; cursor:pointer; padding:0; }
  .diceImgBtn img { height:23dvh; filter:drop-shadow(0 5px 14px rgba(0,0,0,.55)); transition:transform .12s; }
  .diceImgBtn:active img { transform:scale(.93); }

  .face .fx { font-size:1.32dvh; color:#5C4A2E; text-align:center; padding:0 8px;
      line-height:1.35; min-height:2.4dvh; }
  #draftOv { position:fixed; inset:0; display:none; z-index:56; background:rgba(10,8,25,.92);
      flex-direction:column; align-items:center; padding-top:2dvh; gap:1.4dvh; }
  #draftOv.on { display:flex; }
  #draftTitle { font-size:2.4dvh; letter-spacing:3px; color:var(--gold-soft); }
  #draftRow { display:flex; gap:2.4vw; flex:1; align-items:center; padding-bottom:2dvh; }
  .draftCard { width:30dvh; height:46dvh; cursor:pointer; transition:transform .15s; position:relative; }
  .draftCard .face .art img { max-width:100%; object-fit:contain; }
  .draftCard:active { transform:scale(.96); }
  .draftCard .face { position:relative; height:100%; }

  /* クリーチャー一覧(図鑑) */
  #galleryBtn { font-family:inherit; font-size:15px; padding:8px 16px !important; background:rgba(0,0,0,.4); color:rgba(241,232,208,.85);
      border:1px solid rgba(201,162,39,.5); border-radius:7px; padding:5px 9px; margin-right:6px; }
  #galleryOv { position:fixed; inset:0; display:none; z-index:57; background:rgba(10,8,25,.96);
      flex-direction:column; }
  #galleryOv.on { display:flex; }
  .gTop { display:flex; align-items:center; gap:14px; padding:1.4dvh calc(14px + env(safe-area-inset-left));
      height:9dvh; flex:none; }
  .gTop .ttl { font-size:2.4dvh; letter-spacing:3px; color:var(--gold-soft); }
  .gTop label { display:flex; align-items:center; gap:6px; font-size:1.9dvh; color:rgba(241,232,208,.85);
      margin-left:auto; }
  .gTop input[type=checkbox] { width:2.4dvh; height:2.4dvh; accent-color:#C9A227; }
  .gTop .gClose { font-family:inherit; font-size:1.9dvh; background:transparent; color:var(--gold-soft);
      border:1px solid var(--gold); border-radius:8px; padding:.8dvh 2.2dvh; }
  #gGrid { flex:1; overflow-y:auto; display:flex; flex-wrap:wrap; gap:1.6dvh;
      padding:0 calc(14px + env(safe-area-inset-left)) 3dvh; align-content:flex-start;
      justify-content:center; }
  .gCard { flex:none; width:19.5dvh; height:30dvh; position:relative; perspective:700px; cursor:pointer; }
  #galZoom { position:fixed; inset:0; display:none; z-index:62; align-items:center;
      justify-content:center; background:rgba(10,8,25,.88); }
  #galZoom.on { display:flex; }
  #galZoomCard { position:relative; width:38dvh; height:58dvh; animation:drawIn .4s ease; }
  #galZoom .tap { position:absolute; bottom:5dvh; width:100%; text-align:center;
      font-size:2dvh; letter-spacing:3px; color:rgba(241,232,208,.8); }

  /* レアリティ */
  .rarBadge { position:absolute; top:6px; right:6px; z-index:3; font-size:1.5dvh; font-family:serif;
      width:4dvh; height:4dvh; border-radius:50%; display:flex; align-items:center; justify-content:center;
      color:#F6EFDD; text-shadow:0 1px 2px rgba(0,0,0,.5); }
  .rarBadge.N { background:#6E7288; } .rarBadge.R { background:linear-gradient(160deg,#5C7FD8,#2C4A9E); }
  .rarBadge.L { background:linear-gradient(160deg,#F2D062,#B8901F); color:#241C05; }
  .draftCard.rar-R .face { border-color:#5C7FD8; box-shadow:0 0 14px rgba(92,127,216,.6), 0 3px 8px rgba(0,0,0,.45); }
  .draftCard.rar-L .face { border-color:#F2D062;
      box-shadow:0 0 20px rgba(242,208,98,.85), 0 0 44px rgba(242,208,98,.4), 0 3px 8px rgba(0,0,0,.45); }
  .draftCard.rar-L .face::after { content:""; position:absolute; inset:0; border-radius:8px; pointer-events:none;
      background:linear-gradient(115deg, transparent 30%, rgba(255,230,160,.35) 42%,
        rgba(160,220,255,.3) 50%, rgba(255,180,230,.3) 58%, transparent 70%);
      background-size:280% 280%; animation:holo 2.2s linear infinite; }
  @keyframes holo { 0% { background-position:120% 0; } 100% { background-position:-60% 0; } }
  .draftCard.rar-L::before { content:"✦"; position:absolute; top:-1.6dvh; left:50%; transform:translateX(-50%);
      z-index:4; color:#F2D062; font-size:2.6dvh; text-shadow:0 0 10px #F2D062; animation:blink 1s infinite; }

  .ultBtn { font-family:inherit; font-size:2.2dvh; letter-spacing:2px; padding:1.6dvh 3dvh;
      background:linear-gradient(160deg,#3A2E58,#1E1B3C); color:#F2D062;
      border:2px solid #F2D062; border-radius:12px; cursor:pointer;
      box-shadow:0 0 14px rgba(242,208,98,.5); animation:ultpulse 1.4s ease-in-out infinite; }
  @keyframes ultpulse { 0%,100% { box-shadow:0 0 10px rgba(242,208,98,.4); }
      50% { box-shadow:0 0 24px rgba(242,208,98,.85); } }

  .csCard .csUlt { font-size:1.5dvh; line-height:1.5; color:rgba(241,232,208,.85);
      background:rgba(0,0,0,.4); border-radius:1dvh; padding:.8dvh 1.2dvh; margin-top:.6dvh;
      min-height:6.5dvh; }
  .csCard .csUlt b { color:var(--gold-soft); }

  .face .elemIc { position:absolute; top:1dvh; left:50%; transform:translateX(-50%);
      width:4.6dvh; height:4.6dvh; border-radius:50%; background:rgba(20,18,39,.85);
      border:1px solid var(--gold); display:flex; align-items:center; justify-content:center; z-index:2; }
  .face .elemIc svg { width:70%; height:70%; }
  .face .elemIc.none { color:#9AA0B0; font-size:1.7dvh; font-family:serif; }
  /* ULT確認 */
  #ultConfirm { position:fixed; inset:0; display:none; z-index:64; align-items:center;
      justify-content:center; background:rgba(10,8,25,.85); }
  #ultConfirm.on { display:flex; }
  .ucBox { width:min(70vw, 60dvh); background:var(--ink2); border:2px solid #F2D062;
      border-radius:2dvh; padding:3dvh; text-align:center; box-shadow:0 0 30px rgba(242,208,98,.4); }
  .ucBox .ucn { font-size:2.8dvh; letter-spacing:3px; color:var(--gold-soft); }
  .ucBox .ucd { font-size:2dvh; color:rgba(241,232,208,.9); margin:1.6dvh 0; line-height:1.7; }

  /* ショップ2列 */
  #shopBtns { display:grid !important; grid-template-columns:1fr 1fr; gap:1.2dvh;
      align-content:start; }
  .shopBtn .sbT { font-size:2dvh; letter-spacing:1px; }
  .shopBtn .sbD { font-size:1.5dvh; color:rgba(36,28,5,.75); margin-top:.5dvh; line-height:1.4; }
  .shopBtn.ghost .sbD { color:rgba(241,232,208,.6); }
  .shopBtn.full { grid-column:1 / -1; text-align:center; }
</style>
</head>
<body>
  <div id="connBar" style="display:none; position:fixed; top:0; left:50%; transform:translateX(-50%);
    z-index:98; background:#5A1512; color:#F5B0A5; font-size:1.8dvh; letter-spacing:2px;
    padding:.8dvh 3dvh; border-radius:0 0 1.2dvh 1.2dvh; border:1px solid #E86A5A; border-top:0;">⚡ 再接続中…</div>

const GLYPH = { weapon:'⚔', gweapon:'⚔', shield:'🛡', gshield:'🛡', jinx:'❂' };

let es = null, lastMsgAt = 0;
function connect() {
  if (es) es.close();
  es = new EventSource('/api/events?room=' + room + '&me=' + pid);
  es.onmessage = e => {
    lastMsgAt = Date.now();
    $('connBar').style.display = 'none';
    state = JSON.parse(e.data);
    render();
  };
  es.onerror = () => { $('connBar').style.display = 'block'; };
}
function enterGame() {
  $('join').style.display = 'none';
  ['hdr','action','handWrap'].forEach(id => $(id).style.display = '');
  document.body.classList.add('ingame');
  connect();
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && room && Date.now() - lastMsgAt > 8000) connect();
});
$('joinBtn').onclick = async () => {
  const r = await fetch('/api/join', { method:'POST', body: JSON.stringify({
    room: $('codeIn').value.trim().toUpperCase(), name: $('nameIn').value.trim() }) });
  const d = await r.json();
  if (d.error) { $('err').textContent = d.error; return; }
  room = d.room; pid = d.playerId;
  try { localStorage.setItem('sc_session', JSON.stringify({ room, pid })); } catch (e) {}
  enterGame();
};
// 保存済みセッションがあれば自動復帰
(async () => {
  let sess = null;
  try { sess = JSON.parse(localStorage.getItem('sc_session') || 'null'); } catch (e) {}
  if (!sess) return;
  try {
    const r = await fetch('/api/resume', { method:'POST',
      body: JSON.stringify({ room: sess.room, playerId: sess.pid }) });
    if (!r.ok) throw 0;
    room = sess.room; pid = sess.pid;
    enterGame();
  } catch (e) {
    try { localStorage.removeItem('sc_session'); } catch (e2) {}
  }
})();
$('fsBtn').onclick = async () => {
  if (!document.fullscreenElement) {
    await document.documentElement.requestFullscreen({ navigationUI:'hide' }).catch(() => {});
    try { await screen.orientation.lock('landscape'); } catch (e) {}
  } else document.exitFullscreen();
};
const choose = optionId => {
  fetch('/api/action', { method:'POST', body: JSON.stringify({ room, type:'choose', playerId: pid, optionId }) });
};
document.getElementById('drawModal').onclick = () => $('drawModal').classList.remove('on');
let galleryEvo = false;
function artOrToken(cid, cr, evo, tokSize) {
  if (HAS_ART.has(cid))
    return `<div class="art"><img src="/assets/${evo ? 'e_' : 'c_'}${cid}.png"></div>`;
  const nm = evo && cr.evo ? cr.evo : cr.name;
  return `<div class="tok2" style="background:${RUNE[cr.elem] || '#6E7288'};width:${tokSize};height:${tokSize}">${nm.slice(0,4)}</div>`;
}
function galleryFace(cid, cr, evo) {
  if (evo) return `<div class="face back" style="transform:rotateY(180deg)">
    ${cr.elem ? `<div class="elemIc"><svg viewBox="-34 -36 68 72">${ELEM_MINI[cr.elem]}</svg></div>` : `<div class="elemIc none">無</div>`}${artOrToken(cid, cr, true, '9dvh')}
    <div class="nm">${cr.evo}</div>
    <div class="stats"><span>ST <b>${cr.evoSt}</b></span><span>HP <i>${cr.evoHp}</i></span></div>
    <div class="fx">${cr.fx || ''}</div><div class="type">進化形</div></div>`;
  return `<div class="face front"><div class="cost">${cr.cost}G</div>
    ${cr.elem ? `<div class="elemIc"><svg viewBox="-34 -36 68 72">${ELEM_MINI[cr.elem]}</svg></div>` : `<div class="elemIc none">無</div>`}${artOrToken(cid, cr, false, '9dvh')}
    <div class="nm">${cr.name}</div>
    <div class="stats"><span>ST <b>${cr.st}</b></span><span>HP <i>${cr.hp}</i></span></div>
    <div class="fx">${cr.fx || ''}</div>
    <div class="rarBadge ${cr.rarity || 'N'}">${cr.rarity || 'N'}</div>
    <div class="type">クリーチャー</div></div>`;
}
function buildGallery() {
  const C = state.catalog.CREATURES;
  $('gGrid').innerHTML = Object.entries(C).filter(([cid]) => !cid.endsWith('_f')).map(([cid, cr]) => `
    <div class="gCard" data-cid="${cid}">
      <div class="flip" data-evo="${cr.evo ? 1 : 0}">
        ${galleryFace(cid, cr, false)}
        ${cr.evo ? galleryFace(cid, cr, true) : ''}
      </div>
    </div>`).join('');
  applyGalleryFlip(false);
  document.querySelectorAll('.gCard').forEach(el => el.onclick = () => {
    const cid = el.dataset.cid, cr = state.catalog.CREATURES[cid];
    $('galZoomCard').innerHTML = galleryFace(cid, cr, galleryEvo && !!cr.evo)
      .replace('rotateY(180deg)', 'none');
    $('galZoom').classList.add('on');
  });
}
function applyGalleryFlip(animate) {
  document.querySelectorAll('#gGrid .flip').forEach((f, i) => {
    f.style.transitionDelay = animate ? (i * 45) + 'ms' : '0ms';
    f.classList.toggle('flipped', galleryEvo && f.dataset.evo === '1');
  });
}
$('galleryBtn').onclick = () => { if (!state) return; buildGallery(); $('galleryOv').classList.add('on'); };
$('galleryClose').onclick = () => $('galleryOv').classList.remove('on');
$('galleryEvoChk').onchange = e => { galleryEvo = e.target.checked; applyGalleryFlip(true); };
$('galZoom').onclick = () => $('galZoom').classList.remove('on');

function bigCardHTML(c) {
  const cr = state.catalog.CREATURES[c];
  const bid0 = c.replace(/_f$/, '');
  const art = HAS_ART.has(bid0)
    ? `<div class="art" style="height:60%"><img src="/assets/${bid0 !== c ? 'e_' : 'c_'}${bid0}.png"></div>`
    : `<div class="tok2" style="background:${RUNE[cr.elem] || '#6E7288'};width:20dvh;height:20dvh;font-size:3dvh">${cr.name.slice(0,4)}</div>`;
  return `<div class="face front" style="position:relative">
    <div class="cost">${cr.cost}G</div>${cr.elem ? `<div class="elemIc"><svg viewBox="-34 -36 68 72">${ELEM_MINI[cr.elem]}</svg></div>` : `<div class="elemIc none">無</div>`}${art}
    <div class="nm" style="font-size:3dvh">${cr.name}</div>
    <div class="stats" style="font-size:2.4dvh"><span>ST <b>${cr.st}</b></span><span>HP <i>${cr.hp}</i></span></div>
    <div class="fx" style="font-size:1.7dvh">${cr.fx || ''}</div>
    <div class="rarBadge ${cr.rarity || 'N'}">${cr.rarity || 'N'}</div>
    <div class="type">クリーチャー</div></div>`;
}

const me = () => state.players.find(p => p.id === pid);
const pend = () => state.pending[pid];

// 手札の各カードが「今どの選択肢に対応するか」
function cardOption(c) {
  const p = pend();
  if (!p) return null;
  const map = { tile: 'summon:' + c, pick_creature: 'atk:' + c, support: 'sup:' + c };
  const oid = map[p.type];
  return oid && p.options.some(o => o.id === oid) ? oid : null;
}
function selectableKind() {
  const p = pend();
  if (!p) return null;
  if (p.type === 'tile' && p.options.some(o => o.id.startsWith('summon:'))) return 'creature';
  if (p.type === 'pick_creature') return 'creature';
  if (p.type === 'support') return 'support';
  return null;
}

function cardHTML(c, i) {
  const C = state.catalog;
  const cr = C.CREATURES[c], sp = C.SUPPORTS[c];
  const kind = cr ? 'creature' : 'support';
  const skind = selectableKind();
  const dim = skind && kind !== skind || (skind && !cardOption(c));
  const sel = selected === i;
  let front, back = '';
  if (cr) {
    const bid = c.replace(/_f$/, '');
    const art = HAS_ART.has(bid)
      ? `<div class="art"><img src="/assets/${bid !== c ? 'e_' : 'c_'}${bid}.png"></div>`
      : `<div class="tok2" style="background:${RUNE[cr.elem] || '#6E7288'}">${cr.name.slice(0,4)}</div>`;
    front = `<div class="cost">${cr.cost}G</div>${cr.elem ? `<div class="elemIc"><svg viewBox="-34 -36 68 72">${ELEM_MINI[cr.elem]}</svg></div>` : `<div class="elemIc none">無</div>`}${art}
      <div class="nm">${cr.name}</div>
      <div class="stats"><span>ST <b>${cr.st}</b></span><span>HP <i>${cr.hp}</i></span></div>
      <div class="fx">${cr.fx || ''}</div>
      <div class="rarBadge ${cr.rarity || 'N'}">${cr.rarity || 'N'}</div>
      <div class="type">クリーチャー</div>
      ${cr.evo ? `<button class="flipBtn" data-i="${i}">進化 ⟳</button>` : ''}`;
    if (cr.evo) {
      const eart = HAS_ART.has(c)
        ? `<div class="art"><img src="/assets/e_${c}.png"></div>`
        : `<div class="tok2" style="background:${RUNE[cr.elem] || '#6E7288'}">${cr.evo.slice(0,4)}</div>`;
      back = `<div class="face back">${cr.elem ? `<div class="elemIc"><svg viewBox="-34 -36 68 72">${ELEM_MINI[cr.elem]}</svg></div>` : `<div class="elemIc none">無</div>`}${eart}
        <div class="nm">${cr.evo}</div>
        <div class="stats"><span>ST ${cr.st}<span class="up">→${cr.evoSt}</span></span>
          <span>HP ${cr.hp}<span class="up">→${cr.evoHp}</span></span></div>
        <div class="fx">${cr.fx || ''}</div>
        <div class="type">進化形</div>
        <button class="flipBtn" data-i="${i}">もどす ⟲</button></div>`;
    }
  } else if (C.ITEMS && C.ITEMS[c]) {
    const it = C.ITEMS[c];
    front = `<div class="glyph" style="color:#5A2E6E">☠</div><div class="nm">${it.name}</div>
      <div class="stats" style="font-size:1.3dvh; text-align:center; padding:0 4px">${it.desc}</div>
      <div class="type">妨害</div>`;
  } else {
    front = `<div class="glyph">${GLYPH[c] || '❖'}</div><div class="nm">${sp.name}</div>
      <div class="stats">${sp.st ? 'ST+' + sp.st : ''}${sp.hp ? 'HP+' + sp.hp : ''}${sp.jinx ? '相手の支援を無効化' : ''}</div>
      <div class="type">支援</div>`;
  }
  return `<div class="card" data-i="${i}" data-c="${c}">
    <div class="flip ${flipped.has(i) ? 'flipped' : ''}"><div class="face front">${front}</div>${back}</div></div>`;
}

let handListKey = '';
function renderHand() {
  const list = me().hand.join(',');
  if (list !== handListKey) {
    handListKey = list;
    $('hand').innerHTML = me().hand.map((c, i) => cardHTML(c, i)).join('');
    bindHand();
  }
  // 状態(選択・押下可否)は既存DOMのクラス切替のみ(画像を再構築しない)
  const skind = selectableKind();
  document.querySelectorAll('#hand .card').forEach(el => {
    const i = +el.dataset.i, c = el.dataset.c;
    el.classList.toggle('sel', selected === i);
    el.classList.toggle('dim', !!skind && !cardOption(c));
  });
}
function bindHand() {
  document.querySelectorAll('#hand .card').forEach(el => el.onclick = () => {
    const i = +el.dataset.i, c = el.dataset.c;
    if (!cardOption(c)) return;
    selected = selected === i ? null : i;
    render();
  });
  document.querySelectorAll('#hand .flipBtn').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const i = +b.dataset.i;
    flipped.has(i) ? flipped.delete(i) : flipped.add(i);
    b.closest('.flip').classList.toggle('flipped');
  });
}

const PIPS = { 1:[[30,30]], 2:[[16,16],[44,44]], 3:[[16,16],[30,30],[44,44]],
  4:[[16,16],[44,16],[16,44],[44,44]], 5:[[16,16],[44,16],[30,30],[16,44],[44,44]],
  6:[[16,16],[44,16],[16,30],[44,30],[16,44],[44,44]] };
const DICE_FACES = [1,2,3,4,5,6].map(v => `<div class="dface f${v}"><svg viewBox="0 0 60 60">${
  PIPS[v].map(([x,y]) => `<circle cx="${x}" cy="${y}" r="5.4" fill="#2C2A4A"/>`).join('')}</svg></div>`).join('');
const FACE_ROT = { 1:[0,0], 2:[-90,0], 3:[0,-90], 4:[0,90], 5:[90,0], 6:[0,180] };
let lastDiceAt = 0;

function showUltConfirm() {
  const m = me(), u = state.catalog.ULTS[m.charId];
  $('ucName').textContent = '【' + u.name + '】';
  $('ucDesc').textContent = u.desc;
  $('ultConfirm').classList.add('on');
}
function startRoll() {
  rolling = true;
  $('action').innerHTML = `<div class="diceStage drop"><div class="dice3d" id="die3d">${DICE_FACES}</div></div>`;
  const die = $('die3d');
  die.style.transition = 'none';
  die.style.transform = 'rotateX(-30deg) rotateY(25deg)';
  let spin = 0;
  const iv = setInterval(() => {
    spin += 47;
    die.style.transform = `rotateX(${spin * 1.3}deg) rotateY(${spin}deg)`;
  }, 60);
  die.dataset.iv = iv;
  choose('roll');
}
function settleDice(n) {
  const die = $('die3d');
  if (!die) { rolling = false; return; }
  clearInterval(+die.dataset.iv);
  const [fx, fy] = FACE_ROT[n];
  die.style.transition = 'transform 1.1s cubic-bezier(.16,.84,.26,1.02)';
  die.style.transform = `rotateX(${fx + 720}deg) rotateY(${fy + 1080}deg)`;
  setTimeout(() => { rolling = false; render(); }, 1400);
}

function render() {
  if (!state) return;
  const m = me(), C = state.catalog, p = pend();
  $('myFace').src = m.charId ? '/assets/f_' + m.charId + '.png' : '';
  $('myName').textContent = m.name + (m.charId ? '(' + C.CHARS[m.charId].name + ')' : '');
  const elemN = ['fire','water','earth','wind'].map(e => {
    const n = state.owners ? state.owners.filter((o, i) => o && o.player === pid && state.tiles[i].e === e).length : 0;
    return `<span style="color:${RUNE[e]}; display:inline-flex; align-items:center; gap:2px; opacity:${n ? 1 : .4}">
      <svg width="12" height="12" viewBox="-34 -36 68 72" style="vertical-align:middle">${ELEM_MINI[e]}</svg>${n}</span>`;
  }).join(' ');
  const ic = n => `<img src="/assets/${n}.png" style="height:2dvh;width:auto;vertical-align:-0.3dvh">`;
  $('myStat').innerHTML = `${m.points}/${state.target}点 ｜ ${ic('ic_gold')}${m.gold} ｜ ${ic('ic_gem')}${m.gems}<br>領地: ${elemN}`;

  // ダイスの出目が自分のものなら着地させる
  if (rolling && state.lastDice && state.lastDice.player === pid && state.lastDice.at !== lastDiceAt) {
    lastDiceAt = state.lastDice.at;
    $('msg').textContent = state.lastDice.value + ' が出た!';
    settleDice(state.lastDice.value);
    renderHand();
    return;
  }
  if (rolling) return;

  // キャラ選択オーバーレイ
  if (state.phase === 'select') {
    const opts = p && p.type === 'select_char' ? p.options.map(o => o.id) : [];
    $('charSel').classList.add('on');
    $('csMsg').textContent = p ? '使用するキャラクターをタップ'
      : (m.charId ? C.CHARS[m.charId].name + ' で決定 ─ 他のプレイヤーを待っています' : '…');
    $('csRow').innerHTML = Object.entries(C.CHARS).map(([id, c]) => {
      const taken = state.players.find(x => x.confirmed && x.charId === id && x.id !== pid);
      const mine = m.charId === id;
      const enabled = opts.includes(id);
      return `<div class="csCard ${mine ? 'mine' : ''} ${(!enabled && !mine) ? 'dim' : ''}"
        style="--cc:${c.color}" data-id="${id}">
        <img src="/assets/full_${id}.png">
        <div class="csName">${c.name}</div>
        <div class="csUlt"><b>【${(C.ULTS && C.ULTS[id]) ? C.ULTS[id].name : ''}】</b>${(C.ULTS && C.ULTS[id]) ? C.ULTS[id].desc : ''}</div>
        <div class="csState">${mine ? 'あなた' : taken ? taken.name + 'が使用' : ''}</div></div>`;
    }).join('');
    document.querySelectorAll('.csCard').forEach(el => el.onclick = () => {
      const oid = el.dataset.id;
      if ((pend() && pend().type === 'select_char') && pend().options.some(o => o.id === oid)) choose(oid);
    });
  } else $('charSel').classList.remove('on');
  if (!p || p.type !== 'draft') $('draftOv').classList.remove('on');
  // ショップシーンの開閉
  const inMarket = pend() && pend().type === 'market';
  if (!inMarket) { $('shopScene').classList.remove('on'); inShopHand = false; }
  else if (inShopHand) $('shopScene').classList.remove('on');
  // ランダムドローの開帳(手札が増えた瞬間を検出)
  const handKey = (m.hand || []).join(',');
  if (expectDraw && prevHandKey && handKey.length > prevHandKey.length) {
    const prevArr = prevHandKey.split(','), nowArr = m.hand.slice();
    for (const c of prevArr) { const k = nowArr.indexOf(c); if (k >= 0) nowArr.splice(k, 1); }
    if (nowArr[0]) {
      $('drawCard').innerHTML = bigCardHTML(nowArr[0]);
      $('drawModal').classList.add('on');
      $('pKeeper').src = '/assets/keeper_smile.png';
      $('pBubble').textContent = 'まいど! 良い引きだ';
      setTimeout(() => { $('pKeeper').src = '/assets/keeper.png'; }, 1800);
    }
    expectDraw = false;
  }
  prevHandKey = handKey;

  // テレビ側の移動アニメが終わるまで、到着系UIの表示を待つ
  {
    const pk = p ? p.type + '|' + p.prompt : '';
    if (pk !== lastPendKey) { lastPendKey = pk; pendSince = Date.now(); }
    const ld = state.lastDice;
    if (p && ['tile', 'upgrade', 'market', 'draft', 'gate', 'forge'].includes(p.type) && ld && ld.player === pid) {
      const steps = ld.multi ? ld.multi.reduce((a, b) => a + b, 0) : ld.value;
      const init = ld.multi ? 2900 : 1900;
      let doneAt = ld.at + init + steps * 250 + 1300;
      if (ld.castle && p.type !== 'draft') {
        // 城ドラフト後の到着: テレビ側は選択後に残りを移動する(残り歩数=現在地)
        doneAt = pendSince + 650 + m.pos * 250 + 1100;
      }
      if (p.type === 'draft' && ld.castle) {
        // 城ドラフトはコマが城に着いた瞬間に表示する
        const from = ((m.pos - steps) % 28 + 28) % 28;
        const toCastle = (28 - from) % 28 || 28;
        doneAt = ld.at + init + toCastle * 250 + 400;
      }
      if (Date.now() < doneAt) {
        $('msg').textContent = '移動中…';
        $('action').innerHTML = '<div class="waitDots">● ● ●</div>';
        $('shopScene').classList.remove('on');
        clearTimeout(moveT);
        moveT = setTimeout(render, doneAt - Date.now() + 40);
        renderHand();
        return;
      }
    }
  }
  const A = $('action');
  const sel = selected !== null ? m.hand[selected] : null;

  if (state.phase === 'ended') {
    $('msg').textContent = state.winner === pid ? '🏆 あなたの勝利!'
      : state.players.find(x => x.id === state.winner).name + 'の勝利…';
    A.innerHTML = '';
  } else if (!p) {
    const t = state.players[state.turn];
    const otherSupport = Object.values(state.pending).some(x => x.type === 'support');
    $('msg').textContent = state.phase === 'lobby' ? '開始を待っています…'
      : state.phase === 'select' ? '他のプレイヤーの選択待ち…'
      : otherSupport ? '相手の支援カードを待っています…'
      : (t ? t.name + 'の手番です' : '…');
    A.innerHTML = '<div class="waitDots">● ● ●</div>';
    selected = null;
  } else if (p.type === 'roll') {
    $('msg').textContent = p.prompt;
    const myElem = m.charId && C.CHARS[m.charId] ? C.CHARS[m.charId].elem : null;
    const ultIc = myElem ? `<svg width="16" height="16" viewBox="-34 -36 68 72" style="vertical-align:-3px">${ELEM_MINI[myElem]}</svg> ` : '';
    const extra = p.options.filter(o => o.id !== 'roll').map(o =>
      `<button class="${o.id === 'ult' ? 'ultBtn' : 'abtn ghost'}" onclick="${o.id === 'ult' ? 'showUltConfirm()' : `choose('${o.id}')`}" style="font-size:1.9dvh">${o.id === 'ult' ? ultIc : ''}${o.label}</button>`).join('');
    A.innerHTML = `<div style="position:relative; width:100%; height:100%">
      <div style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%)">
        <button class="diceImgBtn" id="diceBtn"><img src="/assets/dice_btn.png"></button></div>
      <div style="position:absolute; right:calc(2vw + env(safe-area-inset-right)); top:50%;
        transform:translateY(-50%); display:flex; flex-direction:column; gap:1.2dvh; max-width:34vw;">${extra}</div>
    </div>`;
    $('diceBtn').onclick = startRoll;
  } else if (p.type === 'curse_target' || p.type === 'ult_mio') {
    $('msg').textContent = p.prompt;
    A.innerHTML = '<div class="btnCol">' + p.options.map(o =>
      `<button class="abtn ${o.id === 'ct:cancel' ? 'ghost' : ''}" onclick="choose('${o.id}')">${o.label}</button>`).join('') + '</div>';
  } else if (p.type === 'select_char') {
    $('msg').textContent = '';
    A.innerHTML = '';
  } else if (p.type === 'draft') {
    $('msg').textContent = '';
    A.innerHTML = '';
    $('shopScene').classList.remove('on');
    $('draftOv').classList.add('on');
    const dk = p.options.map(o => o.id).join(',');
    if ($('draftRow').dataset.k === dk) { renderHand(); return; }
    $('draftRow').dataset.k = dk;
    $('draftRow').innerHTML = p.options.map(o => {
      const cid = o.id.slice(5);
      const rr = state.catalog.CREATURES[cid].rarity || 'N';
      return `<div class="draftCard rar-${rr}" data-o="${o.id}">${bigCardHTML(cid)}</div>`;
    }).join('');
    document.querySelectorAll('.draftCard').forEach(el =>
      el.onclick = () => { choose(el.dataset.o); $('draftOv').classList.remove('on'); });
    renderHand();
    return;
  } else if (p.type === 'market' && !inShopHand) {
    $('msg').textContent = '';
    A.innerHTML = '';
    $('shopScene').classList.add('on');
    $('shopGold').innerHTML = '<img src="/assets/ic_gold.png" style="height:2.4dvh;vertical-align:-0.4dvh"> ' + m.gold + ' G';
    const shopDesc = id => {
      if (id === 'draw') return '山札から3枚公開し、1枚を選んで獲得する';
      if (id.startsWith('buys:')) {
        const sp = C.SUPPORTS[id.slice(5)];
        return sp.jinx ? '戦闘で相手の支援カードを無効化する'
          : `戦闘で${sp.st ? 'ST+' + sp.st : 'HP+' + sp.hp}(秘密裏に同時出し)`;
      }
      if (id === 'buyi:curse') return '敵の土地のクリーチャーのHP-20(自分の次の手番まで)';
      if (id === 'gem') return '集めて秘宝と交換できる(秘宝=勝利点+1)';
      if (id === 'treasure') return '宝石を消費して勝利点+1を獲得!';
      if (id === 'done') return '買い物を終えて手番を終了する';
      return '';
    };
    $('shopBtns').innerHTML =
      `<button class="shopBtn ghost full" onclick="inShopHand=true; render()"><img src="/assets/ic_hand.png" style="height:2.4dvh;width:auto;vertical-align:-0.4dvh"> 手札を見る</button>` +
      p.options.map(o =>
        `<button class="shopBtn ${o.id === 'done' ? 'ghost full' : ''}" onclick="choose('${o.id}')">
          <div class="sbT">${o.label}</div><div class="sbD">${shopDesc(o.id)}</div></button>`).join('');
  } else if (p.type === 'market' && inShopHand) {
    $('msg').textContent = '手札を確認中';
    A.innerHTML = '<button class="abtn ghost" onclick="inShopHand=false; render()">店にもどる</button>';
  } else {
    // tile / pick_creature / support: カード選択+ボタン
    $('msg').innerHTML = p.prompt;
    const btns = [];
    if (sel && cardOption(sel)) {
      const opt = p.options.find(o => o.id === cardOption(sel));
      btns.push(`<button class="abtn" onclick="choose('${opt.id}')">${opt.label}</button>`);
    } else if (selectableKind()) {
      btns.push(`<button class="abtn" disabled>カードを選んでください</button>`);
    }
    const NUM = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
    let upN = 0;
    for (const o of p.options) {
      if (o.id.startsWith('summon:') || o.id.startsWith('atk:') || (o.id.startsWith('sup:') && o.id !== 'sup:none')) continue;
      const cls = o.id === 'invade' ? 'danger' : (o.id === 'pass' || o.id === 'cancel' || o.id === 'sup:none') ? 'ghost' : '';
      const prefix = p.type === 'upgrade' && o.id.startsWith('up:') ? (NUM[upN++] || '') + ' ' : '';
      btns.push(`<button class="abtn ${cls}" onclick="choose('${o.id}'); selected=null;">${prefix}${o.label}</button>`);
    }
    if (p.type === 'upgrade' && upN) $('msg').innerHTML = p.prompt + '<br><small style="font-size:1.7dvh">テレビの盤面の番号と対応しています</small>';
    A.innerHTML = btns.join('');
  }
  renderHand();
}
</script>
</body>
</html>
