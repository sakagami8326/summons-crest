<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#141227">
<title>SUMMONS CODE — 手元</title>
<style>
  :root { --ink:#141227; --ink2:#1E1B3C; --gold:#C9A227; --gold-soft:#EFD98F; --parchment:#F1E8D0;
      --weapon-art-scale:.88;
      --font-mincho:"Yu Mincho","Hiragino Mincho ProN","Hiragino Mincho Pro","Noto Serif JP",serif; }
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  body { background:radial-gradient(ellipse at 50% 0%, #2A2650 0%, var(--ink) 70%);
         height:100dvh; overflow:hidden; color:var(--parchment);
         font-family:var(--font-mincho); font-weight:400; user-select:none;
         display:flex; flex-direction:column; }  /* フロー配置: HUD/メッセージ/手札が重ならない */
  body.ingame { background:url('/assets/ui/phone-game-bg-v1.png') center / cover no-repeat fixed,#f3ead1; }
  body *,button,input,select,textarea { font-family:var(--font-mincho)!important; }
  #rotate { display:none; position:fixed; inset:0; z-index:99; background:var(--ink);
        align-items:center; justify-content:center; flex-direction:column; gap:14px;
        font-size:17px; letter-spacing:3px; }
  #rotate .ic { font-size:52px; animation:tilt 1.6s ease-in-out infinite alternate; }
  @keyframes tilt { to { transform:rotate(-90deg); } }
  @media (orientation:portrait) { body.ingame #rotate { display:flex; } }

  /* 参加フォーム(縦横どちらでも) */
  #join { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
        padding-top:6dvh; gap:12px; z-index:50; background:var(--ink); }
  #join img { height:auto; max-height:21dvh; max-width:86vw; object-fit:contain; }
  #join input { font-family:inherit; font-size:17px; text-align:center; letter-spacing:3px;
        background:var(--ink2); color:var(--parchment); border:1px solid var(--gold);
        border-radius:10px; padding:11px; width:min(70vw, 300px); }
  #roomPreset { display:none; width:min(70vw,300px); padding:5px 0; text-align:center;
        color:var(--gold-soft); background:transparent; border:0;
        border-radius:0; font-size:15px; letter-spacing:2px; }
  #roomPreset strong { color:#fff3c4; font-size:19px; letter-spacing:4px; }
  #join.qr-room #roomPreset { display:block; }
  #join.qr-room #codeIn { display:none; }
  #join button { font-family:inherit; font-size:16px; letter-spacing:3px; padding:12px;
        width:min(70vw, 300px); background:linear-gradient(180deg,#E8C55A,#B8901F);
        color:#241C05; border:1px solid #F2D062; border-radius:10px; cursor:pointer; }
  #join #joinFsBtn { position:absolute; top:calc(10px + env(safe-area-inset-top));
        right:calc(10px + env(safe-area-inset-right)); width:clamp(40px,9.5dvh,66px);
        height:clamp(40px,9.5dvh,66px); padding:0; border:0; border-radius:0;
        background:transparent url('/assets/ui/phone-btn-fullscreen-v1.webp') center / contain no-repeat;
        color:transparent; font-size:0; filter:drop-shadow(0 .45dvh .55dvh rgba(0,0,0,.42)); }
  #err { color:#F09595; font-size:13px; min-height:1.2em; }

  #lobbyWait { position:fixed; inset:0; z-index:48; display:none; align-items:center; justify-content:center;
      flex-direction:column; gap:2.6dvh; overflow:hidden; color:#19172a; text-align:center;
      background:linear-gradient(rgba(247,240,218,.72),rgba(238,226,194,.82)),url('/assets/select_bg.jpg') center/cover; }
  #lobbyWait.on { display:flex; }
  #lobbyWait .lwTitle { position:relative; z-index:2; font:900 clamp(17px,4.6dvh,28px)/1.25 'Yu Mincho','Hiragino Mincho ProN',serif;
      letter-spacing:.12em; text-shadow:0 1px rgba(255,255,255,.9); }
  .lwMagic { position:relative; width:clamp(58px,18dvh,112px); aspect-ratio:1; display:grid; place-items:center; }
  .lwMagic::before,.lwMagic::after { content:""; position:absolute; inset:5%; border:2px solid rgba(151,115,33,.72); border-radius:50%;
      box-shadow:inset 0 0 0 .9dvh rgba(236,207,121,.16),0 0 1.8dvh rgba(176,129,31,.24); animation:lwSpin 3.2s linear infinite; }
  .lwMagic::after { inset:24%; border-style:dashed; border-color:rgba(76,58,111,.72); animation-direction:reverse; animation-duration:2.2s; }
  .lwRune { width:21%; aspect-ratio:1; border:2px solid #b58b28; transform:rotate(45deg); background:rgba(255,244,196,.72);
      box-shadow:0 0 1.5dvh rgba(202,154,40,.55); }
  .lwDots { display:flex; gap:1.5dvh; }
  .lwDots i { width:1.25dvh; height:1.25dvh; min-width:7px; min-height:7px; border-radius:50%; background:#c49a35;
      box-shadow:0 0 1dvh rgba(191,139,25,.75); animation:lwDot 1.1s ease-in-out infinite; }
  .lwDots i:nth-child(2){animation-delay:.16s}.lwDots i:nth-child(3){animation-delay:.32s}
  @keyframes lwSpin { to { transform:rotate(360deg); } }
  @keyframes lwDot { 0%,100%{opacity:.28;transform:translateY(0)} 50%{opacity:1;transform:translateY(-.9dvh)} }
  body.lobby-wait #hdr,body.lobby-wait #midRow,body.lobby-wait #handWrap { visibility:hidden!important; }

  header { flex:none; height:25dvh; display:flex;
        align-items:center; gap:1.4vw; padding:1dvh calc(12px + env(safe-area-inset-right)) 1dvh calc(12px + env(safe-area-inset-left)); }
  #diceDock { flex:0 0 24dvh; min-width:0; height:100%; display:flex; align-items:center; justify-content:center; position:relative; }
  #topTools { min-width:0; height:100%; margin-left:auto; display:grid;
      grid-template-columns:repeat(5,13.2dvh); grid-template-rows:13.2dvh 8.2dvh;
      align-content:center; justify-content:end; gap:.45dvh .35vw; white-space:nowrap; }
  #contextBtn { display:none; grid-column:1 / 3; grid-row:2; align-self:center; justify-self:stretch;
      min-height:6.6dvh; padding:.65dvh 1dvh; font-size:clamp(11px,1.9dvh,15px); line-height:1.15;
      white-space:normal; overflow-wrap:anywhere; text-align:center; align-items:center; justify-content:center; }
  .phoneToolBtn,#ultBtn { border:0; padding:0; color:transparent; font-size:0; cursor:pointer;
      background-color:transparent; background-position:center; background-repeat:no-repeat; background-size:contain;
      filter:drop-shadow(0 .45dvh .55dvh rgba(17,20,31,.42)); transition:transform .12s ease,filter .12s ease; }
  .phoneToolBtn { width:13.2dvh; height:13.2dvh; }
  .phoneToolBtn:active,#ultBtn:active { transform:translateY(.25dvh) scale(.96);
      filter:drop-shadow(0 .15dvh .25dvh rgba(17,20,31,.38)) brightness(.88); }
  #ultBtn { grid-column:1; grid-row:1; width:13.2dvh; height:13.2dvh;
      background-image:url('/assets/ui/phone-btn-ultimate-v2.webp'); }
  #mapBtn { grid-column:2; grid-row:1; background-image:url('/assets/ui/phone-btn-land-v1.webp'); }
  #galleryBtn { grid-column:3; grid-row:1; background-image:url('/assets/ui/phone-btn-cards-v1.webp'); }
  #deckBtn { grid-column:4; grid-row:1; background-image:url('/assets/ui/phone-btn-deck-v1.webp'); }
  #fsBtn { grid-column:5; grid-row:1; background-image:url('/assets/ui/phone-btn-fullscreen-v1.webp'); }
  #ultBtn:disabled { cursor:default; opacity:.46; filter:grayscale(.72) brightness(.58) saturate(.5); }
  #ultBtn.on { opacity:1; filter:drop-shadow(0 .45dvh .55dvh rgba(72,30,92,.58)); }
  #ultBtn.viewOnly { opacity:.62; filter:grayscale(.45) brightness(.78); cursor:pointer; }
  #ultBtn.used { opacity:.48; filter:grayscale(.78) brightness(.65); cursor:pointer; }
  .me { min-width:0; display:flex; align-items:center; gap:8px; background:rgba(13,24,43,.9);
        border:1px solid rgba(201,162,39,.88); border-radius:10px; padding:4px 14px 4px 5px; flex:none;
        box-shadow:inset 0 0 0 1px rgba(255,238,176,.08); }
  .dirBtn { font-family:'Reggae One','Yu Mincho',serif; display:flex; flex-direction:column;
        align-items:center; gap:.6dvh; background:linear-gradient(170deg,#2E2A52,#1B1838);
        color:var(--gold-soft); border:2px solid var(--gold); border-radius:2.4dvh;
        padding:2.2dvh 5vw; font-size:max(2.6dvh, 15px); letter-spacing:.4dvh; cursor:pointer; }
  .dirBtn:active { transform:scale(.94); background:rgba(201,162,39,.25); }
  .me > img { width:10dvh; height:10dvh; border-radius:1.6dvh; object-fit:contain; flex:none;
        filter:drop-shadow(0 2px 5px rgba(0,0,0,.45)); }
  .me .nm { font-size:max(2.4dvh, 13px); letter-spacing:1px; }
  .me .st { font-size:max(2dvh, 12px); color:var(--gold-soft); font-family:sans-serif;
        font-variant-numeric:tabular-nums; white-space:nowrap; line-height:1.45; }
  .me .st .assetBig { font-size:max(3.1dvh, 17px); font-weight:700; color:#F2D062;
        text-shadow:0 0 8px rgba(242,208,98,.45); letter-spacing:.5px; }
  .me .st .assetBig small { font-size:.55em; font-weight:400; opacity:.8; }
  #msg.big { font-size:max(4dvh, 20px); }
  /* 中段: 左=行動メッセージ / 右=アクション(フロー配置なので重ならない) */
  #midRow { display:none !important; }
  #msg { grid-column:1 / 6; grid-row:2; width:100%; min-width:0; display:-webkit-box;
        align-self:center; text-align:center; font-size:max(2.2dvh, 13px); letter-spacing:1px;
        color:#111; line-height:1.35; text-shadow:0 1px 1px rgba(255,255,255,.72);
        font-family:'Reggae One','Yu Mincho',serif; overflow:hidden; padding:.35dvh .8dvh;
        white-space:normal; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  #topTools.hasContext #msg { grid-column:3 / 6; }
  #msg:empty { opacity:0; }
  #action { flex:1; min-width:0; display:flex; align-items:center; justify-content:center; gap:14px;
        padding:0 8px; overflow:hidden; }
  .abtn { font-family:inherit; font-size:max(2.7dvh, 15px); letter-spacing:2px; padding:1.8dvh 3.4dvh;
        background:linear-gradient(180deg,#E8C55A,#B8901F); color:#241C05;
        border:2px solid #F2D062; border-radius:12px; cursor:pointer;
        box-shadow:0 4px 14px rgba(0,0,0,.5); }
  .abtn:active { transform:scale(.96); }
  .abtn:disabled { filter:grayscale(.75) brightness(.55); }
  .abtn.ghost { background:transparent; color:var(--gold-soft); border:1px solid var(--gold); box-shadow:none; }
  .abtn.danger { background:linear-gradient(180deg,#D96A50,#A3402B); border-color:#F0937B; color:#2A0B05; }
  .btnCol { display:flex; flex-direction:column; gap:8px; max-height:100%; overflow-y:auto; padding:4px; }
  .btnCol .abtn { font-size:max(2.3dvh, 14px); padding:1.2dvh 2.4dvh; text-align:left; }
  .waitDots { font-size:4dvh; color:var(--gold); letter-spacing:6px; animation:blink 1.2s infinite; }
  @keyframes blink { 50% { opacity:.3; } }

  /* 3Dダイス */
  #diceBtn { width:22dvh; height:22dvh; border-radius:50%; font-size:2.5dvh; white-space:nowrap;
        box-shadow:none; }
  .diceStage { position:relative; width:21dvh; height:24dvh; perspective:700px; }
  .diceStage.drop { animation:dbounce 1.4s cubic-bezier(.3,.6,.4,1); }
  @keyframes dbounce { 0%{transform:translateY(-15dvh)} 52%{transform:translateY(0)}
    68%{transform:translateY(-4dvh)} 80%{transform:translateY(0)} 89%{transform:translateY(-1.4dvh)} 100%{transform:translateY(0)} }
  .dice3d { position:absolute; left:50%; top:42%; width:15dvh; height:15dvh; margin:-7.5dvh 0 0 -7.5dvh;
        transform-style:preserve-3d; }
  .dface { position:absolute; inset:0; background:linear-gradient(160deg,#F5EDD8,#DCCFA8);
        border:2px solid var(--gold); border-radius:1.6dvh; backface-visibility:hidden;
        display:flex; align-items:center; justify-content:center;
        box-shadow:inset 0 0 1.4dvh rgba(90,59,20,.25); }
  .dface svg { width:74%; height:74%; }
  .f1{transform:translateZ(7.5dvh)} .f2{transform:rotateX(90deg) translateZ(7.5dvh)}
  .f3{transform:rotateY(90deg) translateZ(7.5dvh)} .f4{transform:rotateY(-90deg) translateZ(7.5dvh)}
  .f5{transform:rotateX(-90deg) translateZ(7.5dvh)} .f6{transform:rotateY(180deg) translateZ(7.5dvh)}

  /* 手札 */
  #handWrap { flex:1; min-height:0; height:auto; position:relative; padding:0 calc(10px + env(safe-area-inset-right))
        calc(6px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left)); }
  #lpHint { position:absolute; right:calc(14px + env(safe-area-inset-right)); bottom:calc(2px + env(safe-area-inset-bottom));
        padding:3px 8px; border-radius:999px; background:rgba(9,8,24,.66); border:1px solid rgba(242,208,98,.3);
        font-size:11px; color:rgba(255,244,204,.84); letter-spacing:1px; pointer-events:none; z-index:5; }
  #hand .card { animation:dealIn .45s cubic-bezier(.2,.85,.3,1) backwards; touch-action:none; }
  @keyframes dealIn { from { transform:translateX(16dvh) translateY(2dvh) rotate(6deg); opacity:0; } }
  #hand { display:flex; gap:12px; height:100%; overflow-x:auto; padding:10px 6px 4px;
        align-items:flex-end; -webkit-overflow-scrolling:touch; touch-action:none; }
  .card { flex:none; height:100%; aspect-ratio:300/470; width:auto; position:relative;
        perspective:700px; cursor:pointer; transition:transform .15s; }
  #hand .card { filter:drop-shadow(0 1.15dvh 1.25dvh rgba(20,25,39,.48)); }
  #hand .card.dim { filter:drop-shadow(0 .65dvh .75dvh rgba(20,25,39,.32)) brightness(.48) saturate(.35);
        opacity:.78; }
  #hand.reordering { cursor:grabbing; }
  #hand .card.handHolding::after { content:""; position:absolute; z-index:12; inset:-4px; border:3px solid transparent;
        border-top-color:#F2D062; border-right-color:#F2D062; border-radius:12px; pointer-events:none;
        opacity:0; animation:handHoldProgress .2s .1s linear forwards; }
  @keyframes handHoldProgress { from{transform:rotate(-90deg);opacity:.18} to{transform:rotate(270deg);opacity:1} }
  .card.handDragging { position:fixed!important; z-index:90!important; margin:0!important; pointer-events:none;
        opacity:.94; transform:translateY(-1.3dvh) scale(1.045); filter:drop-shadow(0 2dvh 2.5dvh rgba(0,0,0,.72))!important;
        transition:none!important; animation:none!important; }
  .handPlaceholder { flex:none; border:2px dashed rgba(242,208,98,.75); border-radius:10px;
        background:rgba(242,208,98,.1); box-shadow:inset 0 0 1.5dvh rgba(242,208,98,.12); }
  .card.sel { transform:translateY(-7px); }
  .card.sel .face { border-color:#F2D062; box-shadow:0 0 0 2px #F2D062, 0 8px 20px rgba(242,208,98,.4); }
  .card.dim { filter:brightness(.6) saturate(.6); cursor:default; }
  .flip { position:absolute; inset:0; transform-style:preserve-3d;
        transition:transform .55s cubic-bezier(.3,1.4,.5,1); }
  .flip.flipped { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; backface-visibility:hidden; border-radius:10px;
        background:url("/assets/card_bg.jpg") center / cover; color:#3A2B18; border:2px solid #2C2A4A;
        padding:8px; display:flex; flex-direction:column; align-items:center;
        box-shadow:0 3px 8px rgba(0,0,0,.45); overflow:hidden; }
  .face::before { content:""; position:absolute; inset:0; border-radius:7px; pointer-events:none;
        box-shadow:inset 0 0 18px rgba(90,59,20,.18); }
  .face.back { transform:rotateY(180deg); border-color:#8A6A1E;
        box-shadow:inset 0 0 40px rgba(201,162,39,.25), 0 3px 8px rgba(0,0,0,.45); }
  .evoRibbon { position:absolute; top:12px; left:-34px; transform:rotate(-38deg);
        background:linear-gradient(180deg,#E8C55A,#B8901F); color:#241C05; font-size:1.5dvh;
        letter-spacing:2px; padding:2px 38px; box-shadow:0 1px 4px rgba(0,0,0,.4); }
  .face .cost { position:absolute; top:6px; left:6px; width:max(4.4dvh, 26px); height:max(4.4dvh, 26px); border-radius:50%;
        background:#2C2A4A; color:var(--gold-soft); display:flex; align-items:center; justify-content:center;
        font-size:max(1.7dvh, 11px); font-family:sans-serif; border:1px solid var(--gold); z-index:2; }
  .face .art { height:50%; display:flex; align-items:flex-end; justify-content:center; margin-top:6.2dvh; }
  .face .art img { max-height:100%; filter:drop-shadow(0 3px 4px rgba(58,43,24,.35)); }
  .face .tok2 { width:10dvh; height:10dvh; border-radius:50%; margin-top:6.5dvh; color:#F6EFDD;
        display:flex; align-items:center; justify-content:center; font-size:2dvh; border:3px solid #2C2A4A; }
  .face .glyph { height:54%; display:flex; align-items:center; justify-content:center;
        font-size:8.5dvh; margin-top:3dvh; color:#2C2A4A; }
  .face .nm { font-size:max(2.2dvh, 13px); letter-spacing:1px; margin-top:.6dvh; }
  .face .stats { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; row-gap:0;
      font-family:sans-serif; font-size:max(1.9dvh, 12px); margin-top:.4dvh; }
  .face .stats b { color:#A3402B; } .face .stats i { color:#2E5E4E; font-style:normal; }
  .face .stats .up { color:#8A6A1E; font-weight:700; }
  .face .type { position:absolute; bottom:5px; right:9px; font-size:1.3dvh; color:rgba(58,43,24,.6); }

  /* ショップシーン */
  #shopScene { position:fixed; inset:0; display:none; z-index:40;
      background:url('/assets/shop_bg.jpg') center / cover; }
  #shopScene.on { display:block; }
  #shopShelf { position:absolute; inset:.7dvh max(.15vw,env(safe-area-inset-right)) 6.4dvh max(.15vw,env(safe-area-inset-left));
      overflow:auto; display:grid; grid-template-columns:repeat(10,minmax(0,1fr));
      grid-template-rows:repeat(2,minmax(0,1fr)); gap:.16dvh .08vw; align-items:center; padding:.1dvh; }
  .shopProduct { position:relative; min-width:0; cursor:pointer; text-align:center; transition:.18s transform,.18s filter; }
  .shopProduct:nth-child(1) { grid-area:1/1/2/3; } .shopProduct:nth-child(2) { grid-area:1/3/2/5; }
  .shopProduct:nth-child(3) { grid-area:1/5/2/7; } .shopProduct:nth-child(4) { grid-area:1/7/2/9; }
  .shopProduct:nth-child(5) { grid-area:1/9/2/11; } .shopProduct:nth-child(6) { grid-area:2/2/3/4; }
  .shopProduct:nth-child(7) { grid-area:2/4/3/6; } .shopProduct:nth-child(8) { grid-area:2/6/3/8; }
  .shopProduct:nth-child(9) { grid-area:2/8/3/10; }
  .shopProduct:active { transform:scale(.96); }
  .shopProduct.unaffordable .shopCompactBg,.shopProduct.unaffordable .shopCompactArt { filter:saturate(.72) brightness(.76); opacity:.78; }
  .shopProduct.unaffordable .shopCompactArt img { filter:drop-shadow(0 .4dvh .7dvh rgba(0,0,0,.55)); }
  .shopProduct.sold { filter:grayscale(1) brightness(.4); pointer-events:none; }
  .shopProduct .shopCard { height:min(41.5dvh,calc((100dvh - 7.8dvh)/2)); aspect-ratio:4/5; width:auto;
      max-width:19.65vw; margin:auto; container-type:inline-size; }
  .shopCompact { position:relative; width:100%; height:100%; overflow:hidden; border-radius:1.15dvh;
      border:1px solid rgba(231,199,106,.72); background:#111a31; color:#fff4d5;
      box-shadow:0 .65dvh 1.25dvh rgba(0,0,0,.48); isolation:isolate; }
  .shopCompactBg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:-2; }
  .shopCompactShade { position:absolute; z-index:-1; inset:0; background:linear-gradient(180deg,rgba(4,9,20,.42) 0 12%,transparent 25% 72%,rgba(4,9,20,.62) 90%); }
  .shopCompactName { position:absolute; z-index:5; top:3%; left:5%; right:5%; overflow:hidden;
      font:900 clamp(13px,9.4cqw,24px)/1.05 'Yu Mincho','Hiragino Mincho ProN',serif;
      white-space:nowrap; text-align:center; text-shadow:0 2px 4px #000; }
  .shopCompactArt { position:absolute; z-index:2; top:12%; left:4%; width:92%; height:63%; display:grid; place-items:center; }
  .shopCompactArt img { width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 .4dvh .7dvh rgba(0,0,0,.55)); }
  .shopCompact.support .shopCompactArt { top:15%; left:8%; width:84%; height:63%; }
  .shopCompact.support .shopCompactArt img { width:calc(100% * var(--weapon-art-scale)); height:calc(100% * var(--weapon-art-scale));
      object-fit:contain; transform:translateY(4%); }
  .shopCompactArt svg { width:62%; height:62%; }
  .shopCompactArt .tok2 { width:64%!important; height:auto!important; aspect-ratio:1; font-size:clamp(11px,7cqw,20px); }
  .shopCompactFooter { position:absolute; z-index:4; left:3%; right:3%; bottom:3%; min-height:21%;
      display:flex; align-items:flex-end; justify-content:space-between; gap:3%; }
  .shopCompactPrice { position:relative; display:inline-flex; align-items:center; gap:.2em; min-height:4.4dvh; padding:.15dvh .65dvh;
      border-radius:999px; background:rgba(9,15,35,.94); color:#ffe58a;
      font:900 clamp(12px,8.5cqw,21px)/1 Marudeco,sans-serif; white-space:nowrap; }

// QRの明示ルームを保存済みの別ルームより優先し、同じルームだけ自動復帰する。
(async () => {
  const params = new URLSearchParams(location.search);
  const hasRoomParam = params.has('room');
  const candidate = String(params.get('room') || '').trim().toUpperCase();
  const sess = readSavedSession();
  if (hasRoomParam) {
    if (!ROOM_CODE_PATTERN.test(candidate)) {
      showManualRoom('QRコードのルーム情報が正しくありません。ルームコードを入力してください');
      return;
    }
    showPresetRoom(candidate);
    $('joinBtn').disabled = true;
    try {
      const r = await fetch('/api/room?code=' + encodeURIComponent(candidate));
      const d = await r.json();
      if (!d.exists) {
        showManualRoom('このルームは見つかりません。ルームコードを確認してください');
        return;
      }
    } catch (e) {
      showManualRoom('ルームを確認できませんでした。ルームコードを入力してください');
      return;
    }
    $('joinBtn').disabled = false;
    if (sess && String(sess.room || '').toUpperCase() === candidate) {
      if (await resumeSavedSession(sess)) return;
      clearSavedSession();
    }
    return;
  }
  if (!sess) return;
  if (!await resumeSavedSession(sess)) clearSavedSession();
})();

// 手札の各カードが「今どの選択肢に対応するか」
function cardOption(c) {
  const p = pend();

    return ['sup:s:' + c, 'sup:c:' + c].find(oid => p.options.some(o => o.id === oid)) || null;
  }
  const map = { tile: 'summon:' + c, pick_creature: 'atk:' + c, roll: 'sp:' + c };
  const oid = map[p.type];
  return oid && p.options.some(o => o.id === oid) ? oid : null;
}
// 使えるカード種を返す。'creature-hint'=タップ不可だが関連あり(明るく残す)、'none'=全て減光
function selectableKind() {
  const p = pend();
  if (!p) return null;
  if (p.type === 'tile') return p.options.some(o => o.id.startsWith('summon:')) ? 'creature' : 'creature-hint';
  if (p.type === 'pick_creature') return 'creature';
  if (p.type === 'support') return 'support';
  if (p.type === 'roll') return 'spell';
  if (p.type === 'forge' || p.type === 'gate') return 'creature-hint';
  return 'none';
}
// カードを暗くするかの判定(cardHTMLとクラス更新の両方で共用)
function cardDim(c) {

  if (skind === 'creature-hint') return kind !== 'creature';
  return !cardOption(c);
}

let handListKey = '', handServerKey = '', handOrderScope = '', handDisplay = [];
let handGesture = null;
let handClickSuppressUntil = 0;
function handInventoryKey(hand) {
  const counts = {};
  (hand || []).forEach(c => counts[c] = (counts[c] || 0) + 1);
  return Object.keys(counts).sort().map(c => `${c}:${counts[c]}`).join(',');
}
function handInteractionContextKey(s) {
  if (!s) return '';
  const player = Array.isArray(s.players) ? s.players.find(q => q.id === pid) : null;
  return [s.phase || '', player ? player.id : 'missing', handInventoryKey(player && player.hand)].join('|');
}
function openBlockingOverlay(target) {
  cancelHandGesture();
  const el = typeof target === 'string' ? $(target) : target;
  if (el) el.classList.add('on');
  return el;
}
function handStorageKey() { return room && pid ? `sc_hand_order:${room}:${pid}` : ''; }
function readHandOrder() {
  const key = handStorageKey();
  if (!key) return [];
  try { const v = JSON.parse(localStorage.getItem(key) || '[]'); return Array.isArray(v) ? v.filter(x => typeof x === 'string') : []; }
  catch (e) { return []; }
}
function saveHandOrder() {
  const key = handStorageKey();
  if (!key) return;
  try { localStorage.setItem(key, JSON.stringify(handDisplay)); } catch (e) {}
}
function reconcileHandOrder(serverHand) {
  const scope = handStorageKey();
  if (scope !== handOrderScope) {
    handOrderScope = scope;
    handDisplay = readHandOrder();
    handListKey = '';
  }
  const counts = {};
  serverHand.forEach(c => counts[c] = (counts[c] || 0) + 1);
  const next = [];
  handDisplay.forEach(c => { if (counts[c] > 0) { next.push(c); counts[c]--; } });
  serverHand.forEach(c => { if (counts[c] > 0) { next.push(c); counts[c]--; } });
  handDisplay = next;
  saveHandOrder();
  return next;
}
function finishHandDrop() {
  if (!handGesture || !handGesture.dragging) return;
  const g = handGesture, hand = $('hand');
  if (g.placeholder && g.placeholder.parentNode) g.placeholder.replaceWith(g.el);
  g.el.classList.remove('handDragging', 'handHolding');
  ['position','left','top','width','height','zIndex','margin','pointerEvents'].forEach(k => g.el.style[k] = '');
  hand.classList.remove('reordering');
  handDisplay = [...hand.querySelectorAll('.card[data-c]')].map(el => el.dataset.c);
  handListKey = handDisplay.join(',');
  saveHandOrder();
  [...hand.querySelectorAll('.card[data-c]')].forEach((el, i) => el.dataset.i = i);
}
function cancelHandGesture(options = {}) {
  const rerender = options.rerender !== false;
  const g = handGesture, hand = $('hand');
  const hasArtifacts = !!(g || hand.classList.contains('reordering') ||
    hand.querySelector('.handDragging,.handHolding,.handPlaceholder'));
  if (!hasArtifacts) return;
  if (g) clearTimeout(g.holdTimer);
  const el = g && g.el;
  if (el && g.pointerId != null && el.hasPointerCapture && el.hasPointerCapture(g.pointerId)) {
    try { el.releasePointerCapture(g.pointerId); } catch (e) {}
  }
  handGesture = null;
  hand.querySelectorAll('.handPlaceholder').forEach(node => node.remove());
  hand.querySelectorAll('.card').forEach(card => {
    card.classList.remove('handDragging', 'handHolding');
    ['position','left','top','width','height','zIndex','margin','pointerEvents'].forEach(k => card.style[k] = '');
  });
  hand.classList.remove('reordering');
  if (g && Array.isArray(g.originalOrder)) {
    handDisplay = g.originalOrder.slice();
    handListKey = '';
  }
  if (g && Number.isFinite(g.originalScroll)) hand.scrollLeft = g.originalScroll;
  handClickSuppressUntil = Date.now() + 400;
  if (rerender && state && state.players && state.players.some(q => q.id === pid)) renderHand();
}
function startHandDrag(e) {
  const g = handGesture, hand = $('hand');
  if (!g || g.dragging) return;
  g.dragging = true;
  g.el.classList.remove('handHolding');
  const r = g.el.getBoundingClientRect();
  g.offsetX = e.clientX - r.left; g.offsetY = e.clientY - r.top;
  g.placeholder = document.createElement('div');
  g.placeholder.className = 'handPlaceholder';
  g.placeholder.style.width = r.width + 'px'; g.placeholder.style.height = r.height + 'px';
  hand.insertBefore(g.placeholder, g.el);
  g.el.classList.add('handDragging');
  Object.assign(g.el.style, { left:r.left+'px', top:r.top+'px', width:r.width+'px', height:r.height+'px' });
  hand.classList.add('reordering');
}
function moveHandDrag(e) {
  const g = handGesture, hand = $('hand');
  if (!g || !g.dragging) return;
  e.preventDefault();
  g.el.style.left = (e.clientX - g.offsetX) + 'px';
  g.el.style.top = (e.clientY - g.offsetY) + 'px';
  const hr = hand.getBoundingClientRect();
  if (e.clientX < hr.left + 48) hand.scrollLeft -= 14;
  else if (e.clientX > hr.right - 48) hand.scrollLeft += 14;
  const cards = [...hand.querySelectorAll('.card[data-c]')].filter(card => card !== g.el);
  const before = cards.find(card => e.clientX < card.getBoundingClientRect().left + card.getBoundingClientRect().width / 2);
  if (before) hand.insertBefore(g.placeholder, before); else hand.appendChild(g.placeholder);
}
function beginHandPointer(e, el) {
  if (e.button != null && e.button !== 0) return;
  if (handGesture) return;
  const hand = $('hand');
  handGesture = { el, pointerId:e.pointerId, x:e.clientX, y:e.clientY, scroll:hand.scrollLeft,
    originalScroll:hand.scrollLeft, originalOrder:handDisplay.slice(),
    armed:false, dragging:false, scrolling:false, moved:false, holdTimer:null };
  try { el.setPointerCapture(e.pointerId); } catch (err) {}
  el.classList.add('handHolding');
  handGesture.holdTimer = setTimeout(() => {
    const g = handGesture;
    if (!g || g.el !== el || g.scrolling || g.moved) return;
    g.armed = true;
    startHandDrag({ clientX:g.x, clientY:g.y });
  }, 300);
  el.onpointermove = ev => {
    const g = handGesture; if (!g || g.el !== el) return;
    const dx = ev.clientX - g.x, dy = ev.clientY - g.y;
    if (g.dragging) return moveHandDrag(ev);
    if (g.armed && Math.hypot(dx,dy) > 5) { startHandDrag(ev); return moveHandDrag(ev); }
    if (!g.armed && Math.abs(dx) > 14 && Math.abs(dx) > Math.abs(dy)) {
      clearTimeout(g.holdTimer); g.el.classList.remove('handHolding'); g.scrolling = true; g.moved = true;
      hand.scrollLeft = g.scroll - dx; ev.preventDefault();
    } else if (Math.abs(dy) > 14) { clearTimeout(g.holdTimer); g.el.classList.remove('handHolding'); g.moved = true; }
  };
  const finish = ev => {
    const g = handGesture; if (!g || g.el !== el) return;
    clearTimeout(g.holdTimer);
    g.el.classList.remove('handHolding');
    if (g.dragging) {
      finishHandDrop();
      if (g.pointerId != null && g.el.hasPointerCapture && g.el.hasPointerCapture(g.pointerId)) {
        try { g.el.releasePointerCapture(g.pointerId); } catch (err) {}
      }
      handClickSuppressUntil = Date.now() + 400; handGesture = null; return;
    }
    if (g.moved || g.scrolling) handClickSuppressUntil = Date.now() + 400;
    handGesture = null;
  };
  el.onpointerup = finish;
  el.onpointercancel = () => cancelHandGesture();
}
function renderHand() {
  const serverHand = me().hand.slice(), serverKey = handInventoryKey(serverHand);
  if (serverKey !== handServerKey && handGesture) cancelHandGesture({ rerender:false });
  handServerKey = serverKey;
  // Remote turns, logs and other players' prompts refresh over SSE frequently.
  // Preserve the active card node and pointer capture while our own hand is unchanged.
  if (handGesture) return;
  const display = reconcileHandOrder(serverHand), list = display.join(',');
  $('hand').dataset.n = display.length;
  if (list !== handListKey) {
    const oldArr = handListKey ? handListKey.split(',') : [];
    handListKey = list;
    $('hand').innerHTML = display.map((c, i) => cardHTML(c, i)).join('');
    afterUiPaint(() => fitCreatureNames($('hand')));
    document.querySelectorAll('#hand .card').forEach((el, i) => el.style.animationDelay = (i * 80) + 'ms');
    const cnt = {};
    oldArr.forEach(c => cnt[c] = (cnt[c] || 0) + 1);
    display.forEach((c, i) => {
      if (cnt[c]) { cnt[c]--; return; }
      const el = document.querySelector(`#hand .card[data-i="${i}"]`);
      if (el) el.classList.add('fresh');
    });
    bindHand();
  }
  document.querySelectorAll('#hand .card').forEach(el => {
    const i = +el.dataset.i;
    el.classList.toggle('sel', selected === i);
    el.classList.toggle('dim', cardDim(el.dataset.c));
  });
  if ($('cardZoom').classList.contains('on')) refreshCardZoomAction();
}
function bindHand() {
  document.querySelectorAll('#hand .card').forEach(el => {
    el.onclick = e => {
      if (Date.now() < handClickSuppressUntil) { e.preventDefault(); return; }
      openCardZoom(el.dataset.c);
    };
    el.onpointerdown = e => beginHandPointer(e, el);
    el.oncontextmenu = e => e.preventDefault();
  });
}

  let spin = 0;
  const iv = setInterval(() => {
    spin += 47;
    die.style.transform = `rotateX(${spin * 1.3}deg) rotateY(${spin}deg)`;
  }, 60);
  die.dataset.iv = iv;
  choose('roll');
}
function settleDice(n) {
  const die = $('die3d');
  if (!die) { rolling = false; return; }
  clearInterval(+die.dataset.iv);
  const [fx, fy] = FACE_ROT[n];
  die.style.transition = 'transform 1.1s cubic-bezier(.16,.84,.26,1.02)';
  die.style.transform = `rotateX(${fx + 720}deg) rotateY(${fy + 1080}deg)`;
  settleT = Date.now() + 1500;
  setTimeout(() => { rolling = false; render(); }, 1400);
}

}

    + (cfg.browseHand ? `<button class="gateBtn ghost" onclick="browseActionHand()"><div class="gbT">手札を確認する</div><div class="gbD">行動を決める前に手札へ戻ります</div></button>` : '')

    A.innerHTML = '';
    buildPickOv('交代 ─ 配置するクリーチャーをタップ(召喚コスト別途)', [
      { name: '手札のクリーチャー', entries: p.options.filter(o => o.id.startsWith('sp2:') && o.id !== 'sp2:cancel')
        .map(o => ({ card: o.id.slice(4), pickId: o.id })) },
    ], 'sp2:cancel');
  } else if (p.type === 'forge') {
    // 鍛錬: 進化させるクリーチャーをカードタップで選ぶ
    $('msg').innerHTML = iconize(p.prompt);
    A.innerHTML = '';
    buildPickOv(iconize(p.prompt).replace(/選べ/, 'タップ'), [
      { name: '進化できるクリーチャー', entries: p.options.filter(o => o.id.startsWith('fg:'))
        .map(o => { const c = m.hand[+o.id.slice(3)]; const cr2 = C.CREATURES[c] || {};
          return { card: c, pickId: o.id, zone: `→ ${cr2.evo || '進化'}` }; }) },
    ], 'back');
  } else if (p.type === 'gate') {
    // 門: 全画面オーバーレイで選ぶ(押し込み配置だとボタンが見切れるため)
    $('msg').innerHTML = iconize(p.prompt);
    A.innerHTML = '';
    const GATE_META = {
      g_up:    { t: '領地強化', d: '自分の領地1つのレベルを上げる(費用は通常どおり)', ic: 'up' },
      g_draft: { t: 'カードを引く', d: '山札から3枚公開し、1枚を選んで獲得する', ic: 'draft' },
      g_forge: { t: '鍛錬', d: '手札のクリーチャーを進化させる', ic: 'forge' },
      pass:    { t: '何もしない', d: '恩恵を受けずに手番を終える' },
    };
    $('gateBtnsWrap').innerHTML = p.options.map(o => {
      const mt = GATE_META[o.id] || { t: iconize(o.label), d: '' };
      const cost = (o.label.match(/−\d+G/) || [''])[0];
      return `<button class="gateBtn ${o.id === 'pass' ? 'ghost' : ''}" onclick="choose('${o.id}')">
        <div class="gbT">${mt.ic ? sic(mt.ic, '3dvh') + ' ' : ''}${mt.t}${cost ? ` <span class="gbC">${cost}</span>` : ''}</div>
        <div class="gbD">${mt.d}</div></button>`;
    }).join('');
    openBlockingOverlay('gateOv');
  } else if (p.type === 'select_char') {
    $('msg').textContent = '';
    A.innerHTML = '';
  } else if (p.type === 'draft') {
    $('msg').textContent = '';
    A.innerHTML = '';
    $('shopScene').classList.remove('on');
    openBlockingOverlay('draftOv');
    const dk = p.options.map(o => o.id).join(',');
    if ($('draftRow').dataset.k === dk) { renderHand(); return; }
    $('draftRow').dataset.k = dk;
    $('draftRow').innerHTML = p.options.filter(o => o.id.startsWith('take:')).map(o => {
      const cid = o.id.slice(5);
      return `<div class="draftCard" data-o="${o.id}">${bigCardHTML(cid)}</div>`;
    }).join('');
    afterUiPaint(() => fitCreatureNames($('draftRow')));
    $('draftFoot').innerHTML = p.options.some(o => o.id === 'skip')
      ? `<button class="abtn ghost" id="draftSkipBtn">カードを加えない</button>` : '';
    document.querySelectorAll('.draftCard').forEach(el =>
      el.onclick = () => { choose(el.dataset.o); $('draftOv').classList.remove('on'); });
    const sk = $('draftSkipBtn');
    if (sk) sk.onclick = () => { choose('skip'); $('draftOv').classList.remove('on'); };
    renderHand();
    return;
  } else if (p.type === 'market' && !inShopHand) {
    $('msg').textContent = '';
    A.innerHTML = '';
    openBlockingOverlay('shopScene');
    $('shopGold').innerHTML = '<img src="/assets/ic_gold.png" style="height:2.4dvh;vertical-align:-0.4dvh"> ' + m.gold + ' G';
    const visit = state.shopVisit;
    $('shopShelf').innerHTML = visit ? visit.items.map(item => {
      const insufficient = !item.sold && item.price > m.gold;
      const cls = `${item.sold ? ' sold' : ''}${insufficient ? ' unaffordable' : ''}`;
      return `<div class="shopProduct${cls}" data-slot="${item.slotId}"><div class="shopCard">${shopCompactHTML(item, visit, insufficient)}</div>
        ${item.sold ? '<div class="shopSold">売り切れ</div>' : ''}</div>`;
    }).join('') : '';
    document.querySelectorAll('.shopProduct:not(.sold)').forEach(el => el.onclick = () => openShopDetail(el.dataset.slot));
    $('shopExit').onclick = () => choose('done');
    afterUiPaint(() => fitCreatureNames($('shopShelf')));
  } else if (p.type === 'market' && inShopHand) {
    $('msg').textContent = '手札を確認中';
    A.innerHTML = '<button class="abtn ghost" onclick="inShopHand=false; render()">店にもどる</button>';
  } else {
    // tile / pick_creature / support: カード選択+ボタン
    const btns = [];
    const actionOpts = [];
    for (const o of p.options) {
      if (o.id.startsWith('summon:') || o.id.startsWith('atk:') || (o.id.startsWith('sup:') && o.id !== 'sup:none')) continue;
      const cls = o.id === 'invade' ? 'danger' : (o.id === 'pass' || o.id === 'cancel' || o.id === 'sup:none') ? 'ghost' : '';
      actionOpts.push({ id:o.id, label:iconize(o.label), cls, desc:actionDescription(o.id) });
    }
    A.innerHTML = '';
    const hasCardChoices = p.options.some(o => o.id.startsWith('summon:') || o.id.startsWith('atk:') || (o.id.startsWith('sup:') && o.id !== 'sup:none'));
    if (hasCardChoices) setContextActions(p.prompt, actionOpts);
    else if (actionOpts.length) {
      const enemyTileActions = p.type === 'tile' && actionOpts.some(o => o.id === 'toll');
      if (enemyTileActions) setContextActions(p.prompt, actionOpts);
      showActionOverlay(p.prompt, actionOpts, {
        key:`auto|${p.type}|${actionOpts.map(o => o.id).join(',')}`,
        browseHand:enemyTileActions
      });
    }
  }
  renderHand();
}
</script>
</body>
</html>
