<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reggae+One&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#141227">
<title>Summons Crest — 手元</title>
<style>
  :root { --ink:#141227; --ink2:#1E1B3C; --gold:#C9A227; --gold-soft:#EFD98F; --parchment:#F1E8D0; }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  body { background:radial-gradient(ellipse at 50% 0%, #2A2650 0%, var(--ink) 70%);
         height:100dvh; overflow:hidden; color:var(--parchment);
         font-family:"Hiragino Mincho ProN","Yu Mincho",serif; user-select:none;
         display:flex; flex-direction:column; }  /* フロー配置: HUD/メッセージ/手札が重ならない */
  #rotate { display:none; position:fixed; inset:0; z-index:99; background:var(--ink);
        align-items:center; justify-content:center; flex-direction:column; gap:14px;
        font-size:17px; letter-spacing:3px; }
  #rotate .ic { font-size:52px; animation:tilt 1.6s ease-in-out infinite alternate; }
  @keyframes tilt { to { transform:rotate(-90deg); } }
  @media (orientation:portrait) { body.ingame #rotate { display:flex; } }

  /* 参加フォーム(縦横どちらでも) */
  #join { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
        padding-top:6dvh; gap:12px; z-index:50; background:var(--ink); }
  #join img { height:auto; max-height:16dvh; max-width:86vw; object-fit:contain; }
  #join input { font-family:inherit; font-size:17px; text-align:center; letter-spacing:3px;
        background:var(--ink2); color:var(--parchment); border:1px solid var(--gold);
        border-radius:10px; padding:11px; width:min(70vw, 300px); }
  #join button { font-family:inherit; font-size:16px; letter-spacing:3px; padding:12px;
        width:min(70vw, 300px); background:linear-gradient(180deg,#E8C55A,#B8901F);
        color:#241C05; border:1px solid #F2D062; border-radius:10px; cursor:pointer; }
  #err { color:#F09595; font-size:13px; min-height:1.2em; }

  header { flex:none; display:flex; align-items:center; gap:10px;
        padding:6px calc(12px + env(safe-area-inset-right)) 6px calc(12px + env(safe-area-inset-left)); }
  .me { display:flex; align-items:center; gap:8px; background:rgba(0,0,0,.35);
        border:1px solid var(--gold); border-radius:10px; padding:4px 14px 4px 5px; flex:none; }
  .dirBtn { font-family:'Reggae One','Yu Mincho',serif; display:flex; flex-direction:column;
        align-items:center; gap:.6dvh; background:linear-gradient(170deg,#2E2A52,#1B1838);
        color:var(--gold-soft); border:2px solid var(--gold); border-radius:2.4dvh;
        padding:2.2dvh 5vw; font-size:max(2.6dvh, 15px); letter-spacing:.4dvh; cursor:pointer; }
  .dirBtn:active { transform:scale(.94); background:rgba(201,162,39,.25); }
  .me > img { width:10dvh; height:10dvh; border-radius:1.6dvh; object-fit:contain; flex:none;
        filter:drop-shadow(0 2px 5px rgba(0,0,0,.45)); }
  .me .nm { font-size:max(2.4dvh, 13px); letter-spacing:1px; }
  .me .st { font-size:max(2dvh, 12px); color:var(--gold-soft); font-family:sans-serif;
        font-variant-numeric:tabular-nums; white-space:nowrap; line-height:1.45; }
  .me .st .assetBig { font-size:max(3.1dvh, 17px); font-weight:700; color:#F2D062;
        text-shadow:0 0 8px rgba(242,208,98,.45); letter-spacing:.5px; }
  .me .st .assetBig small { font-size:.55em; font-weight:400; opacity:.8; }
  #msg.big { font-size:max(4dvh, 20px); }
  /* 中段: 左=行動メッセージ / 右=アクション(フロー配置なので重ならない) */
  #midRow { flex:1; min-height:0; display:flex; align-items:stretch; gap:10px;
        padding:2px calc(12px + env(safe-area-inset-right)) 2px calc(12px + env(safe-area-inset-left)); }
  #msg { flex:none; width:26vw; display:flex; align-items:center; justify-content:center; text-align:center;
        font-size:max(2.2dvh, 13px); letter-spacing:1px; color:var(--gold-soft); line-height:1.4;
        text-shadow:0 1px 4px rgba(0,0,0,.6); font-family:'Reggae One','Yu Mincho',serif;
        overflow:hidden; background:rgba(0,0,0,.28); border:1px solid rgba(201,162,39,.35);
        border-radius:1.2dvh; padding:.6dvh 1dvh; }
  #msg:empty { opacity:0; }
  #mapBtn { font-family:inherit; font-size:13px; padding:6px 10px; margin-left:auto;
        background:rgba(201,162,39,.18); color:var(--gold-soft);
        border:1px solid var(--gold); border-radius:7px; margin-right:6px; }
  #fsBtn { font-family:inherit; font-size:12px; background:rgba(0,0,0,.4); color:rgba(241,232,208,.8);
        border:1px solid rgba(201,162,39,.5); border-radius:7px; padding:5px 9px; }

  #action { flex:1; min-width:0; display:flex; align-items:center; justify-content:center; gap:14px;
        padding:0 8px; overflow:hidden; }
  .abtn { font-family:inherit; font-size:max(2.7dvh, 15px); letter-spacing:2px; padding:1.8dvh 3.4dvh;
        background:linear-gradient(180deg,#E8C55A,#B8901F); color:#241C05;
        border:2px solid #F2D062; border-radius:12px; cursor:pointer;
        box-shadow:0 4px 14px rgba(0,0,0,.5); }
  .abtn:active { transform:scale(.96); }
  .abtn:disabled { filter:grayscale(.75) brightness(.55); }
  .abtn.ghost { background:transparent; color:var(--gold-soft); border:1px solid var(--gold); box-shadow:none; }
  .abtn.danger { background:linear-gradient(180deg,#D96A50,#A3402B); border-color:#F0937B; color:#2A0B05; }
  .btnCol { display:flex; flex-direction:column; gap:8px; max-height:100%; overflow-y:auto; padding:4px; }
  .btnCol .abtn { font-size:max(2.3dvh, 14px); padding:1.2dvh 2.4dvh; text-align:left; }
  .waitDots { font-size:4dvh; color:var(--gold); letter-spacing:6px; animation:blink 1.2s infinite; }
  @keyframes blink { 50% { opacity:.3; } }

  /* 3Dダイス */
  #diceBtn { width:16dvh; height:16dvh; border-radius:50%; font-size:2.5dvh; white-space:nowrap;
        box-shadow:0 0 0 8px rgba(201,162,39,.15), 0 4px 14px rgba(0,0,0,.5); }
  .diceStage { position:relative; width:15dvh; height:18dvh; perspective:700px; }
  .diceStage.drop { animation:dbounce 1.4s cubic-bezier(.3,.6,.4,1); }
  @keyframes dbounce { 0%{transform:translateY(-15dvh)} 52%{transform:translateY(0)}
    68%{transform:translateY(-4dvh)} 80%{transform:translateY(0)} 89%{transform:translateY(-1.4dvh)} 100%{transform:translateY(0)} }
  .dice3d { position:absolute; left:50%; top:42%; width:11dvh; height:11dvh; margin:-5.5dvh 0 0 -5.5dvh;
        transform-style:preserve-3d; }
  .dface { position:absolute; inset:0; background:linear-gradient(160deg,#F5EDD8,#DCCFA8);
        border:2px solid var(--gold); border-radius:1.6dvh; backface-visibility:hidden;
        display:flex; align-items:center; justify-content:center;
        box-shadow:inset 0 0 1.4dvh rgba(90,59,20,.25); }
  .dface svg { width:74%; height:74%; }
  .f1{transform:translateZ(5.5dvh)} .f2{transform:rotateX(90deg) translateZ(5.5dvh)}
  .f3{transform:rotateY(90deg) translateZ(5.5dvh)} .f4{transform:rotateY(-90deg) translateZ(5.5dvh)}
  .f5{transform:rotateX(-90deg) translateZ(5.5dvh)} .f6{transform:rotateY(180deg) translateZ(5.5dvh)}

  /* 手札 */
  #handWrap { flex:none; height:56dvh; position:relative; padding:0 calc(10px + env(safe-area-inset-right))
        calc(6px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left)); }
  #lpHint { position:absolute; right:calc(14px + env(safe-area-inset-right)); bottom:calc(2px + env(safe-area-inset-bottom));
        font-size:11px; color:rgba(241,232,208,.45); letter-spacing:1px; pointer-events:none; z-index:5; }
  #hand .card { animation:dealIn .45s cubic-bezier(.2,.85,.3,1) backwards; }
  @keyframes dealIn { from { transform:translateX(16dvh) translateY(2dvh) rotate(6deg); opacity:0; } }
  #hand { display:flex; gap:10px; height:100%; overflow-x:auto; padding:14px 6px 4px;
        align-items:flex-end; -webkit-overflow-scrolling:touch; }
  .card { flex:none; height:100%; aspect-ratio:300/470; width:auto; position:relative;
        perspective:700px; cursor:pointer; transition:transform .15s; }
  .card.sel { transform:translateY(-12px); }
  .card.sel .face { border-color:#F2D062; box-shadow:0 0 0 2px #F2D062, 0 8px 20px rgba(242,208,98,.4); }
  .card.dim { filter:brightness(.6) saturate(.6); cursor:default; }
  .flip { position:absolute; inset:0; transform-style:preserve-3d;
        transition:transform .55s cubic-bezier(.3,1.4,.5,1); }
  .flip.flipped { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; backface-visibility:hidden; border-radius:10px;
        background:url("/assets/card_bg.jpg") center / cover; color:#3A2B18; border:2px solid #2C2A4A;
        padding:8px; display:flex; flex-direction:column; align-items:center;
        box-shadow:0 3px 8px rgba(0,0,0,.45); overflow:hidden; }
  .face::before { content:""; position:absolute; inset:0; border-radius:7px; pointer-events:none;
        box-shadow:inset 0 0 18px rgba(90,59,20,.18); }
  .face.back { transform:rotateY(180deg); border-color:#8A6A1E;
        box-shadow:inset 0 0 40px rgba(201,162,39,.25), 0 3px 8px rgba(0,0,0,.45); }
  .evoRibbon { position:absolute; top:12px; left:-34px; transform:rotate(-38deg);
        background:linear-gradient(180deg,#E8C55A,#B8901F); color:#241C05; font-size:1.5dvh;
        letter-spacing:2px; padding:2px 38px; box-shadow:0 1px 4px rgba(0,0,0,.4); }
  .face .cost { position:absolute; top:6px; left:6px; width:max(4.4dvh, 26px); height:max(4.4dvh, 26px); border-radius:50%;
        background:#2C2A4A; color:var(--gold-soft); display:flex; align-items:center; justify-content:center;
        font-size:max(1.7dvh, 11px); font-family:sans-serif; border:1px solid var(--gold); z-index:2; }
  .face .art { height:50%; display:flex; align-items:flex-end; justify-content:center; margin-top:6.2dvh; }
  .face .art img { max-height:100%; filter:drop-shadow(0 3px 4px rgba(58,43,24,.35)); }
  .face .tok2 { width:10dvh; height:10dvh; border-radius:50%; margin-top:6.5dvh; color:#F6EFDD;
        display:flex; align-items:center; justify-content:center; font-size:2dvh; border:3px solid #2C2A4A; }
  .face .glyph { height:54%; display:flex; align-items:center; justify-content:center;
        font-size:8.5dvh; margin-top:3dvh; color:#2C2A4A; }
  .face .nm { font-size:max(2.2dvh, 13px); letter-spacing:1px; margin-top:.6dvh; }
  .face .stats { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; row-gap:0;
      font-family:sans-serif; font-size:max(1.9dvh, 12px); margin-top:.4dvh; }
  .face .stats b { color:#A3402B; } .face .stats i { color:#2E5E4E; font-style:normal; }
  .face .stats .up { color:#8A6A1E; font-weight:700; }
  .face .type { position:absolute; bottom:5px; right:9px; font-size:1.3dvh; color:rgba(58,43,24,.6); }
  .flipBtn { position:absolute; bottom:5px; left:7px; z-index:5; font-family:inherit; font-size:max(1.4dvh, 11px);
        background:#2C2A4A; color:var(--gold-soft); border:1px solid var(--gold);
        border-radius:999px; padding:2px 9px; cursor:pointer; }

  /* ショップシーン */
  #shopScene { position:fixed; inset:0; display:none; z-index:40;
      background:url('/assets/shop_bg.jpg') center / cover; }
  #shopScene.on { display:block; }
  #shopScene .keeper { position:absolute; left:2vw; bottom:0; height:72dvh;
      filter:drop-shadow(0 0 20px rgba(0,0,0,.6)); }
  #shopScene .bubble { position:absolute; left:24vw; top:4dvh; background:var(--parchment);
      color:#3A2B18; font-size:max(2.4dvh, 14px); letter-spacing:1px; padding:1.4dvh 2.6dvh;
      border-radius:1.6dvh; border:2px solid #8A6A1E; max-width:36vw; }
  #shopBtns { position:absolute; right:calc(2vw + env(safe-area-inset-right)); top:4dvh; bottom:3dvh;
      width:52vw; display:flex; flex-direction:column; gap:1.6dvh; overflow-y:auto; padding:4px; }
  .shopBtn { font-family:inherit; font-size:max(2.8dvh, 15px); letter-spacing:1px; padding:2.2dvh 2.6dvh;
      background:linear-gradient(180deg,#E8C55A,#B8901F); color:#241C05; text-align:left;
      border:2px solid #F2D062; border-radius:1.6dvh; cursor:pointer; flex:none;
      box-shadow:0 3px 10px rgba(0,0,0,.5); }
  .shopBtn:active { transform:scale(.97); }
  .shopBtn.ghost { background:rgba(20,18,39,.75); color:var(--gold-soft); border:1px solid var(--gold); }
  /* ドロー開帳 */
  #drawModal { position:fixed; inset:0; display:none; z-index:60; align-items:center;
      justify-content:center; background:rgba(10,8,25,.85); }
  #drawModal.on { display:flex; }
  @keyframes drawIn { from { transform:scale(.3) rotateY(180deg); opacity:0; } }
  #drawModal .tap { position:absolute; bottom:6dvh; width:100%; text-align:center;
      font-size:2dvh; letter-spacing:3px; color:rgba(241,232,208,.8); }

  /* キャラ選択 */
  /* デッキビューア */
  #deckOv { position:fixed; inset:0; display:none; z-index:55; background:rgba(10,8,25,.96);
      flex-direction:column; padding:2dvh calc(3vw + env(safe-area-inset-left)) 2dvh; }
  #deckOv.on { display:flex; }
  #deckOv h2 { font-size:3dvh; color:var(--gold-soft); letter-spacing:.6dvh; margin:0 0 1dvh; }
  #deckScroll { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:1.6dvh; padding-bottom:2dvh; }
  .dkSec { font-size:max(2.3dvh, 15px); color:var(--gold-soft); border-bottom:1px solid rgba(201,162,39,.35);
      padding-bottom:.4dvh; margin-top:.6dvh; }
  .dkGrid { display:flex; flex-wrap:wrap; gap:1dvh; }
  .dkCard { position:relative; flex:none;
      width:calc((100vw - env(safe-area-inset-left) - env(safe-area-inset-right) - 28px - 6.4dvh) / 5 - 4px);
      aspect-ratio:300/470; }
  .dkCard.pick { cursor:pointer; }
  .dkCard.pick:active { transform:scale(.96); }
  .dkCard.pick .face { box-shadow:0 0 0 2px var(--gold), 0 4px 12px rgba(0,0,0,.5); }
  .dkN { position:absolute; top:-.8dvh; right:-.8dvh; z-index:3; background:var(--gold);
      color:#241C05; font-size:2.2dvh; font-weight:700; border-radius:999px; padding:.2dvh 1.3dvh;
      box-shadow:0 2px 6px rgba(0,0,0,.5); font-variant-numeric:tabular-nums; }
  .dkZoneTag { position:absolute; top:-.8dvh; left:-.4dvh; z-index:3; background:rgba(20,18,39,.92);
      color:var(--gold-soft); font-size:1.7dvh; border:1px solid var(--gold); border-radius:999px;
      padding:.2dvh 1.4dvh; }
  .dkRow { display:flex; align-items:center; gap:1.4dvh; background:rgba(0,0,0,.35);
      border:1px solid rgba(201,162,39,.3); border-radius:1.2dvh; padding:.7dvh 1.4dvh;
      min-width:38dvh; font-size:max(2dvh, 13px); color:var(--parchment); }
  .dkRow.pick { cursor:pointer; border-color:rgba(201,162,39,.7); }
  .dkRow.pick:active { transform:scale(.97); background:rgba(201,162,39,.2); }
  .dkThumb { width:6.5dvh; height:6.5dvh; object-fit:contain; flex:none;
      filter:drop-shadow(0 1px 3px rgba(0,0,0,.5)); }
  .dkThumb.g { display:flex; align-items:center; justify-content:center; }
  .dkNm { line-height:1.3; }
  .dkSub { display:block; font-size:max(1.5dvh, 10px); color:rgba(241,232,208,.65); }
  .dkCnt { margin-left:auto; font-size:2.4dvh; color:var(--gold-soft); font-variant-numeric:tabular-nums; }
  .dkZone { font-size:1.6dvh; color:rgba(241,232,208,.7); background:rgba(0,0,0,.4);
      border-radius:999px; padding:.2dvh 1.2dvh; margin-left:auto; flex:none; }
  #deckClose { margin-top:1dvh; align-self:center; }
  .dkCard.dis { opacity:.35; pointer-events:none; }
  /* ミニマップ(領地選択) ─ 全画面オーバーレイ。空きスペースへの押し込み配置は禁止 */
  #mapOv { position:fixed; inset:0; display:none; z-index:58; background:rgba(10,8,25,.97);
      flex-direction:column; gap:1dvh;
      padding:1.6dvh calc(3vw + env(safe-area-inset-right)) 1.6dvh calc(3vw + env(safe-area-inset-left)); }
  #mapOv.on { display:flex; }
  #mapOvTitle { flex:none; text-align:center; font-size:max(2.6dvh, 15px); letter-spacing:2px;
      color:var(--gold-soft); font-family:'Reggae One','Yu Mincho',serif; padding-right:24vw; padding-left:6vw; }
  /* マス表示の切替(領地主/レベル/クリーチャー) ─ 画面右上 */
  #mmModeSw { position:absolute; top:1.4dvh; right:calc(3vw + env(safe-area-inset-right));
      display:flex; gap:.8dvh; z-index:2; }
  .mmSwBtn { font-family:inherit; font-size:max(1.8dvh, 11px); letter-spacing:1px; cursor:pointer;
      background:rgba(0,0,0,.4); color:rgba(241,232,208,.7); border:1px solid rgba(201,162,39,.4);
      border-radius:999px; padding:.7dvh 1.8dvh; }
  .mmSwBtn.act { background:rgba(201,162,39,.25); color:var(--gold-soft); border-color:var(--gold); }
  .mmT .mmFace { width:82%; height:82%; object-fit:contain; border-radius:1dvh; pointer-events:none;
      filter:drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  .mmT .mmCre { width:88%; height:88%; object-fit:contain; pointer-events:none;
      filter:drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  #mapOvBody { flex:1; min-height:0; display:flex; gap:4vw; align-items:center; justify-content:center; }
  #mapOvMap { flex:none; height:100%; aspect-ratio:1; max-width:46vw; display:flex; align-items:center; }
  #mapOvSide { flex:none; display:flex; flex-direction:column; gap:1.6dvh; width:32vw; }
  #mapOvSel { font-size:max(2.1dvh, 13px); color:var(--parchment); background:rgba(0,0,0,.4);
      border:1px solid rgba(201,162,39,.4); border-radius:1.2dvh; padding:1.2dvh 1.6dvh;
      line-height:1.5; min-height:9dvh; }
  #miniMap { position:relative; display:grid; grid-template-columns:repeat(8, 1fr); gap:.5dvh;
      width:100%; aspect-ratio:1; margin:0 auto; }
  .mmT { position:relative; border-radius:.8dvh; border:2px solid rgba(255,255,255,.18);
      display:flex; align-items:center; justify-content:center;
      font-size:max(1.9dvh, 11px); color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.8);
      font-family:sans-serif; }
  .mmT.sel { outline:3px solid #FFE79A; outline-offset:1px; z-index:2; transform:scale(1.12); }
  .mmT.pickable { border-color:var(--gold); box-shadow:0 0 8px rgba(201,162,39,.8);
      cursor:pointer; animation:mmPulse 1.1s ease infinite alternate; }
  @keyframes mmPulse { from { box-shadow:0 0 4px rgba(201,162,39,.5); } to { box-shadow:0 0 12px rgba(255,231,154,.95); } }
  .mmT.dim { opacity:.32; }
  .mmT .mmOwn { position:absolute; inset:auto 2px 2px 2px; height:3px; border-radius:2px; }
  .mmT .mmMe { position:absolute; top:-1dvh; right:-.6dvh; width:2.2dvh; height:2.2dvh;
      border-radius:50%; border:2px solid #fff; }
  /* リザルト画面 */
  #resultOv { position:fixed; inset:0; display:none; z-index:60; background:rgba(10,8,25,.96);
      flex-direction:column; align-items:center; justify-content:center; gap:1.6dvh; }
  #resultOv.on { display:flex; }
  #resultTitle { font-size:5.2dvh; letter-spacing:1.4dvh; color:var(--gold-soft); font-family:serif;
      text-shadow:0 2px 12px rgba(0,0,0,.85), 0 0 24px rgba(201,162,39,.4);  font-family:'Reggae One','Yu Mincho',serif; }
  #resList { display:flex; flex-direction:column; gap:1.2dvh; }
  .resRow { display:flex; align-items:center; gap:2.2dvh; background:rgba(0,0,0,.4);
      border:1px solid rgba(201,162,39,.4); border-radius:1.4dvh; padding:1dvh 3dvh;
      font-size:2.6dvh; min-width:64dvh; }
  .resRow.win { border-color:var(--gold); background:rgba(201,162,39,.18); }
  .resRow.mine { outline:2px solid rgba(241,232,208,.55); }
  .resRow img { height:5.6dvh; width:5.6dvh; border-radius:1dvh; object-fit:contain;
      border:2px solid var(--cc,#888); background:rgba(0,0,0,.25); flex:none; }
  .resRank { width:7dvh; font-size:3dvh; color:var(--gold-soft); flex:none; }
  .resWin { color:var(--gold-soft); font-size:2dvh; letter-spacing:.3dvh; margin-left:1dvh; }
  .resPts { margin-left:auto; font-size:3.2dvh; color:var(--gold-soft); font-variant-numeric:tabular-nums; }

  shield: () => sic('up', '7.5dvh'), gshield: () => sic('up', '7.5dvh'), jinx: () => '❂' };
// アートが存在するスペル(無いものは呪文アイコンで代用)
const SPELL_ART = new Set(['sp_gold','sp_weaken','sp_gale','sp_quake','sp_volcanic_core','sp_abyssal_pearl',
  'sp_earth_mother_stone','sp_sky_crystal','sp_flame_vortex','sp_bloodstained_blade','sp_high_tide',

  ? `<div class="art"${h ? ` style="height:${h}"` : ''}><img src="/assets/c_${c}.png"></div>`

let es = null, lastMsgAt = 0;
function connect() {
  if (es) es.close();
  es = new EventSource('/api/events?room=' + room + '&me=' + pid);
  es.onmessage = e => {
    lastMsgAt = Date.now();
    $('connBar').style.display = 'none';
    state = JSON.parse(e.data);
    syncHasArt();
    render();
  };
  es.onerror = () => { $('connBar').style.display = 'block'; };
}
function enterGame() {
  $('join').style.display = 'none';
  ['hdr','msg','action','handWrap'].forEach(id => $(id).style.display = '');
  document.body.classList.add('ingame');
  connect();
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && room && Date.now() - lastMsgAt > 8000) connect();
});
$('joinBtn').onclick = async () => {
  const r = await fetch('/api/join', { method:'POST', body: JSON.stringify({
    room: $('codeIn').value.trim().toUpperCase(), name: $('nameIn').value.trim() }) });
  const d = await r.json();
  if (d.error) { $('err').textContent = d.error; return; }
  room = d.room; pid = d.playerId;
  try { localStorage.setItem('sc_session', JSON.stringify({ room, pid })); } catch (e) {}
  enterGame();
};
// 保存済みセッションがあれば自動復帰
(async () => {
  let sess = null;
  try { sess = JSON.parse(localStorage.getItem('sc_session') || 'null'); } catch (e) {}
  if (!sess) return;
  try {
    const r = await fetch('/api/resume', { method:'POST',
      body: JSON.stringify({ room: sess.room, playerId: sess.pid }) });
    if (!r.ok) throw 0;
    room = sess.room; pid = sess.pid;
    enterGame();
  } catch (e) {
    try { localStorage.removeItem('sc_session'); } catch (e2) {}
  }
})();
$('fsBtn').onclick = async () => {
  if (!document.fullscreenElement) {
    await document.documentElement.requestFullscreen({ navigationUI:'hide' }).catch(() => {});
    try { await screen.orientation.lock('landscape'); } catch (e) {}
  } else document.exitFullscreen();
};
// ===== デッキビューア(カード表示) =====
function dkCard(c, n, pickId, zone) {
  return `<div class="dkCard ${pickId ? 'pick' : ''}" onclick="${pickId ? `choose('${pickId}')` : `openCardZoom('${c}')`}">
    ${bigCardHTML(c)}
    ${n > 1 ? `<div class="dkN">×${n}</div>` : ''}
    ${zone ? `<div class="dkZoneTag">${zone}</div>` : ''}</div>`;
}
function dkThumb(c) {
  const C = state.catalog;
  if (C.CREATURES[c]) {
    const bid = c.replace(/_f$/, '');
    if (HAS_ART.has(bid)) return `<img class="dkThumb" src="/assets/${bid !== c ? 'e_' : 'c_'}${bid}.png">`;
    return `<div class="dkThumb g" style="background:${RUNE[C.CREATURES[c].elem] || '#6E7288'};border-radius:1dvh"></div>`;
  }
  if (C.SPELLS && C.SPELLS[c]) return SPELL_ART.has(c)
    ? `<img class="dkThumb" src="/assets/c_${c}.png">`
    : `<div class="dkThumb g">${sic('spell', '4.6dvh')}</div>`;
  if (C.SUPPORTS && C.SUPPORTS[c]) {
    const ic = c === 'jinx' ? icIc('ic_curse') : /shield/.test(c) ? sic('up', '4.6dvh') : sic('sword', '4.6dvh');
    return `<div class="dkThumb g">${ic}</div>`;
  }
  return `<div class="dkThumb g">?</div>`;
}
function dkInfo(c) {
  const C = state.catalog;
  const cr = C.CREATURES[c];
  if (cr) return { nm: cr.name, sub: `AT${cr.st}/HP${cr.hp}${cr.fx ? ' ' + cr.fx : ''}` };
  const spl = C.SPELLS && C.SPELLS[c];
  if (spl) return { nm: `呪文「${spl.name}」`, sub: spl.desc };
  const sp = C.SUPPORTS && C.SUPPORTS[c];
  if (sp) return { nm: `支援「${sp.name}」`, sub: sp.jinx ? '相手の支援を無効化(使い切り)' : `${sp.st ? 'AT+' + sp.st : ''}${sp.hp ? 'DF+' + sp.hp : ''}(使い切り)` };
  return { nm: c, sub: '' };
}
function dkRow(c, n, tail, pickId) {
  const inf = dkInfo(c);
  return `<div class="dkRow ${pickId ? 'pick' : ''}" ${pickId ? `onclick="choose('${pickId}')"` : ''}>
    ${dkThumb(c)}<div class="dkNm">${inf.nm}<span class="dkSub">${inf.sub}</span></div>
    ${tail || (n > 1 ? `<div class="dkCnt">×${n}</div>` : '')}</div>`;
}
function dkSection(title, cards) {
  if (!cards || !cards.length) return `<div class="dkSec">${title}(0枚)</div>`;
  const cnt = {};
  cards.forEach(c => cnt[c] = (cnt[c] || 0) + 1);
  return `<div class="dkSec">${title}(${cards.length}枚)</div><div class="dkGrid">` +
    Object.entries(cnt).map(([c, n]) => dkCard(c, n)).join('') + '</div>';
}

$('deckClose').onclick = () => {

// ピックモード: 所持カード全体を見せつつ、選べるカードだけ点灯させる全画面UI
function buildPickOv(title, sections, cancelId) {
  const ov = $('deckOv');
  ov.dataset.pick = cancelId || '';
  ov.querySelector('h2').textContent = title;
  $('deckScroll').innerHTML = sections.map(sec => {
    if (!sec.entries.length) return '';
    const total = sec.entries.reduce((a, e) => a + (e.n || 1), 0);
    return `<div class="dkSec">${sec.name}(${total}枚)</div><div class="dkGrid">` +
      sec.entries.map(e =>
        `<div class="dkCard ${e.pickId ? 'pick' : 'dis'}" ${e.pickId ? `onclick="pickOvChoose('${e.pickId}')"` : ''}>
          ${bigCardHTML(e.card)}${e.n > 1 ? `<div class="dkN">×${e.n}</div>` : ''}
          ${e.zone ? `<div class="dkZoneTag">${e.zone}</div>` : ''}</div>`).join('') + '</div>';
  }).join('');
  $('deckClose').textContent = cancelId ? 'やめる' : '';
  $('deckClose').style.display = cancelId ? '' : 'none';

function pickOvChoose(id) {

  const ov = $('deckOv');

    delete ov.dataset.pick;
    ov.classList.remove('on');

function mmCellContent(t, o) {
  const st2 = { castle: '城', shrine: '祠', market: '市', gate: '門' }[t.t];
  if (st2) return st2;
  if (!o) return '';
  if (mmMode === 'level') return 'L' + o.level;
  if (mmMode === 'creature') {
    const bid = o.creature.replace(/_f$/, '');
    const cr = state.catalog.CREATURES[o.creature];
    const evo = /_f$/.test(o.creature) || (o.level >= (state.evoLevel || 3) && !!state.catalog.CREATURES[bid].evo);
    if (HAS_ART.has(bid)) return `<img class="mmCre" src="/assets/${evo ? 'e_' : 'c_'}${bid}.png">`;
    return `<span style="font-size:max(1.5dvh,9px)">${cr.name.slice(0, 2)}</span>`;
  }
  const pl = state.players.find(q => q.id === o.player);
  return pl && pl.charId ? `<img class="mmFace" src="/assets/f_${pl.charId}.png">` : '';
}
function tileTargets(p) {
  const m = {};
  p.options.forEach(o => {
    const mt = /^(up|ct|qt|mt|mv|mb|sw|sl|st|sd|tg):(\d+)$/.exec(o.id);
    if (mt) m[+mt[2]] = o.id;
  });
  return m;
}

// ===== 選択ドロー(v0.61): タップ即決定+手札へ飛ぶ演出 =====
function pdChoose(oid) {
  if (pdLock) return;
  pdLock = true;
  const idx = +oid.slice(3);
  document.querySelectorAll('#pickRow .draftCard').forEach((el, i) => {
    el.onclick = null;
    el.classList.add(i === idx ? 'pdSel' : 'pdAway');
  });
  const selEl = document.querySelector('#pickRow .pdSel');
  setTimeout(() => { if (selEl) selEl.classList.add('pdToHand'); }, 300);
  pickAnimUntil = Date.now() + 1000;  // 演出が終わるまでオーバーレイを保持(操作ロック)
  choose(oid);
  clearTimeout(pickTickT);
  pickTickT = setTimeout(render, 1050);
}

function renderMiniMap(p) {
  const targets = tileTargets(p);
  const cancel = p.options.find(o => /cancel$|^pass$/.test(o.id));
  $('msg').innerHTML = iconize(p.prompt);
  $('action').innerHTML = '';
  const cells = [];
  MM_GEO.forEach(([gx, gy], i) => {
    const t = state.tiles[i], o = state.owners[i];
    const bg = t.e ? MM_COL[t.e] : '#3A3554';
    const glyph = mmCellContent(t, o);
    const own = o ? `<div class="mmOwn" style="background:${(state.players.find(q => q.id === o.player) || {}).color || '#888'}"></div>` : '';
    const meHere = state.players.some(q => q.pos === i && q.id === pid) ? `<div class="mmMe" style="background:${(me() || {}).color || '#fff'}"></div>` : '';
    const cls = targets[i] ? 'pickable' : 'dim';
    cells.push(`<div class="mmT ${cls} ${mmSel === i ? 'sel' : ''}" style="grid-column:${gx + 1}; grid-row:${gy + 1}; background:${bg}"
      ${targets[i] ? `onclick="mmTap(${i})"` : ''}>${glyph}${own}${meHere}</div>`);
  });
  const selOpt = mmSel !== null && targets[mmSel];
  const selLabel = selOpt ? ((p.options.find(o => o.id === selOpt) || {}).label || '') : '';
  $('mapOvTitle').innerHTML = iconize(p.prompt) + ' <span style="opacity:.75">─ 光っているマスをタップ</span>';
  $('mapOvMap').innerHTML = `<div id="miniMap">${cells.join('')}</div>`;
  $('mapOvSide').innerHTML = `<div id="mapOvSel">${selOpt
      ? tileDetailHTML(mmSel) + `<div class="tdSub" style="margin-top:.6dvh">${iconize(selLabel)}</div>`
      : '光っているマスを選ぶと詳細が表示されます'}</div>
    ${selOpt ? `<button class="abtn" onclick="mmSel=null; hideMapOv(); choose('${selOpt}')">ここに決定</button>` : ''}
    ${cancel ? `<button class="abtn ghost" onclick="mmSel=null; hideMapOv(); choose('${cancel.id}')">${cancel.label}</button>` : ''}`;
  syncMmModeSw();
  $('mapOv').classList.add('on');
}

    shrine: ['⛩ 祠', '止まると+100Gとカード1枚。参拝4回で称号「大巡礼者」'],
    market: ['🏪 市場', 'カード・支援・宝石を購入できる'],

    : `<div class="tdTok" style="background:${RUNE[cr.elem] || '#6E7288'}">${nm.slice(0, 4)}</div>`;
  const fx = state.tileFx && state.tileFx[i];

    .filter(Boolean).join('・') : '';

function fitCreatureNames(root) {

    el.style.fontSize = '';
    const max = el.parentElement.clientWidth * .78;

}
const afterUiPaint = fn => typeof requestAnimationFrame === 'function' ? requestAnimationFrame(fn) : setTimeout(fn, 0);
function galleryFace(cid, cr, evo) {

$('galleryClose').onclick = () => $('galleryOv').classList.remove('on');

$('galZoom').onclick = () => $('galZoom').classList.remove('on');

// ===== カード長押し拡大(効果全文の確認用) =====
let lpFired = false;
function openCardZoom(c) {
  $('cardZoomCard').innerHTML = bigCardHTML(c);
  $('cardZoom').classList.add('on');
  afterUiPaint(() => fitCreatureNames($('cardZoomCard')));
}
$('cardZoom').onclick = () => $('cardZoom').classList.remove('on');
function armLongPress(el, fn) {
  let t = null;
  const start = () => { clearTimeout(t); t = setTimeout(() => { lpFired = true; fn(); setTimeout(() => { lpFired = false; }, 700); }, 450); };
  const cancel = () => clearTimeout(t);
  el.addEventListener('touchstart', start, { passive:true });
  ['touchend','touchmove','touchcancel'].forEach(ev => el.addEventListener(ev, cancel, { passive:true }));
  el.addEventListener('mousedown', start);
  ['mouseup','mouseleave'].forEach(ev => el.addEventListener(ev, cancel));
  el.addEventListener('contextmenu', e => e.preventDefault());
}

function bigCardHTML(c) {
  const sup0 = state.catalog.SUPPORTS && state.catalog.SUPPORTS[c];
  if (sup0) {
    const ic = c === 'jinx' ? `<img src="/assets/ic_curse.png" style="height:12dvh;object-fit:contain">`
      : /shield/.test(c) ? sic('up', '12dvh') : sic('sword', '12dvh');
    const eff = sup0.jinx ? '相手の支援カードを無効化' : `${sup0.st ? 'AT+' + sup0.st : ''}${sup0.hp ? 'DF+' + sup0.hp : ''}`;
    return `<div class="face front">
      <div class="glyph" style="margin-top:8dvh">${ic}</div>
      <div class="nm" style="font-size:3dvh">${sup0.name}</div>
      <div class="fx" style="font-size:2dvh; padding:0 12px">${eff}<br>戦闘時に使用(使い切り)</div>
      <div class="type">支援</div></div>`;
  }
  const spl = state.catalog.SPELLS && state.catalog.SPELLS[c];
  if (spl) return `<div class="face front">

const me = () => state.players.find(p => p.id === pid);
const pend = () => state.pending[pid];

// 手札の各カードが「今どの選択肢に対応するか」
function cardOption(c) {
  const p = pend();
  if (!p) return null;
  const map = { tile: 'summon:' + c, pick_creature: 'atk:' + c, support: 'sup:' + c, roll: 'sp:' + c };
  const oid = map[p.type];
  return oid && p.options.some(o => o.id === oid) ? oid : null;
}
// 使えるカード種を返す。'creature-hint'=タップ不可だが関連あり(明るく残す)、'none'=全て減光
function selectableKind() {
  const p = pend();
  if (!p) return null;
  if (p.type === 'tile') return p.options.some(o => o.id.startsWith('summon:')) ? 'creature' : 'creature-hint';
  if (p.type === 'pick_creature') return 'creature';
  if (p.type === 'support') return 'support';
  if (p.type === 'roll') return 'spell';
  if (p.type === 'forge' || p.type === 'gate') return 'creature-hint';
  return 'none';
}
// カードを暗くするかの判定(cardHTMLとクラス更新の両方で共用)
function cardDim(c) {
  const skind = selectableKind();
  if (!skind) return false;
  if (skind === 'none') return true;
  const C = state.catalog;
  const kind = C.CREATURES[c] ? 'creature' : (C.SPELLS && C.SPELLS[c]) ? 'spell' : 'support';
  if (skind === 'creature-hint') return kind !== 'creature';
  return !cardOption(c);
}

function cardHTML(c, i) {
  const C = state.catalog;
  const cr = C.CREATURES[c], sp = C.SUPPORTS[c];
  const dim = cardDim(c);
  const sel = selected === i;
  let front, back = '', frontClass = '';
  if (cr) {
    frontClass = ' creatureCard';
    front = creatureFaceBody(c, cr, false, cr.evo ? `<button class="flipBtn" data-i="${i}">進化 ⟳</button>` : '');
    if (cr.evo) {
      back = `<div class="face back creatureCard">${creatureFaceBody(c, cr, true, `<button class="flipBtn" data-i="${i}">もどす ⟲</button>`)}</div>`;
    }
  } else if (C.SPELLS && C.SPELLS[c]) {
    const spl = C.SPELLS[c];
    front = `<div class="cost">${spl.cost || 0}G</div>${spellArt(c)}
      <div class="nm">${spl.name}</div>
      <div class="stats" style="font-size:max(1.5dvh, 10px); text-align:center; padding:0 6px; line-height:1.4">${spl.desc}</div>
      <div class="rarBadge ${spl.rarity || 'N'}">${spl.rarity || 'N'}</div>
      <div class="type">呪文 ─ 手番開始時に使用</div>`;
  } else if (C.ITEMS && C.ITEMS[c]) {
    const it = C.ITEMS[c];
    front = `<div class="glyph" style="color:#5A2E6E">☠</div><div class="nm">${it.name}</div>
      <div class="stats" style="font-size:1.3dvh; text-align:center; padding:0 4px">${it.desc}</div>
      <div class="type">妨害</div>`;
  } else {
    front = `<div class="glyph">${GLYPH[c] ? GLYPH[c]() : '❖'}</div><div class="nm">${sp.name}</div>
      <div class="stats">${sp.st ? 'AT+' + sp.st : ''}${sp.hp ? 'DF+' + sp.hp : ''}${sp.jinx ? '相手の支援を無効化' : ''}</div>
      <div class="type">支援</div>`;
  }
  return `<div class="card" data-i="${i}" data-c="${c}">
    <div class="flip ${flipped.has(i) ? 'flipped' : ''}"><div class="face front${frontClass}">${front}</div>${back}</div></div>`;
}

let handListKey = '';
function renderHand() {
  const list = me().hand.join(',');
  $('hand').dataset.n = me().hand.length;
  if (list !== handListKey) {
    const oldArr = handListKey ? handListKey.split(',') : [];
    handListKey = list;
    $('hand').innerHTML = me().hand.map((c, i) => cardHTML(c, i)).join('');
    afterUiPaint(() => fitCreatureNames($('hand')));
    document.querySelectorAll('#hand .card').forEach((el, i) => {
      el.style.animationDelay = (i * 80) + 'ms';  // ドローアニメの時間差
    });
    // 新しく手札へ入ったカードを強調(枚数差分で検出)
    const cnt = {};
    oldArr.forEach(c => cnt[c] = (cnt[c] || 0) + 1);
    me().hand.forEach((c, i) => {
      if (cnt[c]) { cnt[c]--; return; }
      const el = document.querySelector(`#hand .card[data-i="${i}"]`);
      if (el && el.classList) el.classList.add('fresh');
    });
    bindHand();
  }
  // 状態(選択・押下可否)は既存DOMのクラス切替のみ(画像を再構築しない)
  document.querySelectorAll('#hand .card').forEach(el => {
    const i = +el.dataset.i, c = el.dataset.c;
    el.classList.toggle('sel', selected === i);
    el.classList.toggle('dim', cardDim(el.dataset.c));
  });
}
function bindHand() {
  document.querySelectorAll('#hand .card').forEach(el => {
    el.onclick = () => {
      if (lpFired) return;  // 長押し直後のclickは選択扱いにしない
      const i = +el.dataset.i, c = el.dataset.c;
      if (!cardOption(c)) return;
      selected = selected === i ? null : i;
      render();
    };
    armLongPress(el, () => {
      const i = +el.dataset.i, c = el.dataset.c;
      const cr = state.catalog.CREATURES[c];
      openCardZoom(flipped.has(i) && cr && cr.evo ? c + '_f' : c);
    });
  });
  document.querySelectorAll('#hand .flipBtn').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const i = +b.dataset.i;
    flipped.has(i) ? flipped.delete(i) : flipped.add(i);
    b.closest('.flip').classList.toggle('flipped');
  });
}

const PIPS = { 1:[[30,30]], 2:[[16,16],[44,44]], 3:[[16,16],[30,30],[44,44]],
  4:[[16,16],[44,16],[16,44],[44,44]], 5:[[16,16],[44,16],[30,30],[16,44],[44,44]],
  6:[[16,16],[44,16],[16,30],[44,30],[16,44],[44,44]] };
const DICE_FACES = [1,2,3,4,5,6].map(v => `<div class="dface f${v}"><svg viewBox="0 0 60 60">${
  PIPS[v].map(([x,y]) => `<circle cx="${x}" cy="${y}" r="5.4" fill="#2C2A4A"/>`).join('')}</svg></div>`).join('');
const FACE_ROT = { 1:[0,0], 2:[-90,0], 3:[0,-90], 4:[0,90], 5:[90,0], 6:[0,180] };
let lastDiceAt = 0, settleT = 0;

function showUltConfirm() {
  const m = me(), u = state.catalog.ULTS[m.charId];
  $('ucName').innerHTML = sic('ult', '2.6dvh') + '【' + u.name + '】';
  $('ucDesc').textContent = u.desc;
  $('ultConfirm').classList.add('on');
}
function startRoll() {
  rolling = true;
  $('action').innerHTML = `<div class="diceStage drop"><div class="dice3d" id="die3d">${DICE_FACES}</div></div>`;
  const die = $('die3d');
  die.style.transition = 'none';
  die.style.transform = 'rotateX(-30deg) rotateY(25deg)';
  let spin = 0;
  const iv = setInterval(() => {
    spin += 47;
    die.style.transform = `rotateX(${spin * 1.3}deg) rotateY(${spin}deg)`;
  }, 60);
  die.dataset.iv = iv;
  choose('roll');
}
function settleDice(n) {
  const die = $('die3d');
  if (!die) { rolling = false; return; }
  clearInterval(+die.dataset.iv);
  const [fx, fy] = FACE_ROT[n];
  die.style.transition = 'transform 1.1s cubic-bezier(.16,.84,.26,1.02)';
  die.style.transform = `rotateX(${fx + 720}deg) rotateY(${fy + 1080}deg)`;
  settleT = Date.now() + 1500;
  setTimeout(() => { rolling = false; render(); }, 1400);
}

function render() {
  if (!state) return;
  const m = me(), C = state.catalog, p = pend();
  const showGui = !!m.charId && (state.phase === 'playing' || state.phase === 'ended');
  document.querySelector('.me').style.display = showGui ? '' : 'none';
  $('galleryBtn').style.display = showGui ? '' : 'none';
  $('deckBtn').style.display = showGui ? '' : 'none';
  $('mapBtn').style.display = showGui ? '' : 'none';
  $('msg').classList.toggle('big', !showGui);
  $('myFace').src = m.charId ? '/assets/f_' + m.charId + '.png' : '';
  $('myName').textContent = m.name + (m.charId ? '(' + C.CHARS[m.charId].name + ')' : '');
  const elemN = ['fire','water','earth','wind'].map(e => {
    const n = state.owners ? state.owners.filter((o, i) => o && o.player === pid && state.tiles[i].e === e).length : 0;
    return `<span style="color:${RUNE[e]}; display:inline-flex; align-items:center; gap:2px; opacity:${n ? 1 : .4}">
      <svg width="12" height="12" viewBox="-34 -36 68 72" style="vertical-align:middle">${ELEM_MINI[e]}</svg>${n}</span>`;
  }).join(' ');
  const ic = n => `<img src="/assets/${n}.png" style="height:2dvh;width:2dvh;object-fit:contain;vertical-align:-0.3dvh">`;
  const statHtml = `<span class="assetBig">資産 ${m.points}<small>/${state.target}G</small></span><br>${ic('ic_gold')}${m.gold} ｜ ${ic('ic_gem')}${m.gems} ｜ 第${m.lap ?? 1}周 ｜ <span style="color:${m.seal ? '#F2D062' : 'rgba(241,232,208,.35)'}">刻印${m.seal ? '❖' : 'なし'}</span><br>領地: ${elemN} ｜ 山札${m.deckCount ?? 0} 捨${m.discardCount ?? 0}`;
  if ($('myStat').dataset.h !== statHtml) {
    $('myStat').dataset.h = statHtml;
    $('myStat').innerHTML = statHtml;
  }

  // ダイスの出目が自分のものなら着地させる
  if (rolling && state.lastDice && state.lastDice.player === pid && state.lastDice.at !== lastDiceAt) {
    lastDiceAt = state.lastDice.at;
    $('msg').textContent = state.lastDice.value + ' が出た!';
    settleDice(state.lastDice.value);
    renderHand();
    return;
  }
  // 方向選択待ちでダイス演出が終わっている(または来ない)場合は描画を止めない
  if (rolling && p && p.type === 'direction' && Date.now() > settleT) rolling = false;
  if (rolling) return;

  // キャラ選択オーバーレイ
  if (state.phase === 'select') {
    const opts = p && p.type === 'select_char' ? p.options.map(o => o.id) : [];
    $('charSel').classList.add('on');
    $('csMsg').textContent = p ? '使用するキャラクターをタップ'
      : (m.charId ? C.CHARS[m.charId].name + ' で決定 ─ 他のプレイヤーを待っています' : '…');
    $('csRow').innerHTML = Object.entries(C.CHARS).map(([id, c]) => {
      const taken = state.players.find(x => x.confirmed && x.charId === id && x.id !== pid);
      const mine = m.charId === id;
      const enabled = opts.includes(id);
      return `<div class="csCard ${mine ? 'mine' : ''} ${(!enabled && !mine) ? 'dim' : ''}"
        style="--cc:${c.color}" data-id="${id}">
        <img src="/assets/full_${id}.png">
        <div class="csName">${c.name}</div>
        <div class="csUlt"><b>${sic('ult', '2dvh')}【${(C.ULTS && C.ULTS[id]) ? C.ULTS[id].name : ''}】</b>${(C.ULTS && C.ULTS[id]) ? C.ULTS[id].desc : ''}<span class="csAff"><svg viewBox="-34 -36 68 72" style="width:1.9dvh;height:1.9dvh;vertical-align:-0.3dvh">${ELEM_MINI[c.elem]}</svg> 親和:${ { fire: '火', water: '水', earth: '土', wind: '風' }[c.elem] } ─ 同属性の土地の強化費-20%</span><span class="csAff">${c.style || ''} ─ ${c.deckNote || ''}</span></div>
        <div class="csState">${mine ? 'あなた' : taken ? taken.name + 'が使用' : ''}</div></div>`;
    }).join('');
    document.querySelectorAll('.csCard').forEach(el => el.onclick = () => {
      const oid = el.dataset.id;
      if ((pend() && pend().type === 'select_char') && pend().options.some(o => o.id === oid)) choose(oid);
    });
  } else $('charSel').classList.remove('on');
  if (!p || p.type !== 'draft') $('draftOv').classList.remove('on');
  if (!p || p.type !== 'gate') $('gateOv').classList.remove('on');
  // 選択ドロー: 選択後の飛翔演出が終わるまでは閉じない(操作ロック)
  if ((!p || p.type !== 'pick_draw') && Date.now() > pickAnimUntil) {
    const pov = $('pickOv');
    if (pov.classList.contains('on')) { pov.classList.remove('on'); pov.dataset.k = ''; }
  }
  const MAP_TYPES = ['curse_target','quake_target','ult_mio','move_a','move_b','swap_land','upgrade',
    'sell','step_a','step_b','spell_target','wc_a','wc_b'];
  if (!mapView && (!p || !MAP_TYPES.includes(p.type))) hideMapOv();
  if (mapView) renderMapView();  // 閲覧モード中は最新stateで再描画
  // ショップシーンの開閉
  const inMarket = pend() && pend().type === 'market';
  if (!inMarket) { $('shopScene').classList.remove('on'); inShopHand = false; }
  else if (inShopHand) $('shopScene').classList.remove('on');
  // 直接ドロー(祠・戦闘勝利・ひらめき)の開帳: 引いたカードを本人にだけ見せる
  const handKey = (m.hand || []).join(',');
  if (state.lastDraw && state.lastDraw.player === pid && state.lastDraw.at !== lastDrawSeen) {
    lastDrawSeen = state.lastDraw.at;
    if (state.lastDraw.reason !== 'pick' && prevHandKey) {  // 選択ドローは選択画面自体で確認済み
      const prevArr = prevHandKey.split(','), nowArr = m.hand.slice();
      for (const c of prevArr) { const k = nowArr.indexOf(c); if (k >= 0) nowArr.splice(k, 1); }
      if (nowArr.length) {
        $('drawCard').innerHTML = nowArr.slice(0, 2).map(c => `<div class="dcOne">${bigCardHTML(c)}</div>`).join('');
        $('drawModal').classList.add('on');
        clearTimeout(drawModalT);
        drawModalT = setTimeout(() => $('drawModal').classList.remove('on'), nowArr.length > 1 ? 2400 : 1700);
      }
    }
  }
  // 獲得カードの山札追加トースト(ドラフト・購入・鍛冶)
  if (state.lastGain && state.lastGain.player === pid && state.lastGain.at !== lastGainSeen) {
    lastGainSeen = state.lastGain.at;
    showGainToast(state.lastGain.n);
  }
  prevHandKey = handKey;

  // テレビ側の移動アニメが終わるまで、到着系UIの表示を待つ
  {
    const pk = p ? p.type + '|' + p.prompt : '';
    if (pk !== lastPendKey) {
      lastPendKey = pk; pendSince = Date.now();
      if (mapView && p) { mapView = false; hideMapOv(); }  // 新しい選択が来たら閲覧モードを閉じる
    }
    const ld = state.lastDice;
    if (p && ['tile', 'upgrade', 'market', 'draft', 'gate', 'forge'].includes(p.type) && ld && ld.player === pid) {
      const GT = GAME_TIMING;  // 盤面と共有の移動タイミング(直書き禁止)
      const steps = ld.multi ? ld.multi.reduce((a, b) => a + b, 0) : ld.value;
      const init = ld.multi ? GT.moveStartDelayMulti : GT.moveStartDelay;
      let doneAt = ld.at + init + steps * GT.stepMs + GT.arriveBuf;
      if (ld.castle && p.type !== 'draft') {
        // 城ドラフト後の到着: テレビ側は選択後に残りを移動する(残り歩数=現在地)
        doneAt = pendSince + GT.castleResume + m.pos * GT.stepMs + GT.arriveBufCastle;
      }
      if (p.type === 'draft' && ld.castle) {
        // 城ドラフトはコマが城に着いた瞬間に表示する
        const from = ((m.pos - steps) % 28 + 28) % 28;
        const toCastle = (28 - from) % 28 || 28;
        doneAt = ld.at + init + toCastle * GT.stepMs + GT.castleDraftLead;
      }
      // サーバーとの時計ズレで「移動中…」から抜けなくなるのを防ぐ(最大8秒で強制解除)
      doneAt = Math.min(doneAt, pendSince + 8000);
      if (Date.now() < doneAt) {
        $('msg').textContent = '移動中…';
        $('action').innerHTML = '<div class="waitDots">● ● ●</div>';
        $('shopScene').classList.remove('on');
        clearTimeout(moveT);
        moveT = setTimeout(render, doneAt - Date.now() + 40);
        renderHand();
        return;
      }
    }
  }
  const A = $('action');
  const sel = selected !== null ? m.hand[selected] : null;

  const pnow = pend();
  if (!pnow || !['forget', 'overflow', 'forge', 'swap_pick'].includes(pnow.type)) closePickOv();
  if (m.bankrupt) {
    $('msg').innerHTML = '破産 ─ 脱落しました(観戦中)';
    A.innerHTML = '';
    renderHand();
    return;
  }
  if (state.phase === 'ended') {
    $('msg').textContent = state.winner === pid ? 'あなたの勝利!'
      : state.players.find(x => x.id === state.winner).name + 'の勝利…';
    A.innerHTML = '';
    renderResult();
  } else if (!p) {
    const t = state.players[state.turn];
    const otherSupport = Object.values(state.pending).some(x => x.type === 'support');
    $('msg').textContent = state.phase === 'lobby' ? '開始を待っています…'
      : state.phase === 'select' ? '他のプレイヤーの選択待ち…'
      : otherSupport ? '相手の支援カードを待っています…'
      : (t ? t.name + 'の手番です' : '…');
    A.innerHTML = '<div class="waitDots">● ● ●</div>';
    selected = null;
  } else if (p.type === 'pick_draw') {
    // v0.61 選択ドロー: 2枚を横並びで大きく表示、カードタップで即決定
    $('msg').textContent = '';
    A.innerHTML = '';
    const pkey = p.options.map(o => o.id + ':' + o.card).join(',');
    const pov = $('pickOv');
    if (pov.dataset.k !== pkey) {
      pov.dataset.k = pkey;
      pdLock = false;
      $('pickRow').style.gap = p.options.length >= 3 ? '3.5vw' : '6vw';  // 祠は3枚(v0.72)
      $('pickRow').innerHTML = p.options.map(o => {
        const rr = (C.CREATURES[o.card] || C.SPELLS[o.card] || {}).rarity || 'N';
        return `<div class="draftCard rar-${rr}" data-pd="${o.id}" onclick="pdChoose('${o.id}')">${bigCardHTML(o.card)}</div>`;
      }).join('');
      document.querySelectorAll('#pickRow .draftCard').forEach((el, i) => {
        const o = p.options[i];
        if (o) armLongPress(el, () => openCardZoom(o.card));  // 長押しで拡大は選択中も使える
      });
    }
    $('pickHint').textContent = `選ばなかった${p.options.length - 1}枚は捨て札へ(制限時間はありません)`;
    pov.classList.add('on');
    renderHand();
    return;
  } else if (p.type === 'roll') {
    const hasSp = p.options.some(o => o.id.startsWith('sp:'));
    $('msg').innerHTML = iconize(p.prompt) + (hasSp ? ` <span style="opacity:.75">─ ${sic('spell','2dvh')} 呪文カードをタップで使用</span>` : '');
    const ultIc = sic('ult', '2.4dvh') + ' ';
    const selC = selected !== null && me().hand[selected];
    const castOpt = selC && cardOption(selC);
    const extra = p.options.filter(o => o.id !== 'roll' && !o.id.startsWith('sp:')).map(o =>
      `<button class="${o.id === 'ult' ? 'ultBtn' : 'abtn ghost'}" onclick="${o.id === 'ult' ? 'showUltConfirm()' : `choose('${o.id}')`}" style="font-size:1.9dvh">${o.id === 'ult' ? ultIc : ''}${iconize(o.label)}</button>`).join('')
      + (castOpt ? `<button class="abtn" onclick="choose('${castOpt}'); selected=null;" style="font-size:2dvh">${sic('spell', '2.2dvh')} 「${state.catalog.SPELLS[selC].name}」を唱える</button>` : '');
    A.innerHTML = `<div style="position:relative; width:100%; height:100%">
      <div style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%)">
        <button class="diceImgBtn" id="diceBtn"><img src="/assets/dice_btn.png"></button></div>
      <div style="position:absolute; right:calc(2vw + env(safe-area-inset-right)); top:50%;
        transform:translateY(-50%); display:flex; flex-direction:column; gap:1.2dvh; max-width:34vw;">${extra}</div>
    </div>`;
    $('diceBtn').onclick = startRoll;
  } else if (p.type === 'forget') {
    $('msg').innerHTML = iconize(p.prompt);
    A.innerHTML = '';
    buildPickOv('忘却 ─ 廃棄するカードをタップ(手札・捨て札のみ選択可)', [
      { name: '手札', entries: p.options.filter(o => o.zone === 'h').map(o => ({ card: o.card, pickId: o.id, zone: '手札' })) },
      { name: '捨て札', entries: p.options.filter(o => o.zone === 'd').map(o => ({ card: o.card, pickId: o.id, zone: '捨て札' })) },
      { name: '山札(順不同・選択不可)', entries: (m.deckList || []).map(c => ({ card: c })) },
      { name: '廃棄(選択不可)', entries: (m.exileList || []).map(c => ({ card: c })) },
    ], 'fg:cancel');
  } else if (p.type === 'overflow') {
    $('msg').innerHTML = iconize(p.prompt);
    A.innerHTML = '';
    // 同名カードはまとめて表示し、×N で枚数を示す(全カードを漏れなく見せる)
    const ovCnt = {};
    (m.hand || []).forEach(c => ovCnt[c] = (ovCnt[c] || 0) + 1);
    buildPickOv(`手札上限 ─ 捨てるカードをタップ(現在${m.hand.length}枚 → 7枚まで)`, [
      { name: '手札', entries: p.options.map(o => ({ card: o.card, pickId: o.id, n: ovCnt[o.card] || 1 })) },
    ], null);
  } else if (p.type === 'curse_target' || p.type === 'quake_target' || p.type === 'ult_mio' ||
             p.type === 'move_a' || p.type === 'move_b' || p.type === 'swap_land' || p.type === 'upgrade' ||
             p.type === 'sell' || p.type === 'step_a' || p.type === 'step_b' ||
             p.type === 'spell_target' || p.type === 'wc_a' || p.type === 'wc_b') {
    renderMiniMap(p);
  } else if (p.type === 'direction') {
    $('msg').innerHTML = iconize(p.prompt);
    A.innerHTML = `<div style="display:flex; height:100%; align-items:center; justify-content:center; gap:12vw">
      <button class="dirBtn" onclick="choose('dir:1')">
        <svg viewBox="0 0 24 24" width="9dvh" height="9dvh"><path d="M15.5 4 8 12l7.5 8" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>左回り</span></button>
      <button class="dirBtn" onclick="choose('dir:-1')">
        <svg viewBox="0 0 24 24" width="9dvh" height="9dvh"><path d="M8.5 4 16 12l-7.5 8" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>右回り</span></button>
    </div>`;
  } else if (p.type === 'swap_pick') {
    // 交代: 配置するクリーチャーをカードタップで選ぶ(直接タップの設計思想)
    $('msg').innerHTML = iconize(p.prompt);
    A.innerHTML = '';
    buildPickOv('交代 ─ 配置するクリーチャーをタップ(召喚コスト別途)', [
      { name: '手札のクリーチャー', entries: p.options.filter(o => o.id.startsWith('sp2:') && o.id !== 'sp2:cancel')
        .map(o => ({ card: o.id.slice(4), pickId: o.id })) },
    ], 'sp2:cancel');
  } else if (p.type === 'forge') {
    // 鍛錬: 進化させるクリーチャーをカードタップで選ぶ
    $('msg').innerHTML = iconize(p.prompt);
    A.innerHTML = '';
    buildPickOv(iconize(p.prompt).replace(/選べ/, 'タップ'), [
      { name: '進化できるクリーチャー', entries: p.options.filter(o => o.id.startsWith('fg:'))
        .map(o => { const c = m.hand[+o.id.slice(3)]; const cr2 = C.CREATURES[c] || {};
          return { card: c, pickId: o.id, zone: `→ ${cr2.evo || '進化'}` }; }) },
    ], 'back');
  } else if (p.type === 'gate') {
    // 門: 全画面オーバーレイで選ぶ(押し込み配置だとボタンが見切れるため)
    $('msg').innerHTML = iconize(p.prompt);
    A.innerHTML = '';
    const GATE_META = {
      g_up:    { t: '領地強化', d: '自分の領地1つのレベルを上げる(費用は通常どおり)', ic: 'up' },
      g_draft: { t: 'カードを引く', d: '山札から3枚公開し、1枚を選んで獲得する', ic: 'draft' },
      g_forge: { t: '鍛錬', d: '手札のクリーチャーを進化させる', ic: 'forge' },
      pass:    { t: '何もしない', d: '恩恵を受けずに手番を終える' },
    };
    $('gateBtnsWrap').innerHTML = p.options.map(o => {
      const mt = GATE_META[o.id] || { t: iconize(o.label), d: '' };
      const cost = (o.label.match(/−\d+G/) || [''])[0];
      return `<button class="gateBtn ${o.id === 'pass' ? 'ghost' : ''}" onclick="choose('${o.id}')">
        <div class="gbT">${mt.ic ? sic(mt.ic, '3dvh') + ' ' : ''}${mt.t}${cost ? ` <span class="gbC">${cost}</span>` : ''}</div>
        <div class="gbD">${mt.d}</div></button>`;
    }).join('');
    $('gateOv').classList.add('on');
  } else if (p.type === 'select_char') {
    $('msg').textContent = '';
    A.innerHTML = '';
  } else if (p.type === 'draft') {
    $('msg').textContent = '';
    A.innerHTML = '';
    $('shopScene').classList.remove('on');
    $('draftOv').classList.add('on');
    const dk = p.options.map(o => o.id).join(',');
    if ($('draftRow').dataset.k === dk) { renderHand(); return; }
    $('draftRow').dataset.k = dk;
    $('draftRow').innerHTML = p.options.filter(o => o.id.startsWith('take:')).map(o => {
      const cid = o.id.slice(5);
      const rr = (state.catalog.CREATURES[cid] || state.catalog.SPELLS[cid] || {}).rarity || 'N';
      return `<div class="draftCard rar-${rr}" data-o="${o.id}">${bigCardHTML(cid)}</div>`;
    }).join('');
    $('draftFoot').innerHTML = p.options.some(o => o.id === 'skip')
      ? `<button class="abtn ghost" id="draftSkipBtn">カードを加えない</button>` : '';
    document.querySelectorAll('.draftCard').forEach(el =>
      el.onclick = () => { choose(el.dataset.o); $('draftOv').classList.remove('on'); });
    const sk = $('draftSkipBtn');
    if (sk) sk.onclick = () => { choose('skip'); $('draftOv').classList.remove('on'); };
    renderHand();
    return;
  } else if (p.type === 'market' && !inShopHand) {
    $('msg').textContent = '';
    A.innerHTML = '';
    $('shopScene').classList.add('on');
    $('shopGold').innerHTML = '<img src="/assets/ic_gold.png" style="height:2.4dvh;vertical-align:-0.4dvh"> ' + m.gold + ' G';
    const shopDesc = id => {
      if (id === 'draw') return '山札から3枚公開し、1枚を選んで獲得する';
      if (id.startsWith('buys:')) {
        const sp = C.SUPPORTS[id.slice(5)];
        return sp.jinx ? '戦闘で相手の支援カードを無効化する'
          : `戦闘で${sp.st ? 'AT+' + sp.st : 'DF+' + sp.hp}(秘密裏に同時出し)`;
      }
      if (id === 'buyi:curse') return '敵の土地のクリーチャーのHP-20(自分の次の手番まで)';
      if (id === 'gem') return '集めて秘宝と交換できる(秘宝=勝利点+1)';
      if (id === 'treasure') return '宝石を消費して勝利点+1を獲得!';
      if (id === 'done') return '買い物を終えて手番を終了する';
      return '';
    };
    $('shopBtns').innerHTML =
      `<button class="shopBtn ghost full" onclick="inShopHand=true; render()"><img src="/assets/ic_hand.png" style="height:2.4dvh;width:auto;vertical-align:-0.4dvh"> 手札を見る</button>` +
      p.options.map(o =>
        `<button class="shopBtn ${o.id === 'done' ? 'ghost full' : ''}" onclick="choose('${o.id}')">
          <div class="sbT">${iconize(o.label)}</div><div class="sbD">${shopDesc(o.id)}</div></button>`).join('');
  } else if (p.type === 'market' && inShopHand) {
    $('msg').textContent = '手札を確認中';
    A.innerHTML = '<button class="abtn ghost" onclick="inShopHand=false; render()">店にもどる</button>';
  } else {
    // tile / pick_creature / support: カード選択+ボタン
    $('msg').innerHTML = iconize(p.prompt);
    const btns = [];
    if (sel && cardOption(sel)) {
      const opt = p.options.find(o => o.id === cardOption(sel));
      btns.push(`<button class="abtn" onclick="choose('${opt.id}')">${opt.label}</button>`);
    }
    const NUM = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
    let upN = 0;
    for (const o of p.options) {
      if (o.id.startsWith('summon:') || o.id.startsWith('atk:') || (o.id.startsWith('sup:') && o.id !== 'sup:none')) continue;
      const cls = o.id === 'invade' ? 'danger' : (o.id === 'pass' || o.id === 'cancel' || o.id === 'sup:none') ? 'ghost' : '';
      const prefix = p.type === 'upgrade' && o.id.startsWith('up:') ? (NUM[upN++] || '') + ' ' : '';
      btns.push(`<button class="abtn ${cls}" onclick="choose('${o.id}'); selected=null;">${prefix}${iconize(o.label)}</button>`);
    }
    A.innerHTML = btns.join('');
  }
  renderHand();
}
</script>
</body>
</html>
