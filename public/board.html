<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Summons Crest — 盤面</title>
<style>
  :root { --ink:#141227; --ink2:#1E1B3C; --gold:#C9A227; --gold-soft:#EFD98F; --parchment:#F1E8D0;
      --font-mincho:"Yu Mincho","Hiragino Mincho ProN","Hiragino Mincho Pro","Noto Serif JP",serif; }
  * { box-sizing:border-box; margin:0; }
  body { background:url('/assets/bg.jpg') center / cover no-repeat fixed, #1E1B3C;
         min-height:100vh; overflow:hidden; font-family:var(--font-mincho); font-weight:400;
         color:var(--parchment); }
  body *,button,input,select,textarea { font-family:var(--font-mincho)!important; }
  #world { position:fixed; left:50%; top:0; width:1280px; height:905px; transform-origin:top center;
      transition:transform .85s cubic-bezier(.25,.85,.3,1); }
  #stage { position:absolute; inset:0; }
  .sprite { position:absolute; transform:translate(-50%,-100%); pointer-events:none; }
  .shadow { position:absolute; transform:translate(-50%,-50%); width:64px; height:20px;
            background:radial-gradient(ellipse, rgba(0,0,0,.45), transparent 70%); border-radius:50%; }
  .pawnEl { transition:left .5s ease, top .5s ease; }
  .tok { width:64px; height:64px; border-radius:50%; border:3px solid #2C2A4A; color:#F6EFDD;
         display:flex; align-items:center; justify-content:center; font-size:20px; letter-spacing:1px;
         text-shadow:0 1px 2px rgba(0,0,0,.6); box-shadow:0 3px 6px rgba(0,0,0,.4); }
  #logoImg { transition:opacity .3s; position:fixed; top:10px; left:50%; transform:translateX(-50%); height:56px; z-index:20;
         filter:drop-shadow(0 3px 6px rgba(30,27,60,.55)); }
  .toll { position:absolute; transform:translate(-50%,-50%) skewX(-6deg); padding:1px 11px 2px;
          font:700 13px sans-serif; color:#fff; border-radius:3px; border:1px solid rgba(255,255,255,.5);
          box-shadow:0 2px 5px rgba(0,0,0,.5); text-shadow:0 1px 2px rgba(0,0,0,.45); }

  /* HUD */
  #hud { position:fixed; top:14px; left:14px; width:236px; z-index:30; }
  .plate { position:absolute; left:0; width:236px; height:66px;
           background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22236%22%20height%3D%2266%22%3E%3Cdefs%3E%3Cfilter%20id%3D%22e%22%20x%3D%22-6%25%22%20y%3D%22-14%25%22%20width%3D%22112%25%22%20height%3D%22128%25%22%3E%3CfeTurbulence%20type%3D%22fractalNoise%22%20baseFrequency%3D%220.035%200.1%22%20numOctaves%3D%224%22%20seed%3D%227%22%20result%3D%22t%22%2F%3E%3CfeDisplacementMap%20in%3D%22SourceGraphic%22%20in2%3D%22t%22%20scale%3D%227%22%2F%3E%3C%2Ffilter%3E%3Cfilter%20id%3D%22g%22%3E%3CfeTurbulence%20type%3D%22fractalNoise%22%20baseFrequency%3D%220.8%22%20numOctaves%3D%222%22%20seed%3D%224%22%20result%3D%22n%22%2F%3E%3CfeColorMatrix%20in%3D%22n%22%20values%3D%220%200%200%200%200.32%200%200%200%200%200.25%200%200%200%200%200.13%200%200%200%200.35%200%22%20result%3D%22c%22%2F%3E%3CfeComposite%20in%3D%22c%22%20operator%3D%22in%22%20in2%3D%22SourceAlpha%22%2F%3E%3C%2Ffilter%3E%3CradialGradient%20id%3D%22v%22%20cx%3D%2250%25%22%20cy%3D%2245%25%22%20r%3D%2275%25%22%3E%3Cstop%20offset%3D%2255%25%22%20stop-color%3D%22%235A3B14%22%20stop-opacity%3D%220%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%235A3B14%22%20stop-opacity%3D%220.38%22%2F%3E%3C%2FradialGradient%3E%3C%2Fdefs%3E%3Cg%20filter%3D%22url%28%23e%29%22%3E%3Crect%20x%3D%225%22%20y%3D%224%22%20width%3D%22226%22%20height%3D%2258%22%20rx%3D%222%22%20fill%3D%22%23E8DAB4%22%2F%3E%3Crect%20x%3D%225%22%20y%3D%224%22%20width%3D%22226%22%20height%3D%2258%22%20rx%3D%222%22%20fill%3D%22%23000%22%20filter%3D%22url%28%23g%29%22%2F%3E%3Crect%20x%3D%225%22%20y%3D%224%22%20width%3D%22226%22%20height%3D%2258%22%20rx%3D%222%22%20fill%3D%22url%28%23v%29%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") no-repeat center / 100% 100%;
           padding:10px 14px 10px 16px; color:#3A2B18;
           transition:top .55s cubic-bezier(.22,1,.36,1), filter .3s; }
  .plate.turn { filter:drop-shadow(0 0 7px rgba(201,162,39,.85)); }
  .plate .face { position:absolute; left:-12px; top:11px; width:42px; height:42px; border-radius:9px;
           object-fit:contain; object-position:center;
           filter:drop-shadow(0 2px 5px rgba(0,0,0,.45)); background:transparent; }
  .plate .row1 { display:flex; align-items:center; gap:7px; margin-left:28px; }
  .rankBadge { width:22px; height:22px; border-radius:50%; flex:none; display:flex; align-items:center;
           justify-content:center; font-size:12px; font-weight:700; font-family:serif;
           background:#8B8570; color:#F2EAD4; box-shadow:inset 0 -2px 3px rgba(0,0,0,.35); }
  .rank1 { background:#B8901F; color:#2A1F08; } .rank2 { background:#9CA1AC; color:#23262C; }
  .rank3 { background:#9A6832; color:#241505; }
  .plate .pname { font-size:13.5px; letter-spacing:1px; flex:1; white-space:nowrap; overflow:hidden; }
  .plate .pts { font-size:22px; color:#7A4E00; line-height:1; font-weight:800; white-space:nowrap;
           text-shadow:0 0 6px rgba(242,208,98,.55); }
  .plate .pts small { font-size:11px; color:#7D6844; font-weight:400; }
  .plate .row2 { display:flex; gap:9px; margin:3px 0 0 58px; font-size:11px; color:#5C4A2E; }
  .sealIc { color:rgba(241,232,208,.28); border:1px solid rgba(241,232,208,.22); border-radius:4px;
      padding:0 4px; font-size:11px; font-family:'Reggae One','Yu Mincho',serif; }
  .sealIc.has { color:#F2D062; border-color:#C9A227; text-shadow:0 0 8px rgba(242,208,98,.7);
      background:rgba(201,162,39,.15); }
  .reach { margin-left:auto; font-size:10px; color:#9E2B25; border:1px solid #9E2B25; border-radius:3px;
           padding:0 4px; letter-spacing:1px; animation:blink 1.1s infinite; }
  @keyframes blink { 50% { opacity:.3; } }
  .pbar { position:absolute; left:14px; bottom:8px; height:3px; max-width:calc(100% - 30px);
          background:#8A6A1E; opacity:.85; border-radius:2px; transition:width .5s; }

  /* テロップ・ダイス */
  #telop { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
           justify-content:center; pointer-events:none; z-index:60; }
  #telopImg { width:min(52vw,700px); opacity:0; }
  #telopImg.play { animation:telop 2.2s ease forwards; }
  #telopSub { font-size:24px; letter-spacing:6px; color:var(--gold-soft); opacity:0;
              text-shadow:0 2px 8px rgba(0,0,0,.8);  font-family:'Reggae One','Yu Mincho',serif; }
  #telopSub.play { animation:telop 2.2s ease forwards; }
  @keyframes telop { 0%{opacity:0;transform:scale(1.55);filter:blur(6px)}
    18%{opacity:1;transform:scale(1);filter:blur(0)} 78%{opacity:1} 100%{opacity:0;transform:scale(.94)} }
  #diceFloat { position:fixed; right:26px; bottom:24px; width:92px; height:92px; border-radius:16px;
           background:var(--parchment); color:var(--ink); border:3px solid var(--gold); z-index:40;
           display:flex; align-items:center; justify-content:center; font-size:50px; font-weight:700;
           opacity:0; transition:opacity .3s; }
  #diceFloat.show { opacity:1; }

  /* ロビー・選択・勝利オーバーレイ */
  .overlay { position:fixed; inset:0; background:rgba(16,13,36,.94); z-index:80; display:none;
           flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; }
  .overlay.on { display:flex; }
  .bigcode { font-size:70px; letter-spacing:20px; color:var(--gold-soft); border:2px solid var(--gold);
           border-radius:14px; padding:8px 22px 8px 42px; }
  .hint { font-size:15px; color:rgba(241,232,208,.8); line-height:2; }
  .joined { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; min-height:38px; }
  .joined span { border:1px solid var(--gold); border-radius:999px; padding:5px 16px; font-size:14px; }
  .gbtn { font-family:inherit; font-size:17px; letter-spacing:3px;
           background:linear-gradient(180deg,#E8C55A,#B8901F); color:#241C05;
           border:2px solid #F2D062; border-radius:11px; padding:12px 36px; cursor:pointer; }
  .gbtn:disabled { filter:grayscale(.7) brightness(.55); }
  .selRow { display:flex; gap:14px; }
  .selCard { border:1px solid var(--gold); border-radius:10px; padding:12px 18px; min-width:170px;
           background:rgba(0,0,0,.35); font-size:14px; line-height:2; }
  #winArt { height:56vh; filter:drop-shadow(0 0 40px rgba(242,208,98,.5)); }
  .goldText { font-size:64px; letter-spacing:14px; font-weight:700;
           background:linear-gradient(180deg,#FFE9A0 8%,#E8C55A 35%,#8A6A1E 62%,#F2D062 88%);
           -webkit-background-clip:text; background-clip:text; color:transparent;
           filter:drop-shadow(0 3px 0 #4A3608) drop-shadow(0 0 26px rgba(242,208,98,.6)); }

  /* カード主体の戦闘画面。背景アートは同名WebPを置くだけで差し替えられる。 */
  #battle { position:fixed; inset:0; z-index:70; display:none; overflow:hidden; color:#f6edd3;
      background:
        linear-gradient(rgba(8,6,20,.18),rgba(8,6,20,.42)),
        url('/assets/battle/battle-bg.webp') center/cover no-repeat; }
  #battle.on { display:block; animation:battleIn .45s ease both; }
  @keyframes battleIn { from{opacity:0} to{opacity:1} }
  /* 背景レイヤー自体は動かさない。全画面背景をtransformすると一部GPUで盤面が一瞬露出する。 */
  #battle.shake #battleField { animation:shakeField .4s; }
  #battle::after { content:""; position:absolute; inset:1.6vh 1.2vw; pointer-events:none; z-index:1;
      border:1px solid rgba(226,190,91,.55); border-radius:2.2vh;
      box-shadow:inset 0 0 2.4vh rgba(226,190,91,.14); }
  #bwHost { display:none; }
  #bwHost canvas { width:100%!important; height:100%!important; object-fit:cover; }
  @keyframes shake { 0%,100%{transform:none} 15%{transform:translate(12px,-7px) scale(1.035)}
    50%{transform:translate(-10px,8px) scale(1.035)} 75%{transform:translate(7px,4px) scale(1.035)} }
  @keyframes shakeField { 0%,100%{transform:translateX(-50%)}
    15%{transform:translate(calc(-50% + 10px),-6px) scale(1.012)}
    50%{transform:translate(calc(-50% - 8px),6px) scale(1.012)}
    75%{transform:translate(calc(-50% + 6px),3px) scale(1.008)} }
  #battleTitle { position:absolute; z-index:7; top:3vh; left:50%; transform:translateX(-50%);
      font:700 3.2vh/1 Marudeco,'Yu Mincho',serif; letter-spacing:.45em; color:#f5d56f;
      text-shadow:0 2px 12px #000; white-space:nowrap; }
  #battleField { position:absolute; z-index:3; top:9vh; bottom:10vh; left:50%; width:min(94vw,176vh);
      transform:translateX(-50%); display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      gap:clamp(1rem,2vw,2.5rem); align-items:center; }
  .battleTeam { min-width:0; display:grid; align-items:center; gap:1.1vw; }
  .battleTeam.atk { grid-template-columns:minmax(10vh,13vh) minmax(22vh,29vh) minmax(0,1fr); }
  .battleTeam.def { grid-template-columns:minmax(0,1fr) minmax(22vh,29vh) minmax(10vh,13vh); }
  .bside { position:relative; text-align:center; transition:transform .35s ease-in,opacity .5s,filter .5s;
      perspective:1000px; }
  .bside.lungeL { transform:translateX(7vw) scale(1.04); }
  .bside.lungeR { transform:translateX(-7vw) scale(1.04); }
  .bside.dead { animation:dead .7s forwards; }
  @keyframes dead { 55% { filter:brightness(2.2); transform:translateY(1.5vh) rotate(-3deg) scale(.98); }
    to { opacity:.42; transform:translateY(1.5vh) rotate(-3deg) scale(.98); filter:grayscale(.85) brightness(.55); } }
  .battleCreatureCard { position:relative; width:100%; aspect-ratio:2/3; overflow:hidden; isolation:isolate;
      border-radius:1.5vh; background:#18233e; box-shadow:0 2vh 4vh rgba(0,0,0,.65);
      transform-style:preserve-3d; transition:transform .65s cubic-bezier(.2,.85,.25,1),opacity .35s; }
  .battleCreatureCard.reveal { animation:bCreatureReveal .75s cubic-bezier(.16,.86,.2,1) both; }
  @keyframes bCreatureReveal { from{transform:rotateY(-90deg);opacity:1} to{transform:none;opacity:1} }
  .battleCreatureCard .scBg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:-3; }
  .battleCreatureCard .scHead { position:absolute; z-index:5; top:3.1%; left:4.7%; right:4.7%; height:9.5%;
      display:grid; grid-template-columns:1fr; align-items:center; }
  .battleCreatureCard .scElem { display:none; }
  .battleCreatureCard .scElem svg { width:100%; height:100%; }
  .battleCreatureCard .scElem svg * { fill:#fff!important; }
  .battleCreatureCard .scName { grid-column:1; color:#fff4d5; font:700 2.55vh/1 var(--font-mincho)!important;
      text-align:center; white-space:nowrap; text-shadow:0 2px 5px #000; }
  .battleCreatureCard .scArt { position:absolute; z-index:7; top:8.3%; left:1.5%; width:97%; height:69%;
      object-fit:contain; filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 8px rgba(255,255,255,.55)); }
  .battleCreatureCard .scBrush { position:absolute; z-index:3; top:61.8%; left:0; width:100%; height:10.42%;
      background:url('/assets/cards/brush-boundary-b-paper.png') center/100% 100% no-repeat; }
  .battleCreatureCard .scInfo { position:absolute; z-index:4; inset:70.8% 0 0; padding:0 6.3% 4.2%;
      background:#f6e9c8; color:#172536; }
  .battleCreatureCard .scCost { position:absolute; z-index:8; top:65.2%; left:3.2%; width:27%; aspect-ratio:320/112; }
  .battleCreatureCard .scCost .frame { position:absolute; inset:0; width:100%; height:100%; }
  .battleCreatureCard .scCost .coin { position:absolute; left:7.5%; top:17.8%; width:22.5%; height:64.3%; }
  .battleCreatureCard .scCost b { position:absolute; inset:0 4% 0 31%; display:grid; place-items:center;
      font:700 1.6vh/1 Marudeco,sans-serif; color:#172536; }
  .battleCreatureCard .scStats { height:36%; display:grid; grid-template-columns:1fr 1fr; gap:6%; align-items:center; }
  .battleCreatureCard .scStat { display:grid; grid-template-columns:36% max-content; align-items:center; justify-content:center; gap:2%; }
  .battleCreatureCard .scStat img { width:100%; } .battleCreatureCard .scStat b { font:700 2.8vh/1 Marudeco,sans-serif; }
  .battleCreatureCard .scRule { height:4px; background:url('/assets/cards/rule-brush.svg') center/100% 100% no-repeat; }
  .battleCreatureCard .scEffect { padding:3% 3% 0; text-align:center; }
  .battleCreatureCard .scEffect h3 { margin:0 0 1%; font:700 1.4vh/1.1 Marudeco,sans-serif; }
  .battleCreatureCard .scEffect h3::before{content:'【'} .battleCreatureCard .scEffect h3::after{content:'】'}
  .battleCreatureCard .scEffect p { margin:0; font-size:1vh; line-height:1.35; font-weight:700; }
  .battleCardBack { position:relative; width:100%; aspect-ratio:2/3; border-radius:1.5vh;
      display:grid; place-items:center; color:#e8c55a; font-size:7vh; border:2px solid #c9a227;
      background:repeating-linear-gradient(45deg,#17152c 0 10px,#252140 10px 20px);
      box-shadow:0 2vh 4vh rgba(0,0,0,.65),inset 0 0 0 7px #17152c,inset 0 0 0 9px #9b7920; }
  .battleCardBack small { position:absolute; bottom:12%; left:0; right:0; font-size:1.5vh; letter-spacing:.15em; }
  .battleStats { min-width:0; width:100%; max-width:24vh; box-sizing:border-box; justify-self:center; padding:1.45vh .75vw; border:1px solid rgba(232,197,90,.72);
      border-radius:1.4vh; background:rgba(10,8,25,.91); box-shadow:0 1vh 2.8vh rgba(0,0,0,.58),inset 0 0 2vh rgba(232,197,90,.07);
      text-shadow:0 2px 5px #000; backdrop-filter:blur(3px); }
  .def .battleStats { text-align:right; }
  .bsOwner { color:#ffe596; font:700 2.2vh/1.3 Marudeco,sans-serif; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bsCreature { color:#fff9e8; font-size:1.75vh; font-weight:700; letter-spacing:.08em; margin:.5vh 0 1vh; }
  .bsValues { width:100%; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:.35vw; align-items:stretch; font:700 clamp(2.2vh,2.8vw,3.35vh)/1 Marudeco,sans-serif; }
  .def .bsValues { justify-content:flex-end; }
  .bsValues span { white-space:nowrap; min-width:0; box-sizing:border-box; padding:.65vh .2vw; border-radius:.8vh;
      background:rgba(255,255,255,.075); border:1px solid rgba(255,237,181,.2); text-align:center; }
  .bsValues small { display:block; font-size:1.25vh; margin:0 0 .4vh; color:#f3d06c; letter-spacing:.12em; }
  .bsMods { margin-top:.9vh; min-height:5.6vh; font-size:1.25vh; font-weight:700; line-height:1.5; color:rgba(255,249,232,.9); }
  .bsMods .mod { display:block; } .bsMods .mod.hot { color:#fff1a6; animation:modGlow .75s ease both; }
  .durability { margin-top:.9vh; }
  .durabilityBar { position:relative; display:flex; width:100%; height:2.5vh; overflow:hidden; border:1px solid #d7b84f;
      border-radius:1.3vh; background:rgba(0,0,0,.58); box-shadow:inset 0 0 .7vh rgba(0,0,0,.8); }
  .durabilityHp { height:100%; background:linear-gradient(90deg,#78cf83,#42a456); transition:background .2s; }
  .durabilityHp.low { background:linear-gradient(90deg,#e45e4b,#a52f28); }
  .durabilityDf { height:100%; background:linear-gradient(90deg,#62bfe9,#3378c4); }
  .durabilityNum { position:absolute; inset:0; display:grid; place-items:center; color:white; font:700 1.45vh/1 sans-serif;
      text-shadow:0 1px 4px #000; font-variant-numeric:tabular-nums; }
  .durabilityBreakdown { margin-top:.35vh; text-align:center; color:#d9ecff; font:700 1.15vh/1.2 sans-serif; }
  .supportRevealStage { position:fixed; inset:0; z-index:79; display:grid; place-items:center; pointer-events:none;
      background:radial-gradient(circle,rgba(245,217,117,.2),rgba(8,5,20,.72) 55%,transparent 75%); animation:supportStageIn .25s ease both; }
  .supportRevealStage .scardB { width:28vh; height:40.4vh; filter:drop-shadow(0 2vh 3vh rgba(0,0,0,.85)); }
  .supportRevealStage .supportStatus { font:700 2.5vh/1.3 Marudeco,sans-serif; text-shadow:0 2px 7px #000; }
  .supportRevealStage.none { color:#fff4d5; font:700 4vh/1 Marudeco,sans-serif; }
  @keyframes supportStageIn { from{opacity:0;transform:scale(.72)} to{opacity:1;transform:none} }
  @keyframes modGlow { 50%{text-shadow:0 0 14px #ffe681;transform:scale(1.03)} }
  #battleFx { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:4; }
  .battleFxImg { position:absolute; display:block; pointer-events:none; object-fit:contain;
      filter:drop-shadow(0 0 12px rgba(255,255,255,.32)); }
  .battleFxTrail { top:28%; width:min(36vw,460px); opacity:0; }
  .battleFxTrail.toDef { left:42%; transform-origin:left center;
      animation:bfxTrailDef .38s cubic-bezier(.2,.8,.3,1) forwards; }
  .battleFxTrail.toAtk { right:42%; transform:scaleX(-1); transform-origin:right center;
      animation:bfxTrailAtk .38s cubic-bezier(.2,.8,.3,1) forwards; }
  .battleFxImpact { top:23%; width:min(25vw,310px); opacity:0; transform:translate(-50%,-8%) scale(.35);
      animation:bfxImpact .48s cubic-bezier(.15,.85,.25,1) forwards; }
  .battleFxImpact.atDef { left:72%; } .battleFxImpact.atAtk { left:28%; }
  .battleFxShock { top:25%; width:min(27vw,340px); opacity:0; transform:translate(-50%,-10%) scale(.25);
      animation:bfxShock .55s ease-out forwards; }
  .battleFxShock.atDef { left:72%; } .battleFxShock.atAtk { left:28%; }
  @keyframes bfxTrailDef {
    0% { opacity:0; transform:translate(-22%,-4%) scale(.55) rotate(-8deg); }
    25% { opacity:1; } 100% { opacity:0; transform:translate(34%,4%) scale(1.08) rotate(5deg); }
  }
  @keyframes bfxTrailAtk {
    0% { opacity:0; transform:translate(22%,-4%) scaleX(-1) scale(.55) rotate(-8deg); }
    25% { opacity:1; } 100% { opacity:0; transform:translate(-34%,4%) scaleX(-1) scale(1.08) rotate(5deg); }
  }
  @keyframes bfxImpact {
    0% { opacity:0; transform:translate(-50%,-8%) scale(.35); }
    18% { opacity:1; } 68% { opacity:.95; transform:translate(-50%,-8%) scale(1); }
    100% { opacity:0; transform:translate(-50%,-8%) scale(1.15); }
  }

// 依存なしのQRコード生成(Version 3, 誤り訂正L, マスク0固定 / byteモード最大53文字)
const QR = (() => {
  const EXP = [1], LOG = [];
  for (let i = 1; i < 512; i++) { let v = EXP[i-1] << 1; if (v >= 256) v ^= 0x11D; EXP[i] = v; }
  for (let i = 0; i < 255; i++) LOG[EXP[i]] = i;
  const mul = (a, b) => (a && b) ? EXP[(LOG[a] + LOG[b]) % 255] : 0;

  function eccOf(data, ecLen) {
    let gen = [1];
    for (let i = 0; i < ecLen; i++) {
      const next = new Array(gen.length + 1).fill(0);
      for (let j = 0; j < gen.length; j++) {
        next[j] ^= mul(gen[j], EXP[i]);
        next[j + 1] ^= gen[j];
      }
      gen = next;
    }
    gen.reverse();                    // 先頭が最高次(=1)
    const res = new Array(ecLen).fill(0);
    for (const d of data) {
      const f = d ^ res[0];
      res.shift(); res.push(0);
      if (f) for (let k = 0; k < ecLen; k++) res[k] ^= mul(gen[k + 1], f);
    }
    return res;
  }

  function encode(text) {
    const bytes = new TextEncoder().encode(text);
    const DATA_CW = 55, EC_CW = 15, SIZE = 29;   // Version 3-L
    if (bytes.length > 53) return null;
    const bits = [];
    const push = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >> i) & 1); };
    push(4, 4); push(bytes.length, 8);
    for (const b of bytes) push(b, 8);
    push(0, Math.min(4, DATA_CW * 8 - bits.length));
    while (bits.length % 8) bits.push(0);
    const data = [];
    for (let i = 0; i < bits.length; i += 8)
      data.push(bits.slice(i, i + 8).reduce((a, b) => a * 2 + b, 0));
    const PAD = [0xEC, 0x11];
    while (data.length < DATA_CW) data.push(PAD[data.length % 2]);
    const cw = data.concat(eccOf(data, EC_CW));

    const M = Array.from({ length: SIZE }, () => new Array(SIZE).fill(false));
    const F = Array.from({ length: SIZE }, () => new Array(SIZE).fill(false));
    const set = (r, c, v) => { M[r][c] = v; F[r][c] = true; };
    const finder = (r0, c0) => {
      for (let r = -1; r <= 7; r++) for (let c = -1; c <= 7; c++) {
        const rr = r0 + r, cc = c0 + c;
        if (rr < 0 || cc < 0 || rr >= SIZE || cc >= SIZE) continue;
        const on = (0 <= r && r <= 6 && 0 <= c && c <= 6) &&
                   !((1 <= r && r <= 5 && (c === 1 || c === 5)) || ((r === 1 || r === 5) && 1 <= c && c <= 5));
        set(rr, cc, on);
      }
    };
    finder(0, 0); finder(0, SIZE - 7); finder(SIZE - 7, 0);
    for (let i = 8; i < SIZE - 8; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    for (let r = -2; r <= 2; r++) for (let c = -2; c <= 2; c++)   // 位置合わせ(22,22)
      set(22 + r, 22 + c, Math.max(Math.abs(r), Math.abs(c)) !== 1);
    const FMT = '111011111000100';                                 // L・マスク0の形式情報
    const fbit = i => FMT[14 - i] === '1';
    for (let i = 0; i <= 5; i++) set(i, 8, fbit(i));
    set(7, 8, fbit(6)); set(8, 8, fbit(7)); set(8, 7, fbit(8));
    for (let i = 9; i <= 14; i++) set(8, 14 - i, fbit(i));
    for (let i = 0; i <= 7; i++) set(8, SIZE - 1 - i, fbit(i));
    for (let i = 8; i <= 14; i++) set(SIZE - 15 + i, 8, fbit(i));
    set(SIZE - 8, 8, true);                                        // 暗モジュール

    let bi = 0;
    const total = cw.length * 8;
    const bitAt = i => (cw[i >> 3] >> (7 - (i & 7))) & 1;
    for (let right = SIZE - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let v = 0; v < SIZE; v++) {
        for (let j = 0; j < 2; j++) {
          const c = right - j;
          const up = ((right + 1) & 2) === 0;
          const r = up ? SIZE - 1 - v : v;
          if (F[r][c] || bi >= total) continue;
          M[r][c] = (bitAt(bi++) === 1) !== (((r + c) % 2) === 0);  // マスク0
        }
      }
    }
    return { size: SIZE, matrix: M, codewords: cw };
  }

  function svg(text, scale = 5) {
    const q = encode(text);
    if (!q) return '<div style="font-size:12px">URLが長すぎます</div>';
    const m = 4 * scale, px = q.size * scale + m * 2;
    let rects = '';
    for (let r = 0; r < q.size; r++) for (let c = 0; c < q.size; c++)
      if (q.matrix[r][c]) rects += `<rect x="${m + c * scale}" y="${m + r * scale}" width="${scale}" height="${scale}"/>`;
    return `<svg width="${px}" height="${px}" viewBox="0 0 ${px} ${px}"
      style="background:#fff;border-radius:10px"><g fill="#141227">${rects}</g></svg>`;
  }
  return { encode, svg };
})();

function hopStep() {

  hopState.sN++;
  const idx = (hopState.from + hopState.sN * (hopState.dir || 1) + 28 * 40) % 28;
  pawnAnim[hopState.id] = idx;
  renderPawns();
  if (idx === 0 && hopState.castleEv) {
    const ev = hopState.castleEv;
    setZoom(0);
    cutBusy++;
    hopState.holdUntil = Date.now() + GAME_TIMING.castleZoom + GAME_TIMING.castleBreakdown;
    setTimeout(() => {
      playSe(seCastleBonus);
      showCastleBreakdown(ev);
      for (const h of (ev.healed || [])) fxAt(typeof h === 'number' ? h : h.tile, 'fxRing', '#8FE08A');
    }, GAME_TIMING.castleZoom);
    setTimeout(() => {
      hideCastleBreakdown();
      cutBusy = Math.max(0, cutBusy - 1);
      if (!ev.drew && hopState) {
        hopState.holding = false;
        if (hopState.sN < hopState.steps) setTimeout(hopStep, GAME_TIMING.castleResume);
        else finishHop();
      }
    }, GAME_TIMING.castleZoom + GAME_TIMING.castleBreakdown);
    hopState.castleEv = null;
    hopState.holding = true;   // ドラフト完了までここで待機
    render();
    return;
  }

}

async function playDuel(d) {
  duelPlaying = true;
  const C = state.catalog.CHARS;
  $('duelChar').textContent = '対象キャラ: ' + C[d.char].name;
  $('duelRow').innerHTML = d.contenders.map((c, i) =>
    `<div class="duelist2" id="dl${i}"><div>${c.name}</div><div class="die2" id="dd${i}">?</div></div>`).join('');
  $('duelResult').textContent = '';
  $('selectOv').classList.remove('on');
  $('duelOv').classList.add('on');
  for (let t = 0; t < 13; t++) {
    d.contenders.forEach((_, i) => $('dd' + i).textContent = 1 + Math.floor(Math.random() * 6));
    await new Promise(r => setTimeout(r, 70 + t * 11));
  }
  d.contenders.forEach((c, i) => $('dd' + i).textContent = c.roll);
  const winIdx = d.contenders.findIndex(c => c.id === d.winner);
  $('dl' + winIdx).classList.add('win');
  $('duelResult').textContent = d.contenders[winIdx].name + 'が' + C[d.char].name + 'を獲得! 敗者は選び直し';

  duelPlaying = false;
  render();
}

async function runFxHarness(name) {

    const order = [];
    const items = [];
    for (let k = 0; k < 20; k++) items.push({ pri: [1, 2, 3, 4][k % 4], k });
    items.forEach(({ pri, k }) => queueFx(pri, () => order.push(k)));
    const expected = items.slice().sort((a, b) => a.pri - b.pri || a.k - b.k).map(i => i.k);
    for (let t = 0; t < 40 && bq.length; t++) { render(); await new Promise(r => setTimeout(r, 40)); }
    const orderOk = JSON.stringify(order) === JSON.stringify(expected);
    let afterError = false;
    queueFx(1, () => { throw new Error('boom'); });
    queueFx(1, () => { afterError = true; });
    for (let t = 0; t < 10 && bq.length; t++) { render(); await new Promise(r => setTimeout(r, 40)); }
    const t0 = Date.now();
    await PW.play({ type: 'unknown-type' });

    const e0 = Date.now(); await PW.play({ type: 'debug-wait', ms: 200, id: 'fxdup' }); const d1 = Date.now() - e0;
    const e1 = Date.now(); await PW.play({ type: 'debug-wait', ms: 200, id: 'fxdup' }); const d2 = Date.now() - e1;
    await PW.play({ type: 'debug-error', id: 'fxerr' });   // 例外でもresolveすること
    return { orderOk, exceptionQueueOk: afterError, unknownFast,

  }
  if (name === 'move') {

    const p0 = state.players[0].id;
    const from = state.players[0].pos;
    for (let s2 = 1; s2 <= 8; s2++) {
      pawnAnim[p0] = (from + s2) % 28;
      renderPawns();
      await new Promise(r => setTimeout(r, GAME_TIMING.stepMs));

    const q2 = new URLSearchParams(location.search);
    const result = q2.get('result') || 'win';
    const atkCid = q2.get('atk') || 'orphe';
    const defCid = q2.get('def') || 'nome';
    const preempt = result.indexOf('preempt') === 0;
    const b = { tile: 16, attacker: state.players[0].id, defender: state.players[2].id,
      atkCreature: atkCid, defCreature: defCid, st: 40, atkHp: 40, atkDf: 0,
      hp: 30, df: 20, terrain: 10,
      atkSupport: q2.get('sup') || 'none', defSupport: q2.get('dsup') || 'none',
      notes: atkCid === 'morbill' ? ['【腐蝕】相手の防衛DF-10'] : [],

  }
  // ---- M3: スペル演出ハーネス(?fixture=1&fx=spell&spell=sp_weaken 等) ----
  if (name === 'spell') {
    let alive = true;
    if (document.hidden) {
      const mc = new MessageChannel();
      mc.port1.onmessage = () => { if (!alive) return; PW.pump(1); mc.port2.postMessage(0); };

function buildTollBadges(st2) {

  st2.owners.forEach((o, i) => {
    if (!o || !st2.curses || !st2.curses[i]) return;
    const { x, y } = proj(GEO[i][0], GEO[i][1]);
    const lift = (o.level - 1) * 7;
    out.push({ i, x: x - 46, y: y - lift - 44, color: '#5A2E6E',

  });
  // 通行料バッジ(衝突回避)
  const occ = st2.owners.map((o, i) => o ? (() => {
    const p = proj(GEO[i][0], GEO[i][1]), lf = (o.level - 1) * 7;
    return { i, x1: p.x-44, x2: p.x+44, y1: p.y-lf-92, y2: p.y-lf+16 };
  })() : null).filter(Boolean);

    occ.some(r => r.i !== self && !(b.x2<r.x1||b.x1>r.x2||b.y2<r.y1||b.y1>r.y2)) ||
    placed.some(r => !(b.x2<r.x1||b.x1>r.x2||b.y2<r.y1||b.y1>r.y2));
  st2.owners.forEach((o, i) => {
    if (!o) return;
    const { x, y } = proj(GEO[i][0], GEO[i][1]);
    const lift = (o.level - 1) * 7;

      const b = { x1:x+dx-32, x2:x+dx+32, y1:y-lift+dy-12, y2:y-lift+dy+12 };
      if (!hitTest(b, i)) { pos = [dx, dy]; break; }

    placed.push({ x1:bx-32, x2:bx+32, y1:by-12, y2:by+12 });
    out.push({ i, x: bx, y: by, color: player(o.player).color,
               text: toll + 'G', icon: false, z: GEO[i][0] + GEO[i][1] + 103 });
  });
  return out;
}

function durabilityHTML(hp, df) {

function finalStatsHTML(b, side, phase = 'post') {

  const name = atkSide ? c.name : cname(cid, b.defLevel || (state.owners[b.tile] ? state.owners[b.tile].level : 1));
  const pre = phase === 'pre';
  const at = atkSide ? (pre ? (b.atkPreAt ?? b.atkBaseAt ?? c.st) : (b.atkPostAt ?? b.st))
    : (pre ? (b.defPreAt ?? b.defBaseAt ?? c.st) : (b.defPostAt ?? b.defSt ?? c.st));
  const hp = atkSide ? (pre ? (b.atkPreHp ?? b.atkHp) : (b.atkPostHp ?? b.atkHp))
    : (pre ? (b.defPreHp ?? b.hp) : (b.defPostHp ?? b.hp));
  const df = atkSide ? (pre ? (b.atkPreDf ?? 0) : (b.atkPostDf ?? b.atkDf ?? 0))
    : (pre ? (b.defPreDf ?? Math.max(0,(b.df||0)-((b.defSupport||{}).hp||0))) : (b.defPostDf ?? b.df ?? 0));
  const mods = atkSide
    ? [`基礎AT ${b.atkBaseAt ?? c.st}`, hasBattleSupport(b.atkSupport) ? `支援 ${battleSupportName(b.atkSupport)}` : '支援なし']
    : [`地形補正 +${b.terrain || 0}`, hasBattleSupport(b.defSupport) ? `支援 ${battleSupportName(b.defSupport)}` : '支援なし', b.curse ? `呪い −${b.curse}` : ''];
  return `<div class="bsOwner">${pl.name}</div><div class="bsCreature">${name}</div>
    <div class="bsValues"><span><small>AT</small><b data-stat="at">${at}</b></span><span><small>HP</small><b data-stat="hp">${hp}</b></span><span><small>DF</small><b data-stat="df">${df}</b></span></div>
    ${durabilityHTML(hp, df)}

function setDurability(statsId, hp, df, max) {
  const root = $(statsId), bar = root && root.querySelector('.durabilityBar');
  if (!bar) return;
  const totalMax = Math.max(1, max == null ? hp + df : max);
  const hpEl = bar.querySelector('.durabilityHp'), dfEl = bar.querySelector('.durabilityDf');
  hpEl.style.width = Math.max(0, hp) / totalMax * 100 + '%';
  dfEl.style.width = Math.max(0, df) / totalMax * 100 + '%';
  hpEl.classList.toggle('low', hp / totalMax <= .25);
  bar.querySelector('.durabilityNum').textContent = `${Math.max(0,hp)+Math.max(0,df)} / ${totalMax}`;
  root.querySelector('.durabilityBreakdown').textContent = `HP ${Math.max(0,hp)} + DF ${Math.max(0,df)}`;
  const hpNum = root.querySelector('[data-stat="hp"]'), dfNum = root.querySelector('[data-stat="df"]');
  if (hpNum) hpNum.textContent = Math.max(0, hp);
  if (dfNum) dfNum.textContent = Math.max(0, df);
}
function animateDurability(statsId, fromHp, fromDf, toHp, toDf, max, ms = 850) {
  const t0 = performance.now();
  return new Promise(resolve => {
    const step = now => {
      const k = Math.min(1, (now - t0) / ms);
      setDurability(statsId, Math.round(fromHp + (toHp-fromHp)*k), Math.round(fromDf + (toDf-fromDf)*k), max);
      if (k < 1) requestAnimationFrame(step); else resolve();
    };
    requestAnimationFrame(step);
  });
}
function countBattleStat(statsId, stat, from, to, ms = 600) {
  const el = $(statsId).querySelector(`[data-stat="${stat}"]`);
  if (!el || from === to) return Promise.resolve();
  const t0 = performance.now();
  return new Promise(resolve => {
    const step = now => {
      const k = Math.min(1, (now-t0)/ms);
      el.textContent = Math.round(from+(to-from)*k);
      if (k < 1) requestAnimationFrame(step); else resolve();
    };
    requestAnimationFrame(step);
  });
}

  document.body.appendChild(stage); await wait(160);
  stage.querySelector('.sflipB').classList.add('open'); await wait(650);
  const preAt = atkSide ? (b.atkPreAt ?? b.atkBaseAt) : (b.defPreAt ?? b.defBaseAt);

  const postDf = atkSide ? (b.atkPostDf ?? b.atkDf ?? 0) : (b.defPostDf ?? b.df ?? 0);
  await Promise.all([countBattleStat(statsId,'at',preAt,postAt), animateDurability(statsId,hp,preDf,hp,postDf,hp+postDf)]);
  stage.style.transition = 'opacity .25s,transform .25s'; stage.style.opacity = '0'; stage.style.transform = `translateX(${atkSide ? '-34vw' : '34vw'}) scale(.45)`;

  $(slotId).querySelector('.sflipB').classList.add('open');

  await revealBattleSupport(b, 'atk');
  $('bcap').textContent = '支援カード ─ 防衛側を公開';
  await revealBattleSupport(b, 'def');
  $('bAtkStats').innerHTML = finalStatsHTML(b, 'atk');
  $('bDefStats').innerHTML = finalStatsHTML(b, 'def');
  await wait(450);
  if (b.notes && b.notes.length)
    $('bnotes').innerHTML = b.notes.map(n => '✦ ' + n).join('<br>');
  $('bcap').textContent = '';
  await wait(900);
  const pop = (sideId, text, heal) => {

    el.className = 'dmgPop' + (heal ? ' heal' : '');

    $(sideId).appendChild(el);
    setTimeout(() => el.remove(), 1200);
  };
  // HPゲージ+カウントダウン(数字だけでは減少量が分かりにくい)
  const animateHp = (barId, numId, from, to, max, ms = 900) => {
    const bar = $(barId);
    const modernNum = $(numId) ? null : $(numId.endsWith('A') ? 'bAtkStats' : 'bDefStats').querySelector('[data-stat="hp"]');
    const num = $(numId) || modernNum;
    const t0 = performance.now();
    const step = now => {
      const k = Math.min(1, (now - t0) / ms);
      const v = Math.round(from + (to - from) * k);
      const pct = Math.max(0, v / max * 100);
      if (bar) {
        bar.style.width = pct + '%';
        bar.style.background = pct > 50 ? 'linear-gradient(90deg,#7FD08A,#4E9E5C)'
          : pct > 25 ? 'linear-gradient(90deg,#E8C55A,#B8901F)' : 'linear-gradient(90deg,#D96A50,#A3402B)';
      }
      if (num) num.textContent = modernNum ? Math.max(0, v) : 'HP ' + Math.max(0, v);
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };
  setDurability('bAtkStats', b.atkHp, b.atkDf || 0, b.atkHp + (b.atkDf || 0));
  setDurability('bDefStats', b.hp, b.df || 0, b.hp + (b.df || 0));
  // 攻撃アニメ1回分(BW/DOMの分岐を共通化 ─ M6)
  const strike = async (side2, elem2, heavy2, opt2) => {
    if (bwOn) {
      await BW.attack(side2, elem2, Object.assign({ heavy: heavy2 }, opt2 || {}));
    } else if (side2 === 'atk') {

      await wait(320);
      battleImpactFx(elem2, 'def', heavy2);

    } else {
      $('bDef').classList.add('lungeR');
      battleTrailFx(elem2, 'atk', heavy2);
      await wait(320);
      battleImpactFx(elem2, 'atk', heavy2);
      $('bflash').classList.add('go'); $('battle').classList.add('shake');
    }
  };
  const strikeEnd = () => {
    $('bflash').classList.remove('go'); $('battle').classList.remove('shake');
    $('bAtk').classList.remove('lungeL'); $('bDef').classList.remove('lungeR');
  };
  const showResult = async (text, preWait) => {
    await wait(preWait);
    // 決着SEのために戦闘曲を弱めるが、音声ストリーム自体は切断しない。
    if (bgmBattle && bgmCur === bgmBattle) bgmBattle.volume = 0.08;

    playSe(seBattleFinish);

  };
  const corrode = (b.notes || []).some(n => n.includes('腐蝕'));   // 【腐蝕】は相手を病的な色へ(M6)
  await (async () => {
    // --- 先制(§8.7): パカワタ防衛時は防衛側が先に1回攻撃(反撃の代わり) ---
    if (b.preempt) {
      $('bcap').textContent = '防衛側の先制攻撃!';
      await strike('def', defElem, b.counterSt >= 60, { cid: b.defCreature, guard: b.counterSt > b.counterDealt });
      pop('bAtk', '−' + b.counterDealt + (b.counterSt > b.counterDealt ? '(DF−' + (b.counterSt - b.counterDealt) + ')' : ''));
      {
        const remDf = Math.max(0, (b.atkDf || 0) - b.counterSt);

      strikeEnd();

        if (bwOn) BW.defeat('atk'); else $('bAtk').classList.add('dead');

      }
      await wait(400);
    }
    // --- 攻撃側の一撃 ---
    $('bcap').textContent = b.hits === 2 ? '攻撃側の連撃!' : '攻撃側の一撃!';
    const atkGuard = (b.hits || 1) * b.st > b.dealt;   // DFが軽減した命中は防御スパーク(M6)
    await strike('atk', atkElem, b.hits === 2 || b.st >= 60, { cid: b.atkCreature, corrode, guard: atkGuard });
    if (b.hits === 2) {
      if (bwOn) await BW.attack('atk', atkElem, { heavy: true, cid: b.atkCreature, guard: atkGuard });
      else {
        await wait(260);
        battleTrailFx(atkElem, 'def', true);
        await wait(260);
        battleImpactFx(atkElem, 'def', true);
      }
    }
    pop('bDef', '−' + b.dealt + (b.st > b.dealt ? '(DF−' + (b.st - b.dealt) + ')' : ''));
    {
      const rawDamage = (b.hits || 1) * b.st;
      const remDf = Math.max(0, (b.df || 0) - rawDamage);
      animateDurability('bDefStats', b.hp, b.df || 0, b.win ? 0 : b.remainHp, b.win ? 0 : remDf, b.hp + (b.df || 0));
    }
    await wait(450);
    strikeEnd();
    if (b.win) {
      if (bwOn) BW.defeat('def'); else $('bDef').classList.add('dead');
      $('bcap').textContent = '';
      return showResult('侵略成功', 600);
    }
    // --- 耐えた ---
    $('bcap').textContent = `耐えた! 残りHP ${b.remainHp}(負傷は引き継ぐ)`;
    await wait(1100);
    if (b.preempt) {
      // 先制は反撃の代わり(§8.7) → 反撃なしでそのまま帰還
      if (bwOn) BW.returnHome('atk');
      pop('bAtk', '帰還(全快)', true);
      $('bcap').textContent = C.CREATURES[b.atkCreature].name + 'は耐えて手札に帰還';
      return showResult('防衛成功', 900);
    }
    $('bcap').textContent = '防衛側の反撃!';
    await strike('def', defElem, b.counterSt >= 60, { cid: b.defCreature, guard: b.counterSt > b.counterDealt });
    pop('bAtk', '−' + b.counterDealt + (b.counterSt > b.counterDealt ? '(DF−' + (b.counterSt - b.counterDealt) + ')' : ''));
    {
      const remDf = Math.max(0, (b.atkDf || 0) - b.counterSt);
      const remHp = b.atkSurvived ? Math.max(0, b.atkHp - b.counterDealt) : 0;
      animateDurability('bAtkStats', b.atkHp, b.atkDf || 0, remHp, remDf, b.atkHp + (b.atkDf || 0));
    }
    await wait(450);
    strikeEnd();
    if (!b.atkSurvived) {
      if (bwOn) BW.defeat('atk'); else $('bAtk').classList.add('dead');
      $('bcap').textContent = '';
    } else {
      if (bwOn) BW.returnHome('atk');
      pop('bAtk', '帰還(全快)', true);
      $('bcap').textContent = C.CREATURES[b.atkCreature].name + 'は耐えて手札に帰還';
    }
    return showResult('防衛成功', 900);
  })();
  $('battle').classList.remove('on');
  $('battleFx').innerHTML = '';

  // 命中余韻(侵略)/反動+残光(防衛)を中央下メッセージと同時に再生する
  if (renderModeActive === 'phaser') {
    const msg = b.win
      ? `<b style="color:#F2D062">侵略成功</b> ─ ${atk.name}が${def.name}の土地を奪取!`
      : `<b style="color:#8FE08A">防衛成功</b> ─ ${def.name}の${cname(b.defCreature, dLv)}が耐え抜いた(残HP${b.remainHp})`;

  } else {

      b.win ? atk.name + 'が' + def.name + 'の土地を奪取!'
            : def.name + 'が耐え抜いた(残HP' + b.remainHp + ')');
  }
  } finally {
    // ハイブリッド戦闘の後始末(§11.4: 一時オブジェクト・Tweenを残さない。stopは冪等)
    try { if (typeof BW !== 'undefined') BW.stop(); } catch (e) {}
    activeBattleKey = null;
    activeBattleAttacker = null;
    battlePlayingKey = null;
    battleOpeningKey = null;
    $('battleCutin').classList.remove('on');
    ['bAtk','bDef'].forEach(id => $(id).classList.remove('winner'));
    restoreBoardBgm(650);
    cutBusy = Math.max(0, cutBusy - 1);
  }
}

function render() {
  if (!state) return;
  const enteringFromSelect = state.phase === 'playing' && prev.phase === 'select';
  if (enteringFromSelect) playGameEntryTransition();
  $('verTag').textContent = 'ver ' + (state.ver || '?') + ' / board 1.02' +
    (renderModeActive === 'phaser' ? '' : ' (DOM描画)');

  $('lobby').classList.toggle('on', state.phase === 'lobby');
  if (state.phase === 'lobby') {
    $('joined').innerHTML = state.players.map(p => `<span>${p.name}${p.isBot ? ' <b>BOT</b>' : ''}</span>`).join('');
    $('startBtn').disabled = state.botMode
      ? state.players.filter(p => !p.isBot).length !== 1
      : state.players.length < 2;
    $('startBtn').textContent = state.botMode ? 'BOT戦のキャラ選択を開始' : 'キャラ選択を開始';
  }
  // キャラ選択
  $('selectOv').classList.toggle('on',
    (state.phase === 'select' || (gameEntryRunning && !gameEntrySelectionGone)) && !duelPlaying);
  if (state.phase === 'select') {
    const C = state.catalog.CHARS;
    const elemJa = { fire:'火属性', water:'水属性', earth:'土属性', wind:'風属性' };
    let conflict = false;
    const revealNow = [];
    const activeReveals = new Set();
    $('selRow').innerHTML = Object.entries(C).map(([cid, c]) => {
      const who = state.players.filter(p => p.charId === cid);
      if (who.length >= 2) conflict = true;
      const locked = c.selectable === false || c.upcoming;
      const chosen = who.some(p => p.confirmed);
      if (chosen && !locked) activeReveals.add(cid);
      const animateReveal = chosen && !locked && !revealedSummoners.has(cid);
      if (animateReveal) revealNow.push(cid);
      const pill = !who.length ? '─'
        : who.length >= 2 ? who.map(p => p.name).join(' / ') + ' が競合中'
        : who[0].name + ' が選択';
      const elemSvg = c.elem && ELEM[c.elem] ? `<svg viewBox="-34 -36 68 72">${ELEM[c.elem]}</svg>` : '';
      const flipped = chosen && !locked && !animateReveal;
      return `<div class="selCard ${chosen ? 'chosen' : ''} ${flipped ? 'flipped' : ''} ${who.length >= 2 ? 'contested' : ''} ${locked ? 'locked' : ''}"
        data-summoner="${cid}"
        style="--panel-color:${c.color}">
        <div class="scFlip">
          <div class="scFace scFront">
            <img class="scBg" src="/assets/cards/bg-${c.elem || 'neutral'}.webp" alt="">
            <div class="scVeil"></div><span class="scElem">${elemSvg}</span>
            <img class="scArt" src="/assets/full_${cid}.png" alt="${c.name}">
            ${locked ? '<div class="scLocked">準備中</div>' : ''}
            <div class="scMeta"><div class="scn">${c.name}</div>
              <div class="sce">${locked ? 'COMING SOON' : `${elemJa[c.elem] || ''} ─ ${c.style || ''}`}</div>
              <div class="scp ${chosen && who.length === 1 ? 'done' : ''}">${locked ? '選択できません' : pill}</div></div>
          </div>
          ${locked ? '' : `<div class="scFace scBack">
            <img class="scStill" src="/assets/summoner-still-${cid}.webp" alt="${c.name} イメージアート">
            <div class="scBackMeta"><strong>${c.name}</strong><span>${pill}</span></div>
          </div>`}
        </div>
      </div>`;
    }).join('');
    [...revealedSummoners].forEach(cid => { if (!activeReveals.has(cid)) revealedSummoners.delete(cid); });
    if (revealNow.length) requestAnimationFrame(() => requestAnimationFrame(() => {
      revealNow.forEach(cid => {
        const card = $('selRow').querySelector(`[data-summoner="${cid}"]`);
        if (card) card.classList.add('flipped');
        revealedSummoners.add(cid);
      });
    }));
    $('selConflict').style.display = conflict ? 'block' : 'none';
    const ready = !!state.selectionReady && !conflict;
    $('selectionStart').classList.toggle('on', ready);
    if (!ready) {
      startGameSubmitting = false;
      $('selectionStartBtn').disabled = false;
      $('selectionStartBtn').textContent = 'ゲーム開始';
      $('selectionStartMsg').textContent = '';
    }
    if (state.duel && state.duel.at !== prev.duelAt) {
      prev.duelAt = state.duel.at;
      playDuel(state.duel);
    }
  } else $('duelOv').classList.remove('on');
  if (state.phase === 'playing' || state.phase === 'ended') {
    // 移動アニメーション(城でドラフト待ちの中断・再開に対応)
    state.players.forEach(p => { if (!(p.id in prevPos)) prevPos[p.id] = p.pos; });
    if (!hopState) {
      const mover = state.players.find(p => prevPos[p.id] !== p.pos);
      if (mover) {
        animBusy = true;
        const from = prevPos[mover.id];
        const mdir = (state.players.find(q => q.id === mover.id) || {}).dir || 1;
        hopState = { id: mover.id, from, to: mover.pos, dir: mdir,
          steps: mdir === 1 ? ((mover.pos - from + 28) % 28 || 28) : ((from - mover.pos + 28) % 28 || 28),
          sN: 0, holding: false,
          castleEv: state.lastDice && state.lastDice.player === mover.id ? state.lastDice.castle : null };
        pawnAnim[mover.id] = from;
        const mine = state.lastDice && state.lastDice.player === mover.id;
        setTimeout(hopStep, mine
          ? (state.lastDice.multi ? GAME_TIMING.moveStartDelayMulti : GAME_TIMING.moveStartDelay)
          : GAME_TIMING.otherStartDelay);
      }
    } else if (hopState.holding) {
      if (hopState.holdUntil && Date.now() < hopState.holdUntil) {
        clearTimeout(hopState.holdTimer);
        hopState.holdTimer = setTimeout(render, hopState.holdUntil - Date.now() + 30);
      } else {
        const pd = state.pending[hopState.id];
        if (!pd || pd.type !== 'draft') {
          hopState.holding = false;
          if (hopState.sN < hopState.steps) setTimeout(hopStep, GAME_TIMING.castleResume);
          else finishHop();
        }
      }
    }
    renderBoard(); renderPawns(); renderHUD();
    // お金の増減フロート + 移動が対になっていれば金貨を飛ばす
    const deltas = [];
    state.players.forEach(p => {
      const g0 = prevGold[p.id];
      if (g0 !== undefined && g0 !== p.gold) {
        spawnGold(p.id, p.gold - g0);
        deltas.push({ id: p.id, d: p.gold - g0 });
      }
      prevGold[p.id] = p.gold;
    });
    if (deltas.length === 2 && deltas[0].d * deltas[1].d < 0) {

      // 鮮度チェック: 手番プレイヤーが既に行動を始めていたらテロップは出さず破棄。
      // 手番開始時のpendingは選択ドロー(pick_draw)→roll の順なので両方を「未行動」扱いにする
      // (rollのみ判定だと、前の演出待ちが無い場合にpick_draw中で破棄されTURN STARTが出ない)
      const tp0 = state.players[queuedTurn];
      const tpd = tp0 && state.pending[tp0.id];
      const fresh = state.turn === queuedTurn && tpd && (tpd.type === 'roll' || tpd.type === 'pick_draw');
      if (fresh && queuedTurn !== firedTurn) {
        firedTurn = queuedTurn;
        showTelop('turn', tp0.name + 'の手番');
        playTurnCutin(tp0);
      }
      queuedTurn = null;
    }
  }
  // ダイス
  if (state.lastDice && state.lastDice.at !== prev.dice) {
    prev.dice = state.lastDice.at;
    if (state.lastDice.multi) showDiceMulti(state.lastDice.multi);
    else showDice3D(state.lastDice.value);
  }
  // 侵略確定直後から戦闘待機画面を同期。支援内容はbattlePreviewに含まれない。
  if (state.battlePreview) {
    renderBattlePreview(state.battlePreview);
  } else if (activeBattleKey && !battlePlayingKey &&
             (!state.lastBattle || state.lastBattle.at === prev.battleAt)) {
    // 侵略キャンセル時は結果演出を待たず盤面へ戻る。
    $('battle').classList.remove('on');
    hideLogo(false);
    try { if (typeof BW !== 'undefined') BW.stop(); } catch (e) {}
    restoreBoardBgm();
    activeBattleKey = null;
    activeBattleAttacker = null;
    battleOpeningKey = null;
    $('battleCutin').classList.remove('on');
  }
  // 戦闘結果
  if (state.lastBattle && state.lastBattle.at !== prev.battleAt) {
    prev.battleAt = state.lastBattle.at;
    playBattle(state.lastBattle);
  }
  // 勝利演出(発注書v0.75 §9 ─ M7): 全景→勝者領地の盤面順発光→光の収束→城ズーム→光柱→カットイン
  if (state.phase === 'ended' && state.winner) {
    if (prev.winPlayed !== state.winner) {
      prev.winPlayed = state.winner;
      const w = player(state.winner);
      const castle = state.tiles.findIndex(t2 => t2.t === 'castle');
      const lands = [];
      state.owners.forEach((o2, i2) => { if (o2 && o2.player === state.winner) lands.push(i2); });
      const showWin = () => {
        const titles2 = [state.titles.conqueror === state.winner ? '覇者' : null,
                         state.titles.pilgrim === state.winner ? '大巡礼者' : null].filter(Boolean);
        $('winArt').src = '/assets/full_' + w.charId + '.png';
        $('winText').textContent = `${w.name}(${state.catalog.CHARS[w.charId].name}) ─ 総資産${w.points}G / 領地${lands.length}つ` +
          (titles2.length ? ` / 称号「${titles2.join('」「')}」` : '') + 'で勝利!';
        $('winOv').classList.add('on');
      };
      if (renderModeActive === 'phaser') {
        queueFx(1, () => {   // 勝利は最優先(§2.2)。城到着演出の完了はキュー側(animBusy/cutBusy)が保証
          bannerUntil = Math.max(bannerUntil, Date.now() + 5200);
          (async () => {
            await PW.play({ type: 'victory-glow', tiles: lands, castle, color: w.color, timeoutMs: 7000 });
            tileCloseup(castle, `${w.name}の勝利!`, 3200);    // §9.2-6 城へクローズアップ
            await PW.play({ type: 'victory-castle', castle, timeoutMs: 6000 });
            showWin();                                        // §9.2-8〜10 カットイン+最終結果(自動では消さない)
          })();
        });
      } else {
        queueFx(1, () => showWin());   // DOM描画時は既存勝利画面へフォールバック(§9.5)
      }
    }
  } else { $('winOv').classList.remove('on'); prev.winPlayed = null; }
}
fitWorld(); addEventListener('resize', fitWorld);
['redani','linnei','grease','mio','lia','adel'].forEach(c => { new Image().src = '/assets/full_' + c + '.png'; });
</script>
</body>
</html>
