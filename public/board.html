<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reggae+One&display=swap" rel="stylesheet">
<title>Summons Crest — 盤面</title>
<style>
  :root { --ink:#141227; --ink2:#1E1B3C; --gold:#C9A227; --gold-soft:#EFD98F; --parchment:#F1E8D0; }
  * { box-sizing:border-box; margin:0; }
  body { background:url('/assets/bg.jpg') center / cover no-repeat fixed, #1E1B3C;
         min-height:100vh; overflow:hidden; font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
         color:var(--parchment); }
  #world { position:fixed; left:50%; top:0; width:1280px; height:905px; transform-origin:top center;
      transition:transform .85s cubic-bezier(.25,.85,.3,1); }
  #stage { position:absolute; inset:0; }
  .sprite { position:absolute; transform:translate(-50%,-100%); pointer-events:none; }
  .shadow { position:absolute; transform:translate(-50%,-50%); width:64px; height:20px;
            background:radial-gradient(ellipse, rgba(0,0,0,.45), transparent 70%); border-radius:50%; }
  .pawnEl { transition:left .5s ease, top .5s ease; }
  .tok { width:64px; height:64px; border-radius:50%; border:3px solid #2C2A4A; color:#F6EFDD;
         display:flex; align-items:center; justify-content:center; font-size:20px; letter-spacing:1px;
         text-shadow:0 1px 2px rgba(0,0,0,.6); box-shadow:0 3px 6px rgba(0,0,0,.4); }
  #logoImg { transition:opacity .3s; position:fixed; top:10px; left:50%; transform:translateX(-50%); height:56px; z-index:20;
         filter:drop-shadow(0 3px 6px rgba(30,27,60,.55)); }
  .toll { position:absolute; transform:translate(-50%,-50%) skewX(-6deg); padding:1px 11px 2px;
          font:700 13px sans-serif; color:#fff; border-radius:3px; border:1px solid rgba(255,255,255,.5);
          box-shadow:0 2px 5px rgba(0,0,0,.5); text-shadow:0 1px 2px rgba(0,0,0,.45); }

  /* HUD */
  #hud { position:fixed; top:14px; left:14px; width:236px; z-index:30; }
  .plate { position:absolute; left:0; width:236px; height:66px;
           background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22236%22%20height%3D%2266%22%3E%3Cdefs%3E%3Cfilter%20id%3D%22e%22%20x%3D%22-6%25%22%20y%3D%22-14%25%22%20width%3D%22112%25%22%20height%3D%22128%25%22%3E%3CfeTurbulence%20type%3D%22fractalNoise%22%20baseFrequency%3D%220.035%200.1%22%20numOctaves%3D%224%22%20seed%3D%227%22%20result%3D%22t%22%2F%3E%3CfeDisplacementMap%20in%3D%22SourceGraphic%22%20in2%3D%22t%22%20scale%3D%227%22%2F%3E%3C%2Ffilter%3E%3Cfilter%20id%3D%22g%22%3E%3CfeTurbulence%20type%3D%22fractalNoise%22%20baseFrequency%3D%220.8%22%20numOctaves%3D%222%22%20seed%3D%224%22%20result%3D%22n%22%2F%3E%3CfeColorMatrix%20in%3D%22n%22%20values%3D%220%200%200%200%200.32%200%200%200%200%200.25%200%200%200%200%200.13%200%200%200%200.35%200%22%20result%3D%22c%22%2F%3E%3CfeComposite%20in%3D%22c%22%20operator%3D%22in%22%20in2%3D%22SourceAlpha%22%2F%3E%3C%2Ffilter%3E%3CradialGradient%20id%3D%22v%22%20cx%3D%2250%25%22%20cy%3D%2245%25%22%20r%3D%2275%25%22%3E%3Cstop%20offset%3D%2255%25%22%20stop-color%3D%22%235A3B14%22%20stop-opacity%3D%220%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%235A3B14%22%20stop-opacity%3D%220.38%22%2F%3E%3C%2FradialGradient%3E%3C%2Fdefs%3E%3Cg%20filter%3D%22url%28%23e%29%22%3E%3Crect%20x%3D%225%22%20y%3D%224%22%20width%3D%22226%22%20height%3D%2258%22%20rx%3D%222%22%20fill%3D%22%23E8DAB4%22%2F%3E%3Crect%20x%3D%225%22%20y%3D%224%22%20width%3D%22226%22%20height%3D%2258%22%20rx%3D%222%22%20fill%3D%22%23000%22%20filter%3D%22url%28%23g%29%22%2F%3E%3Crect%20x%3D%225%22%20y%3D%224%22%20width%3D%22226%22%20height%3D%2258%22%20rx%3D%222%22%20fill%3D%22url%28%23v%29%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") no-repeat center / 100% 100%;
           padding:10px 14px 10px 16px; color:#3A2B18;
           transition:top .55s cubic-bezier(.22,1,.36,1), filter .3s; }
  .plate.turn { filter:drop-shadow(0 0 7px rgba(201,162,39,.85)); }
  .plate .face { position:absolute; left:-12px; top:11px; width:42px; height:42px; border-radius:9px;
           object-fit:contain; object-position:center;
           filter:drop-shadow(0 2px 5px rgba(0,0,0,.45)); background:transparent; }
  .plate .row1 { display:flex; align-items:center; gap:7px; margin-left:28px; }
  .rankBadge { width:22px; height:22px; border-radius:50%; flex:none; display:flex; align-items:center;
           justify-content:center; font-size:12px; font-weight:700; font-family:serif;
           background:#8B8570; color:#F2EAD4; box-shadow:inset 0 -2px 3px rgba(0,0,0,.35); }
  .rank1 { background:#B8901F; color:#2A1F08; } .rank2 { background:#9CA1AC; color:#23262C; }
  .rank3 { background:#9A6832; color:#241505; }
  .plate .pname { font-size:13.5px; letter-spacing:1px; flex:1; white-space:nowrap; overflow:hidden; }
  .plate .pts { font-size:22px; color:#7A4E00; line-height:1; font-weight:800; white-space:nowrap;
           text-shadow:0 0 6px rgba(242,208,98,.55); }
  .plate .pts small { font-size:11px; color:#7D6844; font-weight:400; }
  .plate .row2 { display:flex; gap:9px; margin:3px 0 0 58px; font-size:11px; color:#5C4A2E; }
  .sealIc { color:rgba(241,232,208,.28); border:1px solid rgba(241,232,208,.22); border-radius:4px;
      padding:0 4px; font-size:11px; font-family:'Reggae One','Yu Mincho',serif; }
  .sealIc.has { color:#F2D062; border-color:#C9A227; text-shadow:0 0 8px rgba(242,208,98,.7);
      background:rgba(201,162,39,.15); }
  .reach { margin-left:auto; font-size:10px; color:#9E2B25; border:1px solid #9E2B25; border-radius:3px;
           padding:0 4px; letter-spacing:1px; animation:blink 1.1s infinite; }
  @keyframes blink { 50% { opacity:.3; } }
  .pbar { position:absolute; left:14px; bottom:8px; height:3px; max-width:calc(100% - 30px);
          background:#8A6A1E; opacity:.85; border-radius:2px; transition:width .5s; }

  /* テロップ・ダイス */
  #telop { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
           justify-content:center; pointer-events:none; z-index:60; }
  #telopImg { width:min(52vw,700px); opacity:0; }
  #telopImg.play { animation:telop 2.2s ease forwards; }
  #telopSub { font-size:24px; letter-spacing:6px; color:var(--gold-soft); opacity:0;
              text-shadow:0 2px 8px rgba(0,0,0,.8);  font-family:'Reggae One','Yu Mincho',serif; }
  #telopSub.play { animation:telop 2.2s ease forwards; }
  @keyframes telop { 0%{opacity:0;transform:scale(1.55);filter:blur(6px)}
    18%{opacity:1;transform:scale(1);filter:blur(0)} 78%{opacity:1} 100%{opacity:0;transform:scale(.94)} }
  #diceFloat { position:fixed; right:26px; bottom:24px; width:92px; height:92px; border-radius:16px;
           background:var(--parchment); color:var(--ink); border:3px solid var(--gold); z-index:40;
           display:flex; align-items:center; justify-content:center; font-size:50px; font-weight:700;
           opacity:0; transition:opacity .3s; }
  #diceFloat.show { opacity:1; }

  /* ロビー・選択・勝利オーバーレイ */
  .overlay { position:fixed; inset:0; background:rgba(16,13,36,.94); z-index:80; display:none;
           flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; }
  .overlay.on { display:flex; }
  .bigcode { font-size:70px; letter-spacing:20px; color:var(--gold-soft); border:2px solid var(--gold);
           border-radius:14px; padding:8px 22px 8px 42px; }
  .hint { font-size:15px; color:rgba(241,232,208,.8); line-height:2; }
  .joined { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; min-height:38px; }
  .joined span { border:1px solid var(--gold); border-radius:999px; padding:5px 16px; font-size:14px; }
  .gbtn { font-family:inherit; font-size:17px; letter-spacing:3px;
           background:linear-gradient(180deg,#E8C55A,#B8901F); color:#241C05;
           border:2px solid #F2D062; border-radius:11px; padding:12px 36px; cursor:pointer; }
  .gbtn:disabled { filter:grayscale(.7) brightness(.55); }
  .selRow { display:flex; gap:14px; }
  .selCard { border:1px solid var(--gold); border-radius:10px; padding:12px 18px; min-width:170px;
           background:rgba(0,0,0,.35); font-size:14px; line-height:2; }
  #winArt { height:56vh; filter:drop-shadow(0 0 40px rgba(242,208,98,.5)); }
  .goldText { font-size:64px; letter-spacing:14px; font-weight:700;
           background:linear-gradient(180deg,#FFE9A0 8%,#E8C55A 35%,#8A6A1E 62%,#F2D062 88%);
           -webkit-background-clip:text; background-clip:text; color:transparent;
           filter:drop-shadow(0 3px 0 #4A3608) drop-shadow(0 0 26px rgba(242,208,98,.6)); }

  /* 戦闘オーバーレイ */
  #battle { position:fixed; inset:0; background:rgba(10,8,25,.86); z-index:70; display:none;
           align-items:center; justify-content:center; }
  #battle.on { display:flex; }
  #battle.shake { animation:shake .4s; }
  @keyframes shake { 0%,100%{transform:none} 25%{transform:translate(12px,-7px)}
    50%{transform:translate(-10px,8px)} 75%{transform:translate(7px,4px)} }
  .bside { width:340px; text-align:center; transition:transform .35s ease-in; }
  .bside img, .bside .tok { height:240px; width:auto !important; margin:0 auto; filter:drop-shadow(0 8px 12px rgba(0,0,0,.6)); }
  .bside .tok { width:150px; height:150px; font-size:26px; }
  .bside .bname { font-size:19px; letter-spacing:2px; margin-top:8px; }
  .bside .bnum { font-size:38px; color:var(--gold-soft); font-family:sans-serif; }
  .bside .bsub { font-size:13px; color:rgba(241,232,208,.75); }
  .bside.lungeL { transform:translateX(90px); } .bside.lungeR { transform:translateX(-90px); }
  .bside.dead { animation:dead .7s forwards; }
  @keyframes dead { to { opacity:0; transform:translateY(50px) rotate(-12deg); filter:brightness(3); } }
  #bmid { width:230px; text-align:center; }
  #bankruptCut { position:fixed; inset:0; z-index:88; display:none; align-items:center; justify-content:center;
      background:rgba(8,4,10,.82); }
  #bankruptCut.on { display:flex; animation:bkIn .4s ease; }
  #bankruptCut .bkTxt { font-family:'Reggae One','Yu Mincho',serif; font-size:24vh; letter-spacing:4vw;
      color:#E23A2E; text-shadow:0 0 40px rgba(226,58,46,.7), 0 6px 24px rgba(0,0,0,.9);
      transform:rotate(-6deg); animation:bkStamp .5s cubic-bezier(.2,1.6,.4,1) both; }
  #bankruptCut .bkSub { position:absolute; bottom:16vh; font-size:4vh; color:var(--parchment);
      font-family:'Reggae One','Yu Mincho',serif; letter-spacing:1vw; }
  @keyframes bkIn { from { opacity:0; } }
  @keyframes bkStamp { 0% { transform:rotate(-6deg) scale(3); opacity:0; }
      60% { transform:rotate(-6deg) scale(.95); opacity:1; } 100% { transform:rotate(-6deg) scale(1); } }
  .dmgPop { position:absolute; top:26%; left:50%; transform:translateX(-50%); z-index:5;
      font-size:5.6vh; font-family:'Reggae One','Yu Mincho',serif; color:#FF6A4D;
      text-shadow:0 2px 8px rgba(0,0,0,.9), 0 0 18px rgba(255,90,60,.5); pointer-events:none;
      animation:dmgPop 1.1s ease forwards; }
  .dmgPop.heal { color:#8FE08A; text-shadow:0 2px 8px rgba(0,0,0,.9), 0 0 18px rgba(90,220,120,.5); }
  @keyframes dmgPop { 0% { opacity:0; transform:translate(-50%,1.5vh) scale(1.4); }
      18% { opacity:1; transform:translate(-50%,0) scale(1); }
      80% { opacity:1; } 100% { opacity:0; transform:translate(-50%,-4vh); } }
  #bresult { position:absolute; top:6vh; left:0; right:0; text-align:center; font-size:6vh;
      letter-spacing:1.2vh; color:var(--gold-soft); font-family:serif; opacity:0; pointer-events:none;
      text-shadow:0 2px 14px rgba(0,0,0,.95), 0 0 30px rgba(201,162,39,.5);  font-family:'Reggae One','Yu Mincho',serif; }
  #bresult.show { animation:bres .55s cubic-bezier(.2,.9,.3,1) forwards; }
  @keyframes bres { from { opacity:0; transform:scale(1.5); } to { opacity:1; transform:none; } }
  #bcap { font-size:22px; letter-spacing:4px; color:var(--gold-soft); min-height:2em;  font-family:'Reggae One','Yu Mincho',serif; }
  .scardB { display:inline-block; width:74px; height:104px; margin:10px 8px; perspective:400px; }
  .sflipB { position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .5s; }
  .sflipB.open { transform:rotateY(180deg); }
  .sfaceB { position:absolute; inset:0; border-radius:8px; backface-visibility:hidden;
           display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:13px;
           background:url('/assets/card_bg.jpg') center / cover; color:#3A2B18; }
  .sbackB { background:linear-gradient(160deg,#2C2A4A,#1E1B3C); border:2px solid var(--gold);
           color:var(--gold); font-size:28px; }
  .sfrontB { transform:rotateY(180deg); background:url('/assets/card_bg.jpg') center / cover;
           border:2px solid #2C2A4A; color:#3A2B18; gap:4px; }
  #bflash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:75; }
  #bflash.go { animation:bflash .45s; }
  @keyframes bflash { 15% { opacity:.95; } 100% { opacity:0; } }

  /* ショップ */
  #shopOv { position:fixed; inset:0; display:none; z-index:65;
      background:url('/assets/shop_bg.jpg') center / cover; }
  #shopOv.on { display:block; animation:shopIn .5s ease both; }
  @keyframes shopIn { from { opacity:0; } }
  #shopOv.on #shopKeeper { animation:keeperIn .6s .1s cubic-bezier(.2,.85,.3,1) both; }
  @keyframes keeperIn { from { transform:translateY(10vh); opacity:0; } }
  #shopOv.on #shopBubble { animation:bubIn .4s .45s ease both; }
  #shopOv.on #shopWho { animation:bubIn .4s .45s ease both; }
  @keyframes bubIn { from { opacity:0; transform:scale(.75); } }
  #shopKeeper { position:absolute; left:4vw; bottom:0; height:74vh;
      filter:drop-shadow(0 0 30px rgba(0,0,0,.6)); }
  #shopBubble { position:absolute; left:26vw; top:12vh; background:var(--parchment); color:#3A2B18;
      font-size:3vh; letter-spacing:3px; padding:2vh 4vh; border-radius:2vh;
      border:2px solid #8A6A1E; box-shadow:0 4px 14px rgba(0,0,0,.5); }
  #shopBubble::after { content:""; position:absolute; left:-16px; top:55%; border:12px solid transparent;
      border-right-color:var(--parchment); }
  #shopWho { position:absolute; right:3vw; top:4vh; font-size:2.6vh; letter-spacing:3px;
      color:var(--gold-soft); background:rgba(0,0,0,.5); border:1px solid var(--gold);
      border-radius:999px; padding:1vh 3vh; }
  #shopAction { position:absolute; left:50%; bottom:7vh; transform:translateX(-50%);
      font-size:3vh; letter-spacing:3px; color:var(--gold-soft);
      text-shadow:0 2px 8px rgba(0,0,0,.9); background:rgba(16,13,36,.65);
      border-radius:1vh; padding:1.2vh 3vh; max-width:80vw; }
  /* 召喚カットイン */
  #summonCut { position:fixed; inset:0; display:none; z-index:66; align-items:center;
      justify-content:center; gap:5vw; background:rgba(10,8,25,.72); }
  #summonCut.on { display:flex; }
  #summonCut img.pl { height:64vh; filter:drop-shadow(0 0 30px rgba(0,0,0,.7)); }
  #scCreature img { height:36vh !important; width:auto !important; }
  #scText { position:absolute; bottom:10vh; width:100%; text-align:center; font-size:4vh;
      letter-spacing:6px; color:var(--gold-soft); text-shadow:0 2px 10px rgba(0,0,0,.9); }
  @keyframes vpop { from { transform:scale(1.7); opacity:0; } to { transform:scale(1); opacity:1; } }
  #vicImg { width:min(46vw, 620px); animation:vpop .55s ease; }

  #diceOv { position:fixed; left:50%; top:44%; transform:translate(-50%,-50%);
      z-index:55; pointer-events:none; display:none; }
  #diceOv.on { display:block; }
  .dStage { position:relative; width:15vh; height:18vh; perspective:700px;
      animation:dbounce 1.4s cubic-bezier(.3,.6,.4,1); }
  @keyframes dbounce { 0%{transform:translateY(-15vh)} 52%{transform:translateY(0)}
    68%{transform:translateY(-4vh)} 80%{transform:translateY(0)} 89%{transform:translateY(-1.4vh)} 100%{transform:translateY(0)} }
  .dCube { position:absolute; left:50%; top:42%; width:11vh; height:11vh; margin:-5.5vh 0 0 -5.5vh;
      transform-style:preserve-3d; }
  .dF { position:absolute; inset:0; background:linear-gradient(160deg,#F5EDD8,#DCCFA8);
      border:2px solid var(--gold); border-radius:1.6vh; backface-visibility:hidden;
      display:flex; align-items:center; justify-content:center;
      box-shadow:inset 0 0 1.4vh rgba(90,59,20,.25); }
  .dF svg { width:74%; height:74%; }
  .dF1{transform:translateZ(5.5vh)} .dF2{transform:rotateX(90deg) translateZ(5.5vh)}
  .dF3{transform:rotateY(90deg) translateZ(5.5vh)} .dF4{transform:rotateY(-90deg) translateZ(5.5vh)}
  .dF5{transform:rotateX(-90deg) translateZ(5.5vh)} .dF6{transform:rotateY(180deg) translateZ(5.5vh)}
  .gfloat { position:fixed; z-index:90; font:700 15px sans-serif; pointer-events:none;
      text-shadow:0 1px 3px rgba(0,0,0,.7); animation:grise 1.5s ease forwards; }
  @keyframes grise { from { opacity:0; transform:translateY(6px); }
    25% { opacity:1; } to { opacity:0; transform:translateY(-26px); } }

  .selCard { width:230px; border-radius:12px; border:2px solid rgba(201,162,39,.55);
      padding:12px 10px 14px; text-align:center; position:relative;
      background:linear-gradient(170deg, var(--cbg1), var(--cbg2)); }
  .selCard img { height:44vh; max-width:100%; object-fit:contain;
      filter:drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
  .selCard .scn { font-size:21px; letter-spacing:3px; margin-top:8px;
      text-shadow:0 2px 6px rgba(0,0,0,.7); }
  .selCard .sce { font-size:12px; color:rgba(241,232,208,.8); letter-spacing:2px; }
  .selCard .scp { margin-top:8px; border-radius:999px; padding:3px 16px; font-size:12.5px;
      letter-spacing:2px; border:1px solid rgba(255,255,255,.5); background:rgba(0,0,0,.4);
      display:inline-block; min-height:1.5em; }
  .selCard .scp.done { border-color:var(--gold); color:var(--gold-soft); }
  .selCard.contested { border-color:#E86A5A; box-shadow:0 0 14px rgba(232,106,90,.5); }
  .duelist2 { display:flex; flex-direction:column; align-items:center; gap:10px; font-size:16px; }
  .die2 { width:80px; height:80px; border-radius:13px; background:var(--parchment); color:var(--ink);
      font-size:44px; font-weight:700; display:flex; align-items:center; justify-content:center;
      border:3px solid var(--gold); }
  .duelist2.win .die2 { box-shadow:0 0 24px rgba(242,208,98,.85); }

  /* 戦闘HPゲージ */
  .hpBarWrap { position:relative; width:76%; height:2.8vh; margin:.8vh auto 0; background:rgba(0,0,0,.55);
      border:1px solid var(--gold); border-radius:1.5vh; overflow:hidden; }
  .hpBar { height:100%; width:100%; background:linear-gradient(90deg,#7FD08A,#4E9E5C); }
  .hpNum { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      font-size:2vh; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.9); font-family:sans-serif;
      font-variant-numeric:tabular-nums; letter-spacing:1px; }
  /* マス変化のクローズアップ用メッセージ(中央下 ─ ズームしたマスと被らない位置) */
  #tileMsg { position:fixed; left:50%; bottom:5vh; transform:translateX(-50%); z-index:59;
      background:rgba(16,13,36,.9); border:1px solid var(--gold); border-radius:1.2vh;
      padding:1.4vh 3.6vh; font-size:2.8vh; letter-spacing:2px; color:var(--parchment);
      text-align:center; text-shadow:0 2px 8px rgba(0,0,0,.8); max-width:76vw; line-height:1.5;
      opacity:0; pointer-events:none; transition:opacity .25s; font-family:'Reggae One','Yu Mincho',serif; }
  #tileMsg.show { opacity:1; }
  #centerBanner { position:fixed; left:50%; top:40%; transform:translate(-50%,-50%);
      z-index:58; font-size:4.4vh; letter-spacing:5px; color:var(--gold-soft); text-align:center;
      text-shadow:0 2px 12px rgba(0,0,0,.9); background:rgba(16,13,36,.72);

<script id="qrlib">
// 依存なしのQRコード生成(Version 3, 誤り訂正L, マスク0固定 / byteモード最大53文字)
const QR = (() => {
  const EXP = [1], LOG = [];
  for (let i = 1; i < 512; i++) { let v = EXP[i-1] << 1; if (v >= 256) v ^= 0x11D; EXP[i] = v; }
  for (let i = 0; i < 255; i++) LOG[EXP[i]] = i;
  const mul = (a, b) => (a && b) ? EXP[(LOG[a] + LOG[b]) % 255] : 0;

  function eccOf(data, ecLen) {
    let gen = [1];
    for (let i = 0; i < ecLen; i++) {
      const next = new Array(gen.length + 1).fill(0);
      for (let j = 0; j < gen.length; j++) {
        next[j] ^= mul(gen[j], EXP[i]);
        next[j + 1] ^= gen[j];
      }
      gen = next;
    }
    gen.reverse();                    // 先頭が最高次(=1)
    const res = new Array(ecLen).fill(0);
    for (const d of data) {
      const f = d ^ res[0];
      res.shift(); res.push(0);
      if (f) for (let k = 0; k < ecLen; k++) res[k] ^= mul(gen[k + 1], f);
    }
    return res;
  }

  function encode(text) {
    const bytes = new TextEncoder().encode(text);
    const DATA_CW = 55, EC_CW = 15, SIZE = 29;   // Version 3-L
    if (bytes.length > 53) return null;
    const bits = [];
    const push = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >> i) & 1); };
    push(4, 4); push(bytes.length, 8);
    for (const b of bytes) push(b, 8);
    push(0, Math.min(4, DATA_CW * 8 - bits.length));
    while (bits.length % 8) bits.push(0);
    const data = [];
    for (let i = 0; i < bits.length; i += 8)
      data.push(bits.slice(i, i + 8).reduce((a, b) => a * 2 + b, 0));
    const PAD = [0xEC, 0x11];
    while (data.length < DATA_CW) data.push(PAD[data.length % 2]);
    const cw = data.concat(eccOf(data, EC_CW));

    const M = Array.from({ length: SIZE }, () => new Array(SIZE).fill(false));
    const F = Array.from({ length: SIZE }, () => new Array(SIZE).fill(false));
    const set = (r, c, v) => { M[r][c] = v; F[r][c] = true; };
    const finder = (r0, c0) => {
      for (let r = -1; r <= 7; r++) for (let c = -1; c <= 7; c++) {
        const rr = r0 + r, cc = c0 + c;
        if (rr < 0 || cc < 0 || rr >= SIZE || cc >= SIZE) continue;
        const on = (0 <= r && r <= 6 && 0 <= c && c <= 6) &&
                   !((1 <= r && r <= 5 && (c === 1 || c === 5)) || ((r === 1 || r === 5) && 1 <= c && c <= 5));
        set(rr, cc, on);
      }
    };
    finder(0, 0); finder(0, SIZE - 7); finder(SIZE - 7, 0);
    for (let i = 8; i < SIZE - 8; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    for (let r = -2; r <= 2; r++) for (let c = -2; c <= 2; c++)   // 位置合わせ(22,22)
      set(22 + r, 22 + c, Math.max(Math.abs(r), Math.abs(c)) !== 1);
    const FMT = '111011111000100';                                 // L・マスク0の形式情報
    const fbit = i => FMT[14 - i] === '1';
    for (let i = 0; i <= 5; i++) set(i, 8, fbit(i));
    set(7, 8, fbit(6)); set(8, 8, fbit(7)); set(8, 7, fbit(8));
    for (let i = 9; i <= 14; i++) set(8, 14 - i, fbit(i));
    for (let i = 0; i <= 7; i++) set(8, SIZE - 1 - i, fbit(i));
    for (let i = 8; i <= 14; i++) set(SIZE - 15 + i, 8, fbit(i));
    set(SIZE - 8, 8, true);                                        // 暗モジュール

    let bi = 0;
    const total = cw.length * 8;
    const bitAt = i => (cw[i >> 3] >> (7 - (i & 7))) & 1;
    for (let right = SIZE - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let v = 0; v < SIZE; v++) {
        for (let j = 0; j < 2; j++) {
          const c = right - j;
          const up = ((right + 1) & 2) === 0;
          const r = up ? SIZE - 1 - v : v;
          if (F[r][c] || bi >= total) continue;
          M[r][c] = (bitAt(bi++) === 1) !== (((r + c) % 2) === 0);  // マスク0
        }
      }
    }
    return { size: SIZE, matrix: M, codewords: cw };
  }

  function svg(text, scale = 5) {
    const q = encode(text);
    if (!q) return '<div style="font-size:12px">URLが長すぎます</div>';
    const m = 4 * scale, px = q.size * scale + m * 2;
    let rects = '';
    for (let r = 0; r < q.size; r++) for (let c = 0; c < q.size; c++)
      if (q.matrix[r][c]) rects += `<rect x="${m + c * scale}" y="${m + r * scale}" width="${scale}" height="${scale}"/>`;
    return `<svg width="${px}" height="${px}" viewBox="0 0 ${px} ${px}"
      style="background:#fff;border-radius:10px"><g fill="#141227">${rects}</g></svg>`;
  }
  return { encode, svg };
})();

    const bottomEdge = s => `M${P[6][0].toFixed(1)} ${(P[6][1]+s).toFixed(1)} L${P[5][0].toFixed(1)} ${(P[5][1]+s).toFixed(1)} L${P[4][0].toFixed(1)} ${(P[4][1]+s).toFixed(1)} L${P[3][0].toFixed(1)} ${(P[3][1]+s).toFixed(1)} L${P[2][0].toFixed(1)} ${(P[2][1]+s).toFixed(1)}`;
    const seams = [7, 14].filter(s => s < rise + 1).map(s =>
      `<path d="${bottomEdge(s)}" fill="none" stroke="#1E1B23" stroke-width="1"/>`).join('');
    const topFill = ['#4A4750','#444049','#4F4B54'][i % 3];
    const rune = t.t === 'land'
      ? `<g transform="translate(${DW/2} ${DH/2+1}) scale(1,0.55)">
           <g transform="translate(1.2,2.4)" opacity=".45">${ELEM_DARK[t.e]}</g>
           <g opacity="${o ? .95 : .62}" style="filter:drop-shadow(0 0 4px ${RUNE[t.e]})">${ELEM[t.e]}</g></g>`
      : '';
    const barrier = o && state.barrier && state.barrier[o.player];
    const own = o ? `
      ${barrier ? `<path d="M${DW/2} -1 L${DW-2} ${DH/2} L${DW/2} ${DH+1} L2 ${DH/2} Z" fill="none"

      <path d="${topPath}" fill="${ownColor}" opacity="${.05 + o.level * .03}"/>
      ${Array.from({length: o.level}, (_, k) => {
        const s = (t.gx === undefined ? GEO[i][0] : 0), gx = GEO[i][0];
        const sg = (gx === 0 || gx === 7) ? 1 : -1;
        const u = 12 + k * 10, px = DW/2 + sg*u, py = DH - u*(DH/DW) + THK/2;
        return `<circle cx="${px}" cy="${py}" r="2.6" fill="${ownColor}" stroke="#14121F" stroke-width=".6"

      <path d="M${pt(4)} L${pt(3)} L${pt(2)} L${dn(2)} L${dn(3)} L${dn(4)} Z" fill="url(#pat${i})"/>

      <path d="${topPath}" fill="none" stroke="#1E1B23" stroke-width="1"/>
      <path d="M${pt(6)} L${pt(7)} L${pt(0)} L${pt(1)} L${pt(2)}" fill="none" stroke="rgba(246,239,221,.2)" stroke-width="1.5"/>
      ${rune}${own}
    </svg>`;
    st.appendChild(el);
  }
  // 特殊マスの建造物
  const STRUCTS = { castle: ['struct_castle', 116], shrine: ['struct_shrine', 78], market: ['struct_market', 100], gate: ['struct_gate', 94] };
  state.tiles.forEach((t, i) => {
    const sc = STRUCTS[t.t];
    if (!sc) return;
    const { x, y } = proj(GEO[i][0], GEO[i][1]);
    const sh = document.createElement('div');
    sh.className = 'shadow';
    sh.style.left = x + 'px'; sh.style.top = y + 'px';
    sh.style.width = (sc[1] * 0.8) + 'px';

    const el = document.createElement('div');
    el.className = 'sprite';
    el.style.left = x + 'px'; el.style.top = (y + 8) + 'px';

  // クリーチャー
  for (let i = 0; i < 28; i++) {
    const o = state.owners[i];
    if (!o) continue;
    const { x, y } = proj(GEO[i][0], GEO[i][1]);
    const lift = (o.level - 1) * 7;
    const sh = document.createElement('div');
    sh.className = 'shadow';
    sh.style.left = x + 'px'; sh.style.top = (y - lift) + 'px';

    el.className = 'sprite';
    el.style.left = x + 'px'; el.style.top = (y - lift + 6) + 'px';

    el.innerHTML = artHTML(o.creature, o.level, 80);

      cu.className = 'toll';
      cu.style.left = (x - 46) + 'px'; cu.style.top = (y - lift - 44) + 'px';
      cu.style.background = '#5A2E6E';
      cu.style.zIndex = GEO[i][0] + GEO[i][1] + 104;
      cu.innerHTML = '<img src="/assets/ic_curse.png" style="height:13px;vertical-align:-2px"> HP-' + state.curses[i].hp;
      st.appendChild(cu);

  // 通行料バッジ(衝突回避)
  const occ = state.owners.map((o, i) => o ? (() => {
    const p = proj(GEO[i][0], GEO[i][1]), lf = (o.level - 1) * 7;

  const placed = [];
  const hitTest = (b, self) =>

  state.owners.forEach((o, i) => {
    if (!o) return;

    }
    const bx = x + pos[0], by = y - lift + pos[1];
    placed.push({ x1:bx-32, x2:bx+32, y1:by-12, y2:by+12 });

    b.style.zIndex = GEO[i][0] + GEO[i][1] + 103;

async function playBattle(b) {

    <div class="bnum">AT ${b.st}${b.atkDf ? ' <span style="font-size:2.4vh;opacity:.85">/ DF ' + b.atkDf + '</span>' : ''}</div>
    <div class="hpBarWrap"><div class="hpBar" id="hpBarA"></div><div class="hpNum" id="hpNumA">HP ${b.atkHp}</div></div>
    <div class="bsub">${b.atkSupport !== 'none' ? '+ ' + C.SUPPORTS[b.atkSupport].name : '&nbsp;'}</div>
    <div class="bhpA" style="position:relative"></div>`;
  $('bDef').innerHTML = `${artHTML(b.defCreature, dLv, 220)}

    <div class="bnum">AT ${C.CREATURES[b.defCreature].st} <span style="font-size:2.4vh;opacity:.85">/ DF ${b.df}</span></div>
    <div class="hpBarWrap"><div class="hpBar" id="hpBarD"></div><div class="hpNum" id="hpNumD">HP ${b.hp}</div></div>
    <div class="bsub">DF内訳: 地形${b.terrain}${b.defSupport !== 'none' ? ' + ' + C.SUPPORTS[b.defSupport].name : ''}${b.curse ? ' ｜ 呪い−' + b.curse : ''}</div>`;
  const card = (sup) => `<div class="scardB"><div class="sflipB">
    <div class="sfaceB sbackB">❖</div>
    <div class="sfaceB sfrontB">${sup === 'none' ? '<div>─</div><div>支援なし</div>' : '<div style="font-size:24px">⚔</div><div>' + C.SUPPORTS[sup].name + '</div>'}</div>
  </div></div>`;
  $('bcards').innerHTML = card(b.atkSupport) + card(b.defSupport);
  $('bnotes').innerHTML = '';
  $('bcap').textContent = '支援カード ─ 同時オープン!';
  ['bAtk','bDef'].forEach(id => $(id).classList.remove('lungeL','lungeR','dead'));
  $('bresult').classList.remove('show'); $('bresult').innerHTML = '';
  hideLogo(true);
  bannerUntil = Math.max(bannerUntil, Date.now() + 8500); // 演出中はTURN START/バナーを待たせる
  $('battle').classList.add('on');
  await wait(900);
  document.querySelectorAll('.sflipB').forEach(f => f.classList.add('open'));
  await wait(1000);
  if (b.notes && b.notes.length)
    $('bnotes').innerHTML = b.notes.map(n => '✦ ' + n).join('<br>');
  $('bcap').textContent = '';
  await wait(900);
  const pop = (sideId, text, heal) => {
    const el = document.createElement('div');
    el.className = 'dmgPop' + (heal ? ' heal' : '');
    el.textContent = text;
    $(sideId).appendChild(el);
    setTimeout(() => el.remove(), 1200);
  };
  // HPゲージ+カウントダウン(数字だけでは減少量が分かりにくい)
  const animateHp = (barId, numId, from, to, max, ms = 900) => {
    const bar = $(barId), num = $(numId);
    const t0 = performance.now();
    const step = now => {
      const k = Math.min(1, (now - t0) / ms);
      const v = Math.round(from + (to - from) * k);
      const pct = Math.max(0, v / max * 100);
      if (bar) {
        bar.style.width = pct + '%';
        bar.style.background = pct > 50 ? 'linear-gradient(90deg,#7FD08A,#4E9E5C)'
          : pct > 25 ? 'linear-gradient(90deg,#E8C55A,#B8901F)' : 'linear-gradient(90deg,#D96A50,#A3402B)';
      }
      if (num) num.textContent = 'HP ' + Math.max(0, v);
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };
  animateHp('hpBarA', 'hpNumA', b.atkHp, b.atkHp, b.atkHp, 1);  // 初期表示(満タン)
  animateHp('hpBarD', 'hpNumD', b.hp, b.hp, b.hp, 1);
  // --- 先攻: 攻撃側の一撃 ---
  $('bcap').textContent = '攻撃側の一撃!';
  $('bAtk').classList.add('lungeL');
  await wait(320);
  $('bflash').classList.add('go'); $('battle').classList.add('shake');
  pop('bDef', '−' + b.dealt + (b.st > b.dealt ? '(DF−' + (b.st - b.dealt) + ')' : ''));
  animateHp('hpBarD', 'hpNumD', b.hp, b.win ? 0 : b.remainHp, b.hp);
  await wait(450);
  $('bflash').classList.remove('go'); $('battle').classList.remove('shake');
  $('bAtk').classList.remove('lungeL');
  if (b.win) {
    $('bDef').classList.add('dead');
    $('bcap').textContent = '';
    await wait(600);
    $('bresult').textContent = '侵略成功';
    $('bresult').classList.add('show');
    await wait(1800);
  } else {
    // 耐えた → 残HP表示と反撃
    $('bcap').textContent = `耐えた! 残りHP ${b.remainHp}(負傷は引き継ぐ)`;
    await wait(1100);
    $('bcap').textContent = '防衛側の反撃!';
    $('bDef').classList.add('lungeR');
    await wait(320);
    $('bflash').classList.add('go'); $('battle').classList.add('shake');
    pop('bAtk', '−' + b.counterDealt + (b.counterSt > b.counterDealt ? '(DF−' + (b.counterSt - b.counterDealt) + ')' : ''));
    animateHp('hpBarA', 'hpNumA', b.atkHp, b.atkSurvived ? Math.max(0, b.atkHp - b.counterDealt) : 0, b.atkHp);
    await wait(450);
    $('bflash').classList.remove('go'); $('battle').classList.remove('shake');
    $('bDef').classList.remove('lungeR');
    if (!b.atkSurvived) {
      $('bAtk').classList.add('dead');
      $('bcap').textContent = '';
    } else {
      pop('bAtk', '帰還(全快)', true);
      $('bcap').textContent = C.CREATURES[b.atkCreature].name + 'は耐えて手札に帰還';
    }
    await wait(900);
    $('bresult').textContent = '防衛成功';
    $('bresult').classList.add('show');
    await wait(1700);
  }
  $('battle').classList.remove('on');
  hideLogo(false);
  showBanner(b.win ? '侵略成功!' : sic('up') + ' 防衛成功!',
    b.win ? atk.name + 'が' + def.name + 'の土地を奪取!'
          : def.name + 'が耐え抜いた(残HP' + b.remainHp + ')');
  } finally { cutBusy = Math.max(0, cutBusy - 1); }
}

    if (state.lastEvent.type === 'shrine')
      queueBanner(`祠の加護 +${state.lastEvent.gold}G`,
        player(state.lastEvent.player).name + ' ─ 通算' + state.lastEvent.visits + '回参拝', 2800);
    else if (state.lastEvent.type === 'toll')
      playTollCutin(state.lastEvent);
    else if (state.lastEvent.type === 'bankrupt') {
      const bp = player(state.lastEvent.player);
      $('bkSub').textContent = bp ? bp.name + ' ─ 脱落' : '';
      $('bankruptCut').classList.add('on');
      bannerUntil = Math.max(bannerUntil, Date.now() + 4200);
      setTimeout(() => $('bankruptCut').classList.remove('on'), 4000);
    }
    else if (state.lastEvent.type === 'spell')
      queueBanner(sic('spell') + ' 呪文「' + state.lastEvent.name + '」 ─ ' + player(state.lastEvent.player).name,
        state.lastEvent.desc || (player(state.lastEvent.player).name + 'が唱えた'), 3600);
    else if (state.lastEvent.type === 'gate') {
      const gl = { g_up: sic('up') + ' 領地を強化', g_draft: sic('draft') + ' カードを引く',
                   g_forge: sic('forge') + ' 鍛錬 ─ クリーチャー進化', pass: '─ 何もしない' }[state.lastEvent.choice];
      if (gl) queueBanner('変化の門 ─ ' + gl,
        player(state.lastEvent.player).name + 'の選択', 2400);
    }
  }
  // 門通過 ─ 刻印取得のキャラカットイン
  if (state.lastSeal && state.lastSeal.at !== prev.sealAt) {
    prev.sealAt = state.lastSeal.at;
    const sp = player(state.lastSeal.player), sg = state.lastSeal.gold || 0;
    if (sp) bq.push(() => {
      bannerUntil = Math.max(bannerUntil, Date.now() + 2600);
      sideCut(sp, `<div class="tcWho">${sp.name} ─ 変化の門を通過</div>
        <div class="tcAmt plus">❖ 刻印を取得!${sg ? ` +${sg}G` : ''}</div>
        <div class="tcGold">城まで持ち帰ると一周ボーナス</div>`, 2400);
    });
  }
  // クリーチャー退場(スペル等でHP0) ─ マスにクローズアップ
  if (state.lastRuin && state.lastRuin.at !== prev.ruinAt) {
    prev.ruinAt = state.lastRuin.at;
    const ru = state.lastRuin;
    const rp = player(ru.player);
    bq.push(() => tileCloseup(ru.tile,
      `${rp ? rp.name + 'の' : ''}${state.catalog.CREATURES[ru.creature].name}は${ru.src}に蝕まれ力尽きた…<br>土地は空き地になった`));
  }
  // 称号の移動・リーチ到達を中央バナーで告知
  if (state.phase === 'playing') {
    const tk = JSON.stringify(state.titles);
    if (prev.titlesKey && tk !== prev.titlesKey) {
      const before = JSON.parse(prev.titlesKey);
      if (state.titles.conqueror !== before.conqueror && state.titles.conqueror)
        queueBanner(player(state.titles.conqueror).name + 'が称号「覇者」を獲得!', '資産+500G(奪い合い)', 2600);
      if (state.titles.pilgrim !== before.pilgrim && state.titles.pilgrim)
        queueBanner(player(state.titles.pilgrim).name + 'が称号「大巡礼者」を獲得!', '資産+500G(奪い合い)', 2600);
    }
    prev.titlesKey = tk;
    // 連鎖数の変動を告知(同属性2マス以上に関わる増減で地価倍率を表示)
    {
      const EJA2 = { fire: '火', water: '水', earth: '土', wind: '風' };
      const CHAIN_MUL2 = [0, 1.0, 1.4, 1.8, 2.2, 2.6];
      const ck2 = {};
      state.players.forEach(p => ['fire', 'water', 'earth', 'wind'].forEach(e => {
        ck2[p.id + ':' + e] = state.owners.filter((o, i) => o && o.player === p.id && state.tiles[i].e === e).length;
      }));
      if (prev.chainsKey) {
        const before = JSON.parse(prev.chainsKey);
        for (const [k, n] of Object.entries(ck2)) {
          const b0 = before[k] || 0;
          if (n === b0 || Math.max(n, b0) < 2) continue;
          const [pid2, e] = k.split(':');
          const pl2 = player(pid2);
          if (!pl2) continue;
          const mul = CHAIN_MUL2[Math.min(5, Math.max(1, n))];
          queueBanner(
            n > b0 ? `${EJA2[e]}の連鎖 ×${n}!` : `${EJA2[e]}の連鎖が ×${n} に減少…`,
            `${pl2.name}の${EJA2[e]}属性領地${n}つ ─ 地価倍率${mul}倍`, 2600);
        }
      }
      prev.chainsKey = JSON.stringify(ck2);
    }
    state.players.forEach(p => {
      const p0 = prev['pts_' + p.id];
      if (p0 !== undefined && p0 < (state.reachAt || state.target - 1) && p.points >= (state.reachAt || state.target - 1) && p.points < state.target)
        queueBanner(p.name + 'がラストスパート!', '総資産' + p.points + 'G ─ 8000Gで城を通過すれば勝利!', 2800);
      prev['pts_' + p.id] = p.points;
    });
  }
  // 手番プレイヤーの立ち絵(右下)
  if (state.phase === 'playing') {
    const tp = state.players[state.turn];
    if (tp && tp.charId) {
      if ($('tpImg').dataset.c !== tp.charId) {
        $('tpImg').src = '/assets/full_' + tp.charId + '.png';
        $('tpImg').dataset.c = tp.charId;
      }
      $('tpName').textContent = tp.name + 'の手番';
      $('turnPortrait').classList.add('show');
    }
  } else $('turnPortrait').classList.remove('show');
  // キューされたバナーを順に表示(移動中・別バナー表示中は待つ)
  if (bq.length && !animBusy && !cutBusy && Date.now() > bannerUntil) {
    const x = bq.shift();
    if (typeof x === 'function') x();  // 関数キュー: カットイン・クローズアップ等
    else showBanner(x[0], x[1], x[2]);
  }
  if (bq.length) { clearTimeout(prev.bqT); prev.bqT = setTimeout(render, 450); }
  updateTileInfo();
  updateDirCut();
  // TURN STARTテロップ ─ 祠・称号などのバナーを全て消化してから表示
  if (queuedTurn !== null && !animBusy && state.phase === 'playing') {
    const waitMs = bannerUntil + 400 - Date.now();
    if (waitMs > 0 || bq.length || cutBusy) {  // 前の演出が完全に終わるまでTURN STARTを出さない(基本設計思想)
      clearTimeout(prev.turnT);
      prev.turnT = setTimeout(render, Math.max(waitMs, 450) + 30);
    } else {
      // 鮮度チェック: 手番プレイヤーが既に行動を始めていたら(=pendingがroll以外)テロップは出さず破棄
      const tp0 = state.players[queuedTurn];
      const tpd = tp0 && state.pending[tp0.id];
      const fresh = state.turn === queuedTurn && tpd && tpd.type === 'roll';
      if (fresh && queuedTurn !== firedTurn) {
        firedTurn = queuedTurn;
        showTelop('turn', tp0.name + 'の手番');
        playTurnCutin(tp0);
      }
      queuedTurn = null;
    }
  }
  // ダイス
  if (state.lastDice && state.lastDice.at !== prev.dice) {
    prev.dice = state.lastDice.at;
    if (state.lastDice.multi) showDiceMulti(state.lastDice.multi);
    else showDice3D(state.lastDice.value);
  }
  // 戦闘
  if (state.lastBattle && state.lastBattle.at !== prev.battleAt) {
    prev.battleAt = state.lastBattle.at;
    playBattle(state.lastBattle);
  }
  // 勝利
  $('winOv').classList.toggle('on', state.phase === 'ended');
  if (state.phase === 'ended' && state.winner) {
    const w = player(state.winner);
    $('winArt').src = '/assets/full_' + w.charId + '.png';
    $('winText').textContent = `${w.name}(${state.catalog.CHARS[w.charId].name}) ─ 総資産${w.points}Gで勝利!`;
  }
}
fitWorld(); addEventListener('resize', fitWorld);
['redani','linnei','grease','mio'].forEach(c => { new Image().src = '/assets/full_' + c + '.png'; });
</script>
</body>
</html>
