<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CONCEPT | SUMMONS CODE</title>
  <meta name="description" content="SUMMONS CODEのコンセプトセクション試作">
  <link rel="stylesheet" href="./design-system.css">
  <link rel="stylesheet" href="./concept-section.css">
</head>
<body>
  <main>
    <section class="concept" aria-labelledby="concept-title">
      <div class="concept__watermark" aria-hidden="true"></div>
      <div class="concept__orbit concept__orbit--outer" aria-hidden="true"></div>
      <div class="concept__orbit concept__orbit--inner" aria-hidden="true"></div>

      <div class="concept__inner">
        <header class="concept__header">
          <img class="concept__wordmark" src="../assets/site/heading-concept-a.png" alt="CONCEPT">
          <p class="concept__index" aria-hidden="true">Ⅰ</p>
        </header>

        <div class="concept__grid">
          <div class="concept__copy">
            <p class="concept__eyebrow">BOARD GAME × DECK-BUILDING ROGUELIKE</p>
            <h1 class="concept__title" id="concept-title">カードを集め、デッキを作り、<br>領地を奪い合う。</h1>
            <div class="concept__rule" aria-hidden="true"><span></span></div>
            <p class="concept__lead">テレビで盤面を見ながら、スマホで手札を確認して操作する。</p>
            <p class="concept__body">戦闘や周回でカードを集めてデッキを作り、相手の領地を侵略し、自分の領地を守ります。サイコロとカードの「運」に、土地・デッキ・戦闘の「戦略」を重ねるゲームです。</p>

            <dl class="concept__features">
              <div><dt>01</dt><dd><b>テレビで盤面を見る</b><span>盤面と戦況をみんなで見届ける</span></dd></div>
              <div><dt>02</dt><dd><b>スマホで操作する</b><span>手札、カード、領地を手元で選ぶ</span></dd></div>
            </dl>
          </div>

          <div class="concept__visual" aria-label="テレビの共有盤面とスマホの手札を組み合わせたプレイイメージ">
            <div class="concept__sigil" aria-hidden="true"></div>
            <div class="concept__tv">
              <div class="concept__tv-screen">
                <span class="concept__tv-label">みんなで見る盤面</span>
                <i class="concept__route concept__route--a"></i>
                <i class="concept__route concept__route--b"></i>
                <i class="concept__route concept__route--c"></i>
              </div>
              <span class="concept__tv-stand" aria-hidden="true"></span>
            </div>

            <div class="concept__phone">
              <div class="concept__phone-speaker" aria-hidden="true"></div>
              <p>自分の手札</p>
              <div class="concept__cards">
                <img src="../assets/cards/spell-restore-art-v1.webp" alt="">
                <img src="../assets/cards/spell-flame-vortex-art-v1.webp" alt="">
                <img src="../assets/cards/spell-wind-turn-art-v1.webp" alt="">
              </div>
              <span>スマホがコントローラー</span>
            </div>

            <p class="concept__caption concept__caption--tv"><span>TV / PC</span>盤面と戦況を共有</p>
            <p class="concept__caption concept__caption--phone"><span>SMARTPHONE</span>手札を見て操作</p>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
